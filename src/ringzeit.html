<title>Ringzeit</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<style>
  /* Layout: quiet premium sports app — near-black ground, hairline panels with soft radius, thin condensed numerals, brass for state and focus, crimson only for kicks. Deliberately dark-only. */
  :root {
    --night: #0a0b0d;
    --panel: #121418;
    --panel2: #181b20;
    --frost: #ece8e1;
    --mist: #8c9099;
    --line: #24272d;
    --ice: #c9a86a;
    --ice-dim: #2b261c;
    --ember: #c8404a;
    --ember-dim: #2a1417;
    --done: #8ec9a4;
    --paper: #ece8e1;
    --ink: #0a0b0d;
    --display: "Saira Condensed", "Arial Narrow", sans-serif;
    --body: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "DM Mono", ui-monospace, Menlo, monospace;
    --r: 14px;
    color-scheme: dark;
  }
  html,
  body {
    background: var(--night);
    color: var(--frost);
  }
  html {
    min-height: 100%;
  }
  body {
    /* Short views must fill the screen too: iOS otherwise leaves the fixed
       navigation above the bottom after switching from a scrollable view. */
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(120% 60% at 50% -10%, #16181d 0%, var(--night) 60%);
    background-attachment: fixed;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 calc(92px + env(safe-area-inset-bottom, 0px));
  }
  * {
    box-sizing: border-box;
  }
  /* no zooming: no double-tap zoom, no pinch zoom – only scrolling */
  html,
  body {
    touch-action: pan-x pan-y;
  }
  button,
  input,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled {
    cursor: not-allowed;
  }
  :focus-visible {
    outline: 1.5px solid var(--ice);
    outline-offset: 2px;
  }
  .wrap {
    max-width: 620px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
  }
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding-top: 4px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ice);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .eyebrow i {
    display: inline-block;
    width: 20px;
    height: 1px;
    background: var(--ice);
  }
  .eyebrow em {
    font-style: normal;
    color: var(--ember);
  }
  h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 42px;
    line-height: 1.02;
    margin: 8px 0 0;
    letter-spacing: 0.005em;
    text-wrap: balance;
  }
  h2 {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--mist);
    margin: 0 0 10px 2px;
  }
  .lang {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
    flex: none;
  }
  .lang button {
    border: 0;
    background: none;
    padding: 5px 10px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--mist);
  }
  .lang button[aria-pressed="true"] {
    background: var(--frost);
    color: var(--ink);
  }
  .panel {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--r);
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
  }
  .row:first-child {
    border-top: 0;
  }
  .sub {
    font-size: 13px;
    color: var(--mist);
  }
  .note {
    border: 1px solid var(--line);
    border-left: 2px solid var(--ice);
    border-radius: 10px;
    background: var(--panel);
    padding: 12px 14px;
    font-size: 14px;
    color: var(--frost);
  }
  .note.act {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .note.warn {
    border-left-color: var(--ember);
  }
  .note.ok {
    border-left-color: var(--done);
  }
  .note b {
    color: var(--ice);
    font-weight: 600;
  }
  .note .btn.ghost {
    padding: 4px 0;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tg {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--mist);
    white-space: nowrap;
  }
  .tg.no {
    color: #e08a90;
    border-color: #3a2125;
  }
  .tg.ok {
    color: var(--ice);
    border-color: #4a3f2b;
  }
  /* hero */
  /* week */
  .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 0 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 0;
  }
  .day .d {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .day .n {
    font-family: var(--display);
    font-weight: 400;
    font-size: 22px;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .day .k {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    height: 13px;
    color: var(--mist);
  }
  .day.train .k {
    color: var(--ice);
  }
  .day.done {
    border-color: #3c4a40;
  }
  .day.done .k {
    color: var(--done);
  }
  .day.today {
    border-color: var(--ice);
  }
  .day.sel {
    background: var(--frost);
    color: var(--ink);
    border-color: var(--frost);
  }
  .day.sel .d,
  .day.sel .k {
    color: var(--ink);
  }
  .sess {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 0;
    border-top: 1px solid var(--line);
    background: none;
    width: 100%;
    text-align: left;
  }
  .sess:first-child {
    border-top: 0;
  }
  .code {
    width: 44px;
    height: 44px;
    flex: none;
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    border: 1px solid #4a3f2b;
    border-radius: 50%;
    color: var(--ice);
  }
  .code.T,
  .code.P,
  .code.C {
    border-color: #4a2a2e;
    color: #e08a90;
  }
  .code.M {
    border-color: #34473b;
    color: var(--done);
  }
  .sess .lbl {
    flex: 1;
    min-width: 0;
  }
  .sess .lbl b {
    font-family: var(--display);
    font-weight: 500;
    font-size: 19px;
  }
  .chev {
    color: var(--mist);
  }
  .check {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--done);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  /* controls */
  .seg {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 4px;
    background: var(--night);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
  }
  .seg.g2 {
    grid-auto-flow: row;
    grid-template-columns: 1fr 1fr;
  }
  .seg.g3 {
    grid-auto-flow: row;
    grid-template-columns: repeat(3, 1fr);
  }
  .seg.g5 {
    grid-template-columns: repeat(5, 1fr);
    grid-auto-flow: row;
  }
  .seg button {
    border: 0;
    border-radius: 9px;
    background: none;
    padding: 9px 6px;
    font-size: 14px;
    color: var(--mist);
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .seg button[aria-pressed="true"] {
    background: var(--panel2);
    color: var(--frost);
    box-shadow: inset 0 0 0 1px #4a3f2b;
    font-weight: 600;
  }
  .seg button:disabled {
    opacity: 0.3;
  }
  .seg button small {
    display: block;
    font-size: 11px;
    opacity: 0.75;
    font-weight: 400;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    padding: 8px 14px;
    font-size: 14px;
    color: var(--mist);
  }
  .chip[aria-pressed="true"] {
    border-color: var(--ice);
    color: var(--frost);
    background: var(--ice-dim);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
  }
  .field + .field {
    border-top: 1px solid var(--line);
  }
  .lab {
    font-size: 14px;
    font-weight: 600;
  }
  input[type="date"],
  input[type="number"],
  input[type="text"],
  textarea {
    background: var(--night);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    width: 100%;
    font-size: 16px; /* below 16px iOS zooms in on focus */
  }
  input:focus,
  textarea:focus {
    border-color: var(--ice);
    outline: none;
  }
  textarea {
    min-height: 76px;
    resize: vertical;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--ice);
  }
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 15px 16px;
    font-family: var(--body);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.01em;
    background: var(--frost);
    color: var(--ink);
    width: 100%;
  }
  .btn.sec {
    background: transparent;
    color: var(--frost);
    border: 1px solid var(--line);
  }
  .btn.ghost {
    background: none;
    color: var(--ice);
    padding: 8px;
    width: auto;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .btn:disabled {
    opacity: 0.35;
  }
  /* session */
  .block {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--r);
    overflow: hidden;
  }
  .bhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .bhead b {
    font-family: var(--display);
    font-weight: 500;
    font-size: 22px;
  }
  .bhead span {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--mist);
    text-align: right;
  }
  .ex {
    display: flex;
    gap: 14px;
    padding: 13px 16px;
    border-top: 1px solid var(--line);
    transition: background 0.25s;
  }
  .bhead + .ex,
  .legend + .ex {
    border-top: 0;
  }
  .ex .num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--mist);
    width: 30px;
    flex: none;
    padding-top: 3px;
  }
  .ex .num.r {
    color: var(--ice);
  }
  .ex .tx {
    min-width: 0;
    flex: 1;
  }
  .ex .tx b {
    font-weight: 600;
  }
  .ex .tx div {
    font-size: 14px;
    color: var(--mist);
  }
  .ex.cur {
    background: linear-gradient(90deg, rgba(201, 168, 106, 0.14), transparent 85%);
    box-shadow: inset 2px 0 0 var(--ice);
  }
  .ex.cur .num {
    color: var(--frost);
  }
  .ex.cur.resting {
    background: linear-gradient(90deg, rgba(142, 201, 164, 0.1), transparent 85%);
    box-shadow: inset 2px 0 0 var(--done);
  }
  /* completed rounds: green bar, tick, struck-through title */
  .ex.past {
    opacity: 0.55;
    box-shadow: inset 2px 0 0 var(--done);
  }
  .ex.past .num {
    color: var(--done);
  }
  .ex.past .num::after {
    content: " ✓";
    color: var(--done);
  }
  .ex.past .tx > b,
  .ex.past .tx > .exn b {
    text-decoration: line-through;
    text-decoration-color: var(--done);
    text-decoration-thickness: 2px;
  }
  /* completed sets */
  .sets .sl.ok {
    color: var(--done);
  }
  .sets .sl.ok::after {
    content: " ✓";
  }
  .sets .si.ok {
    border-color: color-mix(in srgb, var(--done) 55%, var(--line));
    background: color-mix(in srgb, var(--done) 9%, var(--night));
    color: var(--frost);
    font-weight: 600;
  }
  .combo {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
  }
  .combo span {
    font-family: var(--mono);
    font-size: 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 7px;
    color: var(--frost);
    background: var(--night);
  }
  .combo span.k {
    border-color: #4a2a2e;
    color: #e08a90;
  }
  .combo span i {
    font-style: normal;
    font-weight: 500;
    margin-left: 6px;
    color: var(--ice);
  }
  .combo span.k i {
    color: var(--ember);
  }
  .legend {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--mist);
    padding: 9px 16px;
    border-bottom: 1px solid var(--line);
  }
  .legend i {
    font-style: normal;
    color: var(--ice);
  }
  .timer {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    z-index: 5;
    overflow: hidden;
    background: rgba(18, 20, 24, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid #3a3426;
    border-radius: 16px;
    padding: 16px 18px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  }
  .timer.rest {
    border-color: #2f3d34;
  }
  .timer .clock {
    font-family: var(--display);
    font-weight: 300;
    font-size: 60px;
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .timer .info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .timer .ph {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ice);
  }
  .timer.rest .ph {
    color: var(--done);
  }
  .timer .tr {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--mist);
  }
  .timer .tb {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .timer .tb button {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: none;
    padding: 9px 14px;
    font-weight: 600;
    font-size: 14px;
    color: var(--frost);
  }
  .timer .tb button:first-child {
    background: var(--frost);
    color: var(--ink);
    border-color: var(--frost);
  }
  .timer .bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--line);
  }
  .timer .bar span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--ice);
    transition: width 1s linear;
  }
  .timer.rest .bar span {
    background: var(--done);
  }
  /* stats & charts */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 14px;
    min-width: 0;
  }
  .stat .v {
    font-family: var(--display);
    font-weight: 300;
    font-size: 34px;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .stat .k {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mist);
    margin-top: 4px;
  }
  .stat.hot .v {
    color: var(--ice);
  }
  .chart {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 14px 14px 8px;
  }
  .chart svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .empty {
    border: 1px dashed var(--line);
    border-radius: var(--r);
    padding: 24px 18px;
    text-align: center;
    color: var(--mist);
    font-size: 14px;
  }
  .empty b {
    display: block;
    color: var(--frost);
    font-family: var(--display);
    font-weight: 500;
    font-size: 20px;
    margin-bottom: 4px;
  }
  .logi {
    display: flex;
    gap: 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    align-items: center;
  }
  .logi:first-child {
    border-top: 0;
  }
  .logi .rpe {
    font-family: var(--display);
    font-weight: 400;
    font-size: 24px;
    width: 34px;
    text-align: center;
  }
  .sets {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 6px 8px;
    align-items: center;
    margin-top: 10px;
  }
  .sets.nokg {
    grid-template-columns: auto minmax(0, 1fr) auto;
  }
  .sets .sl {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--mist);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .sets .hd {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .sets input {
    padding: 7px 10px;
    font-variant-numeric: tabular-nums;
    font-size: 16px; /* below 16px iOS zooms in on focus */
  }
  .sets input::placeholder {
    color: var(--mist);
    opacity: 0.55;
    font-style: italic;
  }
  .sets .x {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: none;
    color: var(--mist);
    width: 32px;
    height: 34px;
  }
  .setfoot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .last {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ice);
  }
  .inline {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .inline input {
    flex: 1;
    min-width: 0;
  }
  .inline .btn {
    width: auto;
    padding: 11px 18px;
  }
  .inline .u {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--mist);
  }
  .foot {
    font-size: 12px;
    color: var(--mist);
    line-height: 1.7;
  }
  .foot a {
    color: var(--ice);
  }
  /* test */
  .radar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 14px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 14px;
  }
  .radar svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .score {
    font-family: var(--display);
    font-weight: 300;
    font-size: 52px;
    line-height: 1;
  }
  .score small {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--mist);
  }
  .lvl {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 120px;
  }
  .how {
    font-size: 13px;
    color: var(--mist);
  }
  .res {
    font-family: var(--mono);
    color: var(--ice);
  }
  @media (max-width: 420px) {
    .radar {
      grid-template-columns: 1fr;
    }
  }
  /* tab bar */
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    background: rgba(10, 11, 13, 0.86);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--line);
    padding: 8px max(6px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px))
      max(6px, env(safe-area-inset-left, 0px));
    display: grid;
    grid-template-columns: repeat(6, 1fr);
  }
  .tabbar .tabft i {
    display: grid;
    place-items: center;
    color: var(--c-T);
  }
  .tabbar .tabft svg {
    width: 22px;
    height: 22px;
  }
  .tabbar button {
    border: 0;
    background: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 2px 0;
    color: var(--mist);
    min-width: 0;
  }
  .tabbar svg {
    width: 22px;
    height: 22px;
  }
  .tabbar span {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .tabbar button[aria-current="page"] {
    color: var(--frost);
  }
  .tabbar button[aria-current="page"] svg {
    color: var(--ice);
  }
  /* loader */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: radial-gradient(90% 60% at 50% 35%, #16181d, var(--night) 70%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    overflow: hidden;
    cursor: pointer;
    padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px))
      calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  }
  .loader .burst {
    position: absolute;
    width: min(560px, 140vw);
    height: auto;
    left: 50%;
    top: 35%;
    transform: translate(-50%, -50%);
    opacity: 0.6;
  }
  .loader .fig {
    position: relative;
    width: min(340px, 86vw);
  }
  .loader .lt {
    position: relative;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ice);
  }
  .fact {
    position: relative;
    max-width: 420px;
    background: rgba(18, 20, 24, 0.9);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .fact .fk {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ice);
  }
  .fact.tip .fk {
    color: var(--done);
  }
  .fact p {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 21px;
    line-height: 1.35;
    text-wrap: pretty;
  }
  .fact .src {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--mist);
  }
  .loader .btn.ghost {
    position: relative;
  }
  .loader .hint {
    position: relative;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mist);
  }
  .toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    z-index: 70;
    background: var(--frost);
    color: var(--ink);
    border-radius: 18px;
    padding: 10px 18px;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.35;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    width: max-content;
    max-width: min(340px, calc(100% - 32px));
  }
  @keyframes rot {
    to {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }
  .loader:not([hidden]) .burst {
    animation: rot 60s linear infinite;
  }
  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  .loader:not([hidden]) .fact {
    animation: rise 0.5s ease-out both;
  }
  @media (prefers-reduced-motion: reduce) {
    .loader .burst,
    .loader .fact {
      animation: none !important;
    }
    .timer .bar span {
      transition: none;
    }
  }
  @media (max-width: 380px) {
    h1 {
      font-size: 34px;
    }
    .timer .clock {
      font-size: 48px;
    }
    .stat .v {
      font-size: 26px;
    }
    .seg button {
      font-size: 13px;
    }
  }

  /* ===== Life: type colours, motion, feedback (all motion respects prefers-reduced-motion) ===== */
  :root {
    --c-T: #d9545c;
    --c-C: #e0914a;
    --c-P: #e5683c;
    --c-S: #c9a86a;
    --c-K: #5fb3a6;
    --c-M: #8ec9a4;
  }
  .code[style],
  .sess .code {
    border-color: color-mix(in srgb, var(--tc) 45%, transparent) !important;
    color: var(--tc) !important;
    background: color-mix(in srgb, var(--tc) 12%, transparent) !important;
  }
  .sess {
    position: relative;
  }
  .sess::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    bottom: 14px;
    width: 2px;
    border-radius: 2px;
    background: var(--tc, transparent);
    opacity: 0.8;
  }
  .day.train .k {
    color: var(--tc, var(--ice)) !important;
  }
  .day.sel .k {
    color: var(--ink) !important;
  }
  button,
  .chip,
  .seg button,
  .day,
  .sess {
    transition:
      transform 0.15s ease,
      background-color 0.2s ease,
      border-color 0.2s ease,
      color 0.2s ease;
  }
  button:active:not(:disabled) {
    transform: scale(0.97);
  }
  .sess:active {
    background: rgba(236, 232, 225, 0.04);
  }
  @keyframes lift {
    from {
      opacity: 0.35;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  .wrap.enter > * {
    animation: lift 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .wrap.enter > *:nth-child(2) {
    animation-delay: 0.04s;
  }
  .wrap.enter > *:nth-child(3) {
    animation-delay: 0.08s;
  }
  .wrap.enter > *:nth-child(4) {
    animation-delay: 0.12s;
  }
  .wrap.enter > *:nth-child(5) {
    animation-delay: 0.16s;
  }
  .wrap.enter > *:nth-child(n + 6) {
    animation-delay: 0.2s;
  }
  @keyframes bob {
    0%,
    100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(2.5px);
    }
  }
  .loader .bob {
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,
    100% {
      opacity: 0.15;
    }
    50% {
      opacity: 0.8;
    }
  }
  @keyframes breathe {
    0%,
    100% {
      opacity: 0.7;
    }
    50% {
      opacity: 1;
    }
  }
  .pulse {
    display: grid;
    grid-template-columns: auto 1fr 1fr;
    gap: 14px;
    align-items: center;
    padding: 14px 16px;
  }
  .pulse .ring {
    width: 72px;
    height: 72px;
    position: relative;
  }
  .pulse .ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  @keyframes fill {
    from {
      stroke-dashoffset: 188.5;
    }
  }
  .pulse .ring .arc {
    animation: fill 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .pulse .ring b {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-weight: 400;
    font-size: 22px;
  }
  .pulse .pv {
    font-family: var(--display);
    font-weight: 300;
    font-size: 32px;
    line-height: 1;
  }
  .pulse .pk {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mist);
    margin-top: 4px;
  }
  .pulse .hot {
    color: var(--c-C);
  }
  @keyframes urgent {
    0%,
    100% {
      color: var(--frost);
    }
    50% {
      color: var(--ember);
    }
  }
  .timer.last .clock {
    animation: urgent 1s steps(2) infinite;
  }
  .timer.on {
    border-color: var(--ice);
    box-shadow:
      0 0 0 1px rgba(201, 168, 106, 0.25),
      0 12px 30px rgba(0, 0, 0, 0.45);
  }
  .spark {
    position: fixed;
    z-index: 60;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    pointer-events: none;
    animation: spark 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  @keyframes spark {
    from {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }
    to {
      transform: translate(var(--dx), var(--dy)) scale(0.3);
      opacity: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .wrap.enter > *,
    .loader .bob,
    .timer.last .clock,
    .pulse .ring .arc {
      animation: none !important;
    }
    .spark {
      display: none;
    }
  }

  /* ===== Natural iOS look (after Apple Fitness / Strava): system type, sentence case, soft cards ===== */
  :root {
    --display: -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --body: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --num: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 20px;
    --panel: #15171c;

  }

  /* ===== B: Today card with a big start button ===== */
  .today {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    background: var(--panel);
  }
  .today .greet {
    margin: 12px 18px -4px;
    width: fit-content;
    padding: 5px 12px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--ice) 14%, transparent);

    font-weight: 700;

  /* ===== Success moments: summary after a session ===== */
  .win {
    position: fixed;
    inset: 0;
    z-index: 55;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
    padding: calc(34px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(90% 55% at 50% 18%, color-mix(in srgb, var(--tc) 30%, transparent), transparent 70%),
      #0a0b0d;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .win.in {
    opacity: 1;
  }
  .win.out {
    opacity: 0;
    transition-duration: 0.22s;
  }
  .wcheck {
    position: relative;
    width: 116px;
    height: 116px;

  .wcheck svg {

    height: 100%;
    overflow: visible;
  }
  .wcheck .c {
    fill: color-mix(in srgb, var(--tc) 18%, transparent);
    stroke: var(--tc);
    stroke-width: 6;
    stroke-dasharray: 327;
    stroke-dashoffset: 327;
    transform: rotate(-90deg);
    transform-origin: 60px 60px;
  }
  .wcheck .k {
    fill: none;
    stroke: var(--frost);
    stroke-width: 9;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 70;
    stroke-dashoffset: 70;
  }
  .wcheck .ray {
    stroke: var(--tc);
    stroke-width: 4;
    stroke-linecap: round;
    opacity: 0;
  }
  .in .wcheck .c,
  .fdone .wcheck .c,
  .ftdone .wcheck .c {
    animation: wDraw 0.6s 0.1s cubic-bezier(0.6, 0, 0.3, 1) forwards;
  }
  .in .wcheck .k,
  .fdone .wcheck .k,
  .ftdone .wcheck .k {
    animation: wDraw 0.35s 0.6s ease-out forwards;
  }
  .in .wcheck .ray,
  .fdone .wcheck .ray,
  .ftdone .wcheck .ray {
    animation: wRay 0.7s 0.75s ease-out forwards;
  }
  .in .wcheck,
  .fdone .wcheck,
  .ftdone .wcheck {
    animation: wPop 0.5s 0.55s cubic-bezier(0.2, 1.6, 0.4, 1) both;
  }
  @keyframes wDraw {
    to {
      stroke-dashoffset: 0;
    }
  }
  @keyframes wRay {
    0% {
      opacity: 0;
      stroke-dasharray: 0 30;
    }
    40% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      stroke-dasharray: 14 30;
      stroke-dashoffset: -16;
    }
  }
  @keyframes wPop {
    0% {
      transform: scale(1);
    }
    40% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  .ftdone .wcheck .c {
    fill: rgba(255, 255, 255, 0.12);
    stroke: #fff;
  }
  .ftdone .wcheck .ray {
    stroke: #fff;
  }

  .win > :nth-child(4) {

  /* ===== Timer: splash at round start and end, heartbeat in the last 10 seconds ===== */
  .tfx {
    position: fixed;
    inset: 0;
    z-index: 58;
    pointer-events: none;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .tfx::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.5), transparent 62%);
    animation: tfxFlash 0.8s ease-out forwards;
  }
  .tfx.end::before {
    background: radial-gradient(circle at 50% 40%, rgba(142, 201, 164, 0.55), transparent 65%);
  }
  .tfx.done::before {
    background: radial-gradient(circle at 50% 40%, rgba(201, 168, 106, 0.6), transparent 68%);
  }
  .tfx i {
    position: absolute;
    left: 50%;
    top: 40%;
    width: 140px;
    height: 140px;
    margin: -70px 0 0 -70px;
    border-radius: 50%;
    border: 5px solid rgba(255, 255, 255, 0.9);
    animation: tfxWave 0.9s ease-out forwards;
  }
  .tfx b {
    position: relative;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(40px, 13vw, 68px);
    line-height: 1.05;
    text-align: center;
    padding: 0 20px;
    color: #fff;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
    animation: tfxText 1.4s cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
  }
  @keyframes tfxFlash {
    from {
      opacity: 1;
    }
    to {
      opacity: 0;
    }
  }
  @keyframes tfxWave {
    from {
      transform: scale(0.3);
      opacity: 0.9;
    }
    to {
      transform: scale(4.5);
      opacity: 0;
    }
  }
  @keyframes tfxText {
    0% {
      transform: scale(0.4);
      opacity: 0;
    }
    22% {
      transform: scale(1.08);
      opacity: 1;
    }
    38% {
      transform: scale(1);
    }
    78% {
      opacity: 1;
    }
    100% {
      transform: scale(1.03);
      opacity: 0;
    }
  }
  .fknob {
    transform-origin: 140px 140px;
    transition: transform 1s linear;
  }
  .ftimer .fknob {
    transition-duration: 0.25s;
  }
  .focus.last .fring,
  .ftimer.run.last .fring {
    animation: ringBeat 1s ease-in-out infinite;
  }
  @keyframes ringBeat {
    0%,
    100% {
      transform: scale(1);
    }
    12% {
      transform: scale(1.04);
    }
    30% {
      transform: scale(1);
    }
  }
  .focus.last #farc,
  .focus.last .fknob circle {
    stroke: var(--ember);
    fill: var(--ember);
    fill-opacity: 0;
  }
  .focus.last .fknob circle {
    fill-opacity: 1;
  }
  .focus.last .fring svg,
  .ftimer.run.last .fring svg {
    filter: drop-shadow(0 0 12px rgba(255, 90, 100, 0.7));
  }
  .focus.last .clk {
    animation: ftpulse 1s ease-in-out infinite;
  }
  .focus::after,
  .ftimer.run::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    box-shadow: inset 0 0 140px 40px rgba(200, 64, 74, 0.5);
  }
  .ftimer.run::after {
    box-shadow: inset 0 0 140px 40px rgba(255, 255, 255, 0.28);
  }
  .focus.last::after,
  .ftimer.run.last::after {
    animation: vign 1s ease-in-out infinite;
  }
  @keyframes vign {
    0%,
    100% {
      opacity: 0.25;
    }
    50% {
      opacity: 1;
    }
  }
  .fdone .wcheck,
  .ftdone .wcheck {

  /* ===== Today: living hero (time of day, exchange of blows, dust in the light) ===== */
  .today .bob {
    animation: bob 1.8s ease-in-out infinite;
  }
  .today .tw {
    animation: twinkle 3.4s ease-in-out infinite;
  }
  .today .glow {
    animation: breathe 6s ease-in-out infinite;
  }
  .today .pa,
  .today .pb,
  .today .hitfx,
  .today .kb {
    animation-duration: 4.2s;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
  }
  .today .pa {
    animation-name: poseA;
  }
  .today .pb {
    animation-name: poseB;
    opacity: 0;
  }
  .today .def .pa {
    animation-name: poseAd;
  }
  .today .def .pb {
    animation-name: poseBd;
  }
  @keyframes poseA {
    0%,
    69.9% {
      opacity: 1;
    }
    70%,
    81.9% {
      opacity: 0;
    }
    82%,
    100% {
      opacity: 1;
    }
  }
  @keyframes poseB {
    0%,
    69.9% {
      opacity: 0;
    }
    70%,
    81.9% {
      opacity: 1;
    }
    82%,
    100% {
      opacity: 0;
    }
  }
  @keyframes poseAd {
    0%,
    67.9% {
      opacity: 1;
    }
    68%,
    83.9% {
      opacity: 0;
    }
    84%,
    100% {
      opacity: 1;
    }
  }
  @keyframes poseBd {
    0%,
    67.9% {
      opacity: 0;
    }
    68%,
    83.9% {
      opacity: 1;
    }
    84%,
    100% {
      opacity: 0;
    }
  }
  .today .kb {
    animation-name: knock;
  }
  @keyframes knock {
    0%,
    71% {
      transform: translateX(0);
    }
    74% {
      transform: translateX(-5px);
    }
    82%,
    100% {
      transform: translateX(0);
    }
  }
  .today .hitfx {
    animation-name: hit;
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
  }
  @keyframes hit {
    0%,
    71% {
      opacity: 0;
      transform: scale(0.3);
    }
    74% {
      opacity: 1;
      transform: scale(1);
    }
    82% {
      opacity: 0;
      transform: scale(1.5);
    }
    100% {
      opacity: 0;
    }
  }
  .today .dust {
    animation: dust linear infinite;
  }
  @keyframes dust {
    0% {
      transform: translateY(0);
      opacity: 0;
    }
    20%,
    70% {
      opacity: var(--o, 0.5);
    }
    100% {
      transform: translateY(-46px);
      opacity: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .win,
    .win > *,
    .wcheck,
    .wcheck *,
    .wmed::after,
    .wflame svg,
    .wring .arc,
    .focus.last .fring,
    .ftimer.run.last .fring,
    .focus.last .clk,
    .focus.last::after,
    .ftimer.run.last::after,
    .today .bob,
    .today .tw,
    .today .glow,
    .today .dust,
    .today .pa,
    .today .pb,
    .today .hitfx,
    .today .kb {
      animation: none !important;
      transition: none !important;
    }
    .wcheck .c,
    .wcheck .k {
      stroke-dashoffset: 0;
    }
    .win {
      opacity: 1;

    .tfx {

      const sc = `<circle class="${i % 3 ? "" : "tw"}" style="animation-delay:${(srand() * 3).toFixed(2)}s" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="#ECE8E1" opacity="${(0.2 + srand() * 0.5).toFixed(2)}"/>`;
      if (i < sky.stars) stars += sc;
    }
    const se = season();
    // seasonal particles: petals, leaves or snow fall through the scene; in summer (and with the design off) dust floats in the light
    const pk = se ? (se.ev === "valentine" ? "hearts" : se.ev === "karneval" ? "confetti" : se.k) : null;
    if (pk && pk !== "summer") {
      const N = pk === "winter" ? 34 : pk === "confetti" ? 40 : 16,
        cols = {
          spring: ["#F48FB1", "#F8BBD0", "#FFFFFF"],
          autumn: ["#E0914A", "#C8404A", "#D9A441"],
          winter: ["#FFFFFF"],
          hearts: ["#FF5A7A", "#FF8FA3", "#E8445A"],
          confetti: ["#FF5A5F", "#FFD23F", "#58D68D", "#5DADE2", "#C77DFF"],
        }[pk];
      for (let i = 0; i < N; i++) {
        const x = srand() * 420 - 10,
          col = cols[i % cols.length],
          dur = (se.k === "winter" ? 7 : 9) + srand() * 6,
          sh =
            pk === "hearts"
              ? `<path d="M0 4 C-7 -1 -4 -8 0 -3.5 C4 -8 7 -1 0 4Z" fill="${col}" opacity=".95"/>`
              : pk === "confetti"
                ? `<rect x="-2.5" y="-1.5" width="5" height="3" fill="${col}"/>`
                : pk === "winter"
                  ? `<circle r="${(0.8 + srand() * 1.6).toFixed(2)}" fill="${col}" opacity="${(0.5 + srand() * 0.5).toFixed(2)}"/>`
                  : se.k === "spring"
                    ? `<ellipse rx="3.6" ry="2.3" fill="${col}" opacity=".95"/>`
                    : `<path d="M0 -6.5 Q5 0 0 6.5 Q-5 0 0 -6.5Z M0 -6.5 V6.5" fill="${col}" stroke="rgba(0,0,0,.25)" stroke-width=".8" opacity=".95"/>`;
        dust += `<g transform="translate(${x.toFixed(1)} -8)"><g class="fall" style="animation-duration:${dur.toFixed(1)}s;animation-delay:-${(srand() * dur).toFixed(1)}s;--dx:${((srand() - 0.5) * 60).toFixed(0)}px;--rot:${(srand() * 540 - 270).toFixed(0)}deg">${sh}</g></g>`;
      }
    }
    for (let i = 0; i < (pk && pk !== "summer" ? 0 : 12); i++) {
      const yy = 60 + srand() * 140,
        x = 200 + (srand() - 0.5) * (60 + yy * 0.9);
      dust += `<circle class="dust" style="animation-duration:${(5 + srand() * 5).toFixed(1)}s;animation-delay:-${(srand() * 8).toFixed(1)}s;--o:${(0.25 + srand() * 0.45).toFixed(2)}" cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" r="${(0.6 + srand() * 1.1).toFixed(2)}" fill="#F3EEE4"/>`;
    }
    const se2 = season(),
      tint = se2
        ? {
            spring: "#8ec9a4",
            summer: "#F2B36B",
            autumn: "#E0914A",
            winter: "#9FB8D9",
          }[se2.k]
        : null;
    let extra = "";
    const ev = se2 && se2.ev;
    // lanterns for Ramadan and Eid (with stars at Eid)
    const lanterns = () => {
      let h = `<g transform="translate(330 40)"><circle r="16" fill="#F6E7B0"/><circle cx="7" cy="-5" r="15" fill="url(#sky)"/></g>`;
      [
        [70, 34],

        h += `<line x1="${x}" y1="0" x2="${x}" y2="${l}" stroke="#6b5a35" stroke-width="1.5"/><g class="bulb" style="animation-delay:${i * 0.6}s"><path d="M${x - 7} ${l + 4} h14 l-3 18 h-8z" fill="#E0A63A" stroke="#7a5418" stroke-width="1.5"/><rect x="${x - 4}" y="${l + 8}" width="8" height="10" rx="2" fill="#FFE7A3"/><path d="M${x - 5} ${l + 4} l5 -5 l5 5z" fill="#7a5418"/></g>`;
      });
      return h;
    };
    if (ev === "ramadan") extra += lanterns();
    else if (ev === "eidfitr" || ev === "eidadha") {
      extra += lanterns();
      [
        [40, 70],
        [170, 40],
        [236, 60],
        [370, 92],
      ].forEach(([x, y], i) => {
        extra += `<path class="bulb" style="animation-delay:${i * 0.4}s" d="M${x} ${y - 6} l1.8 4.2 l4.2 1.8 l-4.2 1.8 l-1.8 4.2 l-1.8 -4.2 l-4.2 -1.8 l4.2 -1.8z" fill="#FFE7A3"/>`;
      });
    } else if (ev === "hanukkah") {
      // hanukkiah: eight candles plus the raised shamash in the middle; tonight's candles burn
      const n = hanukkahDay(ui.seasonDate ? parse(ui.seasonDate) : today());
      let c = `<g transform="translate(200 178)"><path d="M-40 0 h80 M0 0 v22 M-14 22 h28" stroke="#C9A86A" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      for (let i = 0; i < 9; i++) {
        const x = -40 + i * 10,
          sham = i === 4,
          y = sham ? -18 : -10,
          lit = sham || (i < 4 ? 8 - i : 9 - i) <= n;
        c += `<rect x="${x - 2}" y="${y}" width="4" height="${-y}" fill="#ECE8E1"/>`;
        if (lit) c += `<ellipse class="flame" cx="${x}" cy="${y - 4}" rx="2.2" ry="3.6" fill="#FFC94A"/>`;
      }
      extra += c + `</g>`;
    } else if (ev === "diwali") {
      // a row of diyas (clay lamps) on the floor
      for (let i = 0; i < 5; i++) {
        const x = 152 + i * 24;
        extra += `<g transform="translate(${x} 196)"><path d="M-9 0 Q0 9 9 0 Z" fill="#B5562A" stroke="#6E2F12" stroke-width="1.5"/><ellipse class="flame" cx="0" cy="-5" rx="2.4" ry="4.4" fill="#FFC94A"/><circle cx="0" cy="-4" r="9" fill="#FFC94A" opacity=".12"/></g>`;
      }
    } else if (ev === "easter") {
      [
        [176, 200, "#F48FB1", "#FFFFFF"],
        [200, 196, "#5DADE2", "#FFD23F"],
        [224, 200, "#FFD23F", "#58D68D"],
      ].forEach(([x, y, a, b]) => {
        extra += `<g transform="translate(${x} ${y})"><ellipse rx="8" ry="10.5" fill="${a}" stroke="#111318" stroke-width="2"/><path d="M-7.5 -2 q3.75 3 7.5 0 t7.5 0" fill="none" stroke="${b}" stroke-width="2.4"/><path d="M-6 4 h12" stroke="${b}" stroke-width="2" stroke-dasharray="2 2"/></g>`;
      });
      extra += `<path d="M160 206 l4 -7 l3 7 l4 -8 l3 8 l4 -6 l3 6 M226 206 l4 -7 l3 7 l4 -8 l3 8" stroke="#58D68D" stroke-width="2" fill="none"/>`;
    } else if (ev === "nouruz") {
      // sabzeh: sprouted wheat in a bowl, tied with a red ribbon
      let blades = "";
      for (let i = 0; i < 13; i++) {
        const x = -14 + i * 2.3;
        blades += `<path d="M${x.toFixed(1)} 0 q${(Math.sin(i) * 3).toFixed(1)} -12 ${(Math.sin(i * 1.7) * 2).toFixed(1)} -${16 + (i % 3) * 3}" stroke="#58D68D" stroke-width="2" fill="none" stroke-linecap="round"/>`;
      }
      extra += `<g transform="translate(200 192)">${blades}<path d="M-18 0 h36 l-5 12 h-26z" fill="#5DADE2" stroke="#111318" stroke-width="2"/><path d="M-17 4 h34" stroke="#E8445A" stroke-width="2.5"/></g>`;
    } else if (ev === "summer") {
      extra += `<circle cx="200" cy="206" r="60" fill="#FFB347" opacity=".18"/><circle cx="200" cy="214" r="24" fill="#FFB347" opacity=".45"/>`;
    }
    if (ev === "advent" || ev === "christmas") {
      // string of lights across the top
      let bulbs = "";
      for (let i = 0; i <= 14; i++) {
        const x = 10 + i * 27.1,
          y = 12 + Math.sin((i / 14) * Math.PI) * 16;
        bulbs += `<circle class="bulb" style="animation-delay:${(i % 4) * 0.45}s" cx="${x.toFixed(1)}" cy="${(y + 5).toFixed(1)}" r="3.6" fill="${["#FF5A5F", "#FFD23F", "#58D68D", "#5DADE2"][i % 4]}"/>`;
      }
      extra += `<path d="M10 12 Q200 44 390 12" fill="none" stroke="#2c3038" stroke-width="1.5"/>${bulbs}`;
    } else if (ev === "newyear") {
      [
        [80, 46, "#FFD23F", 0],
        [300, 38, "#FF5A5F", 0.7],
        [196, 26, "#5DADE2", 1.4],
      ].forEach(([x, y, c, dl]) => {
        let rays = "";
        for (let a = 0; a < 360; a += 30) {
          const r = (a * Math.PI) / 180;
          rays += `<line x1="${(Math.cos(r) * 6).toFixed(1)}" y1="${(Math.sin(r) * 6).toFixed(1)}" x2="${(Math.cos(r) * 24).toFixed(1)}" y2="${(Math.sin(r) * 24).toFixed(1)}"/>`;
        }
        extra += `<g transform="translate(${x} ${y})"><g class="fw" style="animation-delay:${dl}s" stroke="${c}" stroke-width="2.2" stroke-linecap="round">${rays}</g></g>`;
      });
    } else if (ev === "halloween") {
      extra += `<g transform="translate(200 190)"><ellipse rx="17" ry="13" fill="#E8761F" stroke="#111318" stroke-width="2.5"/><path d="M-6 -12 Q0 -16 6 -12 M-9 -10 Q-12 0 -8 11 M9 -10 Q12 0 8 11" fill="none" stroke="#B85A12" stroke-width="2"/><path d="M0 -13 q1 -6 5 -8" stroke="#4E7A35" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M-9 -3 l4 -4 l4 4z M1 -3 l4 -4 l4 4z" fill="#FFD23F"/><path d="M-8 4 q8 6 16 0 l-3 2 l-2 -2 l-3 2 l-3 -2 l-2 2z" fill="#FFD23F"/></g>`;
    }
    const orb = sky.sun
      ? `<circle cx="70" cy="170" r="90" fill="url(#orb)"/>`
      : sky.moon
        ? `<circle cx="338" cy="38" r="11" fill="#ECE8E1" opacity=".75"/><circle cx="343" cy="34" r="10" fill="url(#sky)"/>`
        : "";
    return `<svg viewBox="0 0 400 220" role="img" aria-label="Ringzeit">
 <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky.top}"/><stop offset="1" stop-color="#0A0B0D"/></linearGradient>
 <radialGradient id="orb" cx="70" cy="170" r="90" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F2B36B" stop-opacity=".42"/><stop offset="1" stop-color="#F2B36B" stop-opacity="0"/></radialGradient>
 <radialGradient id="glow" cx="200" cy="120" r="170" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${sky.glow}" stop-opacity=".26"/><stop offset=".5" stop-color="${sky.glow}" stop-opacity=".07"/><stop offset="1" stop-color="${sky.glow}" stop-opacity="0"/></radialGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEE4" stop-opacity=".16"/><stop offset="1" stop-color="#F3EEE4" stop-opacity="0"/></linearGradient>
 <radialGradient id="floor" cx="200" cy="208" r="150" gradientTransform="matrix(1 0 0 .16 0 174.7)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${floorC}" stop-opacity=".4"/><stop offset="1" stop-color="${floorC}" stop-opacity="0"/></radialGradient></defs>
 <rect width="400" height="220" fill="url(#sky)"/>${tint ? `<rect width="400" height="220" fill="${tint}" opacity=".07"/>` : ""}${orb}${stars}${extra}<rect class="glow" width="400" height="220" fill="url(#glow)"/>
 <polygon points="170,0 230,0 330,220 70,220" fill="url(#beam)"/>${dust}
 <ellipse cx="200" cy="208" rx="150" ry="24" fill="url(#floor)"/>
 ${fightPairLive(pose, calm)}</svg>`;
  }
  function burst() {
    let s = "";
    for (let r = 40; r <= 150; r += 22)
      s += `<circle r="${r}" fill="none" stroke="#C9A86A" stroke-width=".5" opacity="${(0.5 - r / 400).toFixed(2)}"/>`;
    s += `<circle r="118" fill="none" stroke="#C9A86A" stroke-width="1" stroke-dasharray="2 10" opacity=".7"/>`;
    return s;
  }

  /* ============ Loader: alternates fun facts and technique tips ============ */
  let loadIdx = Math.floor(Math.random() * 100);
  function showCard() {
    const lg = S.profile.lang,
      box = document.getElementById("factBox");
    const tips = TIPS.filter((x) => !x.d || x.d.includes(S.profile.disc));
    if (loadIdx % 2) {
      const x = tips[Math.floor(loadIdx / 2) % tips.length];
      box.className = "fact tip";
      document.getElementById("factK").textContent = t("tipK");
      document.getElementById("factT").textContent = x[lg];
      document.getElementById("factS").textContent = "";
    } else {
      const f = FACTS[Math.floor(loadIdx / 2) % FACTS.length];
      box.className = "fact";
      document.getElementById("factK").textContent = t("factK");
      document.getElementById("factT").textContent = f[lg];
      document.getElementById("factS").textContent = `${t("src")}: ${f.s}`;
    }
    document.getElementById("factNext").textContent = t("nextFact");
  }
  let closeLoader = null,
    loaderTimer = null;
  document.getElementById("factNext").onclick = (ev) => {
    ev.stopPropagation();
    loadIdx++;
    showCard();
    clearTimeout(loaderTimer);
  };
  document.getElementById("loader").addEventListener("click", () => {
    if (closeLoader) closeLoader();
  });
  function openLoader(ms) {
    return new Promise((res) => {
      const el = document.getElementById("loader");
      el.hidden = false;
      closeLoader = () => {
        clearTimeout(loaderTimer);
        el.hidden = true;
        closeLoader = null;
        res();
      };
      loaderTimer = setTimeout(() => closeLoader && closeLoader(), ms);
    });
  }
  function prepLoader(titleKey) {
    document.getElementById("burst").innerHTML = burst();
    document.getElementById("loaderFig").innerHTML =
      `<svg viewBox="0 0 400 220" role="img" aria-label=""><ellipse cx="200" cy="208" rx="150" ry="10" fill="#C9A86A" opacity=".18"/>${fightPair(loadIdx % 2 ? "box" : "kick")}</svg>`;
    document.getElementById("loaderTitle").textContent = t(titleKey);
    document.getElementById("loaderHint").textContent = t("tapClose");
    showCard();
  }
  function loading(titleKey, ms = 3800) {
    loadIdx++;
    prepLoader(titleKey);
    return openLoader(ms);
  }
  /* A short burst of brass and crimson sparks from the toast position */
  function celebrate(x, y, n = 16, far = 60) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (x == null) x = window.innerWidth / 2;
    if (y == null) y = window.innerHeight - 130;
    for (let i = 0; i < n; i++) {
      const el = document.createElement("span"),
        a = (i / n) * Math.PI * 2,
        d = far - 10 + Math.random() * far;
      el.className = "spark";
      const se = season(),
        pal = se
          ? {
              spring: ["#F6B8C8", "#8ec9a4", "#C9A86A"],
              summer: ["#1FB3C2", "#FFD23F", "#C9A86A"],
              autumn: ["#E0914A", "#C8404A", "#D9A441"],
              winter: ["#FFFFFF", "#BFD6F2", "#C9A86A"],
            }[se.k]
          : ["#C9A86A", "#C9A86A", "#C8404A"];
      el.style.cssText = `left:${x}px;top:${y}px;background:${pal[i % 3]};--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d - 30).toFixed(0)}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }
  }
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => (el.hidden = true), 2400);
  }

  /* ============ Render ============ */
  function eyebrow() {
    const p = S.profile,
      label = t("disc")[p.disc];
    const dl = weekLoad().deload;
    return `<div class="eyebrow"><i></i>${esc(label)} · ${t("phases")[phaseInfo().phase]}${dl ? ` · <em>${t("deload")}</em>` : ""}</div>`;
  }
  function header(title) {
    const lg = S.profile.lang;
    return `<div class="top"><div>${eyebrow()}<h1>${esc(title)}</h1></div>
 <div class="lang" role="group" aria-label="${t("lang")}"><button type="button" data-lang="de" aria-pressed="${lg === "de"}">DE</button><button type="button" data-lang="en" aria-pressed="${lg === "en"}">EN</button></div></div>`;
  }
  function ruleTags() {
    const p = S.profile;
    const r = t("rules")[p.disc];
    return `<div class="tags"><span class="tg ok">${r[0]}</span>${r[1].map((x) => `<span class="tg no">${x}</span>`).join("")}${r[2].map((x) => `<span class="tg">${x}</span>`).join("")}</div>`;
  }
  const codeOf = (ty) => (ty === "V" ? (S.profile.lang === "de" ? "VER" : "CLB") : CODE[ty]);
  const dayLbl = (ds) => `${t("weekday")[wd(ds)]}, ${parse(ds).getDate()}.${parse(ds).getMonth() + 1}.`;
  /* Week at a glance: progress ring (own + club sessions), week streak, next tournament */
  function pulseHtml() {
    const wp = weekPlan(monday(today())),
      frac = wp.planned ? Math.min(1, wp.done / wp.planned) : 0,
      C = 2 * Math.PI * 30,
      streak = weekStreak(),
      nc = nextComp();
    return `<div class="panel pulse"><div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="var(--line)" stroke-width="5"/><circle class="arc" cx="36" cy="36" r="30" fill="none" stroke="${frac >= 1 ? "var(--done)" : "var(--ice)"}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/></svg><b>${wp.done}/${wp.planned}</b></div>
 <div><div class="pv ${streak >= 2 ? "hot" : ""}">${streak}</div><div class="pk">${t("statStreak")}</div></div>
 <div><div class="pv">${nc ? daysBetween(today(), parse(nc.date)) : "–"}</div><div class="pk">${t("toComp")}</div></div></div>`;
  }
  /* The next own session that is still open (today included) */
  function nextTrainingDate() {
    for (let i = 0; i < 14; i++) {
      const ds = iso(addDays(today(), i));
      if (planOn(ds) && !doneOn(ds)) return ds;
    }
    return iso(today());
  }
  function weekStrip(selDs, attr) {
    const mon = monday(today()),
      td = iso(today());
    return (
      `<div class="week">` +
      [0, 1, 2, 3, 4, 5, 6]
        .map((i) => {
          const d = addDays(mon, i),
            ds = iso(d),
            ty = typeOn(ds),
            cl = clubOn(ds) || clubDone(ds),
            done = doneOn(ds),
            tc = ty || (cl ? "V" : null);
          const cls = [
            "day",
            tc ? "train" : "",
            done ? "done" : "",
            ds === td ? "today" : "",
            ds === selDs ? "sel" : "",
          ].join(" ");
          const k = done ? "✓" : ty ? codeOf(ty) : cl ? codeOf("V") : pausedOn(ds) ? "–" : "·";
          return `<button type="button" class="${cls}" ${attr}="${ds}"${tc ? ` style="--tc:var(--c-${tc})"` : ""} aria-label="${t("weekday")[i]}${ty ? " · " + t("types")[ty] : ""}${cl ? " · " + t("club") : ""}"><span class="d">${t("dayNames")[i]}</span><span class="n">${d.getDate()}</span><span class="k">${k}</span>${ty && cl ? `<i class="cl"></i>` : ""}</button>`;
        })
        .join("") +
      `</div>`
    );
  }

  const APP_VER = "dev";
  const ICO_T =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.6M9.5 2.5h5M19 6l1.5-1.5"/></svg>';
  const PLAY =
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
  /* The first thing on the start page: today's session, club training or the next session, with one big button */
  function todayCard(nd, nty, pose) {
    const td = iso(today()),
      tty = typeOn(td),
      cl = clubOn(td),
      pz = pausedOn(td),
      ty = tty || (cl ? "V" : nty),
      dateLbl = parse(td).toLocaleDateString(S.profile.lang === "de" ? "de-DE" : "en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long",
      });
    let small,
      title,
      meta = "",
      btn = "";
    if (pz) {
      small = t("pauseWhy")[pz.why];
      title = pz.why === "vac" ? t("niceHoliday") : t("getWell");
    } else if (tty && !doneOn(td)) {
      small = dateLbl;
      title = t("types")[tty];
      meta = `${sessDur(td, tty)} ${t("min")} · RPE ${rpeRange(tty, td).txt}${cl ? ` · + ${t("club")}` : ""}`;
      btn = `<button type="button" class="go" data-go="${td}" aria-label="${t("startBtn")}">${PLAY}</button>`;
    } else if (cl && !clubDone(td)) {
      small = dateLbl;
      title = t("club");
      meta = `${cl.min} ${t("min")}`;
      btn = `<button type="button" class="go small" data-clublog="${td}">${t("clubLog")}</button>`;
    } else {
      small = tty || clubDone(td) ? `${t("doneToday")} ✓` : t("restToday");
      title = nty && nd !== td ? `${t("weekday")[wd(nd)]} · ${t("types")[nty]}` : t("restWeek");
      meta = nty && nd !== td ? `${t("nextUp")} · ${sessDur(nd, nty)} ${t("min")}` : "";
      btn =
        nty && nd !== td ? `<button type="button" class="go small" data-open="${nd}">${t("viewNext")}</button>` : "";
    }
    // the fighters trade blows on training days; on rest days and once done they wait calmly in guard
    const calm = !!pz || !((tty && !doneOn(td)) || (cl && !clubDone(td)));
    const greet = (season() || { greet: [] }).greet;
    return `<div class="today" style="--tc:var(--c-${ty || "S"})">${heroScene(pose, ty, calm)}${greet.length ? `<div class="greet">${esc(greet.join(" · "))}</div>` : ""}<div class="tbody"><div style="min-width:0"><small>${esc(small)}</small><b>${esc(title)}</b>${meta ? `<div class="sub">${esc(meta)}</div>` : ""}</div>${btn}</div></div>`;
  }
  /* Things that need an answer: break, KO suspension, club attendance, missed sessions, results, weight class */
  function promptsHtml() {

  function barChart(weeks, goal) {

  function lineChart(ws, limit) {

    [0, 72, 144, 216, 288].forEach((a) => {
      const r = (a * Math.PI) / 180,
        x = 120 + Math.cos(r) * 58,
        y = 78 + Math.sin(r) * 58;
      h += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="13" ry="9" transform="rotate(${a + 90} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${SD_PAL.near}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="${SD_PAL.far}"/>`;
    });
    h += `<ellipse cx="120" cy="78" rx="15" ry="10" fill="${SK.W}"/><circle cx="120" cy="78" r="7.5" fill="#d9d4cc"/>`;
    h += skArrow([136, 66], [156, 48]) + skArrow([108, 92], [92, 108]);
    return h + `</svg>`;
  }
  function sdSketchSvg(id) {
    if (id === "4.sd.1" || id === "5.sd.1") return sdCircleSvg();

    let h = `<svg class="sketch" viewBox="0 0 240 156" role="img"><defs><marker id="skHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${SK.BRASS}"/></marker></defs>${skProp(["floor"])}`;

  function readSheet() {

      v = (id) => {
        const e = document.getElementById(id);
        return e ? e.value : undefined;
      },
      n = (id) => {
        const x = parseInt(v(id));
        return isNaN(x) ? null : x;
      };
    if (!o) return;
    if (o.kind === "club") {
      o.min = n("scMin") || o.min;
      o.rpe = n("scRpe") || o.rpe;
      if (v("scNote") != null) o.note = v("scNote");
    } else if (o.kind === "result") {
      if (v("rsB") != null) o.r.bouts = n("rsB");
      if (v("rsW") != null) o.r.wins = n("rsW");
      ["rsGood:good", "rsBad:bad", "rsGrade:grade"].forEach((x) => {
        const [id, k] = x.split(":");
        if (v(id) != null) o.r[k] = v(id).slice(0, 300);
      });
    } else if (o.kind === "pause") {
      o.from = v("psFrom") || o.from;
      if (v("psTo") != null) o.to = v("psTo");
    } else if (o.kind === "ko") o.date = v("koDate") || o.date;
  }

      S.log.push({
        id: "e" + Date.now().toString(36),

        src: "club",

        minutes: Math.max(5, Math.min(300, o.min || 90)),

        note: (o.note || "").slice(0, 300),
      });
      if (S.cov[o.ds] && S.cov[o.ds].off === "miss") delete S.cov[o.ds];
      store.save();

    if (a === "ressave") {
      const c = (S.profile.comps || []).find((x) => x.id === o.id);
      if (c) c.result = { ...o.r };
      // a passed grading moves the belt up to the stage that was prepared
      const ts = targetStage();
      if (c && c.kind === "grade" && o.r.passed === "y" && ts && stageBelt(ts) > beltIdx()) {
        S.profile.belt = stageBelt(ts);
        if (draft) draft.belt = S.profile.belt;
        setTimeout(() => toast(t("beltUp")(beltName(S.profile.belt))), 2500);

      if (draft) draft.comps = JSON.parse(JSON.stringify(S.profile.comps));
      store.save();
      closeSheet();

      return;
    }
    if (a === "pausesave") {

      let from = o.from,

  /* ============ Moving sessions ============ */
  /* Moves an own session (with everything already built or entered) to another day; the origin keeps a "moved" note */
  function doMove(from, to) {
    const ty = typeOn(from),
      sess = S.sessions[from],
      prev = S.ov[from] || {},
      origin = prev.from || from;
    if (prev.from) delete S.ov[from];
    if (prev.t && !prev.from && !dayTypes()[wd(from)]) {
      // an extra session simply changes its day
      delete S.ov[from];
      S.ov[to] = { t: ty };
    } else if (to === origin) delete S.ov[origin];
    else {
      S.ov[origin] = { off: "moved", to };
      S.ov[to] = { t: ty, from: origin };
    }
    if (sess && !doneOn(from)) {
      sess.date = to;
      S.sessions[to] = sess;
      delete S.sessions[from];
    }
    ui.sel = to;
    ui.setup = null;
    clearSessionTimer();
    store.save();
    render();
  }
  function undoOwn(ds) {
    const o = S.ov[ds];
    if (!o) return;
    if (o.off === "moved" && o.to) {
      const sess = S.sessions[o.to];
      if (sess && !doneOn(o.to)) {
        sess.date = ds;
        S.sessions[ds] = sess;
        delete S.sessions[o.to];
      }
      if (S.ov[o.to] && S.ov[o.to].from === ds) delete S.ov[o.to];
    }
    delete S.ov[ds];
    ui.setup = null;
  }

  function catchUpDate() {
    let fallback = null;

        <div class="ftph">${f.phase === "prep" ? L.ready : f.phase === "rest" ? L.restL : f.round === c.r && c.r > 1 ? L.lastR : L.round(f.round, c.r)}</div>
        <div class="fring"><svg viewBox="0 0 280 280"><circle cx="140" cy="140" r="130" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="12"/><circle id="ftarc" cx="140" cy="140" r="130" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/><g class="fknob" id="ftknob" style="transform:rotate(${(frac * 360).toFixed(1)}deg)"><circle cx="270" cy="140" r="10" fill="#fff"/></g></svg><div class="mid"><span class="clk" id="ftclk">${fmtS(f.left)}</span>${f.phase === "rest" && f.round < c.r ? `<span class="sub">${L.next(f.round + 1, c.r)}</span>` : ""}</div></div>
        ${c.coach && f.phase === "work" ? `<div class="ftcall" id="ftcall">${f.callTxt ? esc(f.callTxt) : ""}</div>` : ""}
        <div class="ftdots">${[...Array(c.r)].map((_, i) => `<i class="${i + 1 < f.round || (i + 1 === f.round && f.phase === "rest") ? "d" : i + 1 === f.round && f.phase === "work" ? "c" : ""}"></i>`).join("")}</div>

  function ftPhase(ph, quiet = false, startAt = Date.now()) {

    f.lastCall = 0;
    f.callTxt = "";
    const len = ph === "work" ? c.w : ph === "rest" ? c.b : 10;

      bell(1);

  function ftStart() {

  function ftEnd(quiet = false, startAt = Date.now(), manual = false) {
    const f = ui.ft;

    if (f.phase === "prep") return ftPhase("work", quiet, startAt);

  function ftTick() {
    const f = ui.ft;
    if (!freeRunning() || !f.endAt) return;
    const now = Date.now(),
      old = f.left;
    let changed = false;
    for (let n = 0; n < f.cfg.r * 2 + 2 && freeRunning() && f.endAt <= now; n++) {
      const boundary = f.endAt;
      ftEnd(now - boundary > 1100, boundary);
      changed = true;
    }
    if (f.phase === "done") return;
    f.left = Math.max(0, Math.ceil((f.endAt - now) / 1000));
    if (!changed && old === f.left) return;
    if (!changed && f.phase === "work" && f.cfg.warn && f.left === 10) beep(660, 0.1, 2);
    if (f.phase === "work" && f.cfg.coach && f.left > 4 && f.cfg.w - f.left >= 3) {
      const gap = [8, 6, 5][S.profile.level] || 6;
      if (!f.lastCall || f.lastCall - f.left >= gap) {

      .getElementById("ftimer")
      .classList.toggle("last", f.phase === "work" && f.cfg.warn && f.left <= 10);

  }

  /* ============ Focus blocks: 6 weeks in 3 stages (fight endurance, power, mobility) ============ */

  };
  /* test areas per block (for the suggestion and the before/after comparison) */

  /* block week on a date (1–6) regardless of tournaments; null outside the block or while paused */

  /* weakest physical area of the latest test (technique doesn't pick a block) */

    const mon = monday(parse(e.date)),

          <div><b>${full ? W.full : mon.getTime() === monday(today()).getTime() ? W.week : `${W.weekOf} ${fmtDate(iso(mon))}`}</b>${
            full && streak

          }${bi ? `<span class="wblk">${t("blk").names[bi.k]} · ${t("blk").week(bi.wk)}</span>` : ""}</div></div>
        ${own(e) && sess && sess.eq.some((x) => x === "bag" || x === "pads" || x === "partner") ? `<div class="wcare">🧤 ${esc(t("guide").winCare)}</div>` : ""}
        ${fresh.length ? `<div class="wbdg">${fresh.map((b) => `<div><div class="wmed">${medalSvg(b, true, "pop")}</div><small>${W.newB}</small><b>${esc(bName(b)[0])}</b></div>`).join("")}</div>` : ""}
        <div class="wtot">${esc(W.total(ownN, hours))}</div>
        <button type="button" class="btn">${W.cont}</button>`;
    document.body.appendChild(el);
    const close = () => {
      el.classList.add("out");

    requestAnimationFrame(() =>
      requestAnimationFrame(() => {
        el.classList.add("in");
        const arc = el.querySelector(".wring .arc");
        arc.setAttribute("stroke-dashoffset", arc.dataset.off);
        if (!reduced)
          el.querySelectorAll("[data-to]").forEach((b) => setTimeout(() => countUp(b, +b.dataset.to), 350));
        setTimeout(() => celebrate(innerWidth / 2, 120, 22, 90), 700);
        if (full) setTimeout(() => celebrate(innerWidth / 2, innerHeight / 2, 18, 80), 1500);
      }),
    );
  }

  /* ============ Dose: every exercise says how much – reps, seconds, distance or minutes ============ */

  /* minutes one circuit lap of these takes (everything else ≈ 1 min) */
  const DOSE_MIN = {

    Sprints: 1.5,
    Bergsprints: 2,
    "Schatten-Sprints": 1.5,
    "Sack-Sprints": 2,
    "Kick-Intervalle": 1.5,
    Steigerungsläufe: 1.5,

    "Laufband-Intervalle": 2,
    "Rad-Sprints": 2,
    "Speed-Runden": 2,
    "Steppen und leichte Beinarbeit": 3,
  };
  const DOSE_SIDE = new Set([
    "Ausfallschritte",
    "Bulgarian Split Squats",
    "Step-ups",
    "Wadenheben einbeinig",
    "Woodchopper am Kabelzug",
    "Pallof Press",
    "Copenhagen Plank",
    "Russian Twists",
    "Seitliche Sprünge",
  ]);
  /* a circuit: "3×" without reps – all exercises one after another, then a lap break */
  const isCirc = (b) => /^\d+\s*×$/.test((b.sets || "").trim());
  const circLap = (b) =>
    b.items.reduce((a, it) => {
      const e = EX[it.id];
      return a + (!e ? 1 : DOSE_MIN[e.de] || (DOSE_SIDE.has(e.de) ? 1.5 : 1));
    }, 0) + 1.5;
  /* laps that fill the block's minutes (2–6) */
  const circN = (b) => Math.max(2, Math.min(6, Math.round(b.min / circLap(b))));
  const blockSets = (b) => (isCirc(b) ? circN(b) : parseInt(b.sets) || 3);
  function doseTxt(id, b) {
    const e = EX[id];
    if (!e) return "";
    const de = S.profile.lang === "de",
      L = S.profile.level,
      fix = DOSE_FIX[e.de] ? DOSE_FIX[e.de][de ? 0 : 1] : "",
      side = DOSE_SIDE.has(e.de) ? (de ? " je Seite" : " per side") : "",
      reps = de ? " Wdh." : " reps",
      circ = isCirc(b),
      m = (b.sets || "").match(/^(\d+)×\s*(\d+(?:[–-]\d+)?)?/),
      n = m ? +m[1] : 3;
    if (e.cat === "pre") return fix;
    if (b.key === "warm") {
      const mins = Math.max(2, Math.round(b.min / Math.max(1, b.items.length)));
      return `${mins} ${de ? "Min." : "min"}${fix ? " · " + fix : ""}`;
    }
    if (b.key === "mob") {
      const mins = Math.max(2, Math.round(b.min / Math.max(1, b.items.length)));
      return `${fix || (de ? "60–90 s halten" : "hold 60–90 s")} · ${de ? "insgesamt ca." : "about"} ${mins} ${de ? "Min." : "min in total"}`;
    }
    if (b.key === "cool" || e.cat === "cool" || e.cat === "mob")
      return fix || (de ? "45–60 s halten" : "hold 45–60 s");
    if (e.cat === "cond") {
      if (fix) return fix;
      if (e.de === "Burpees") return ["6", "10", "15"][L] + reps;
      const W = [30, 40, 45][L],
        R = [30, 20, 15][L];
      if (e.de === "Bear Crawl")
        return de
          ? `${W} s (ca. 10 m hin und zurück), ${R} s Pause`
          : `${W} s (about 10 m out and back), ${R} s rest`;
      return de ? `${W} s Belastung, ${R} s Pause` : `${W} s work, ${R} s rest`;
    }
    // strength, core and power
    if (e.cat === "pow") {
      const one = (de ? "5 Wdh." : "5 reps") + side;
      if (circ) return one;
      if (/^Kontrast|^Contrast/.test(b.sets || ""))
        return de
          ? `3 × 5 Wdh.${side} direkt nach dem Kraftsatz`
          : `3 × 5 reps${side} right after the strength set`;
      return `${n} × ${one} · ${de ? "1–2 Min. Pause" : "1–2 min rest"}`;
    }
    let one;
    if (fix) one = fix;
    else if (TIMED.has(id)) {
      const h = [
        [20, 30],
        [30, 45],
        [45, 60],
      ][L] || [30, 45];
      one = `${h[0]}–${h[1]} s${side} ${de ? "halten" : "hold"}`;
    } else {
      const heavyBw = bwHeavy(b, id),
        r = heavyBw ? ["8–10", "10–12", "12–15"][L] : m && m[2] ? m[2] : hasKg(id) ? "8–12" : ["8–10", "10–12", "12–15"][L];
      one = r + reps + side + (heavyBw ? (de ? ", langsam (3 s ab)" : ", slow (3 s down)") : "");
    }
    return circ ? one : `${n} × ${one}`;
  }
  function blockHead(b) {

  /* ============ Everyday life: week check-in, today's form, profile panel ============ */

  /* Today: one question per week, asked until it is answered (from Monday on) */

  /* Per-second update of the training mode without rebuilding it */

    }
    if (tm.running) {
      tick();
      if (tm.phase === "done") return;
      tm.carryMs = Math.max(0, Date.now() - lastTick);
      tm.running = false;
      tm.called = null;
      cancelTimerSpeech();
      syncTimers();
      return;
    }
    if (tm.phase === "ready") {
      tm.phase = "prep";
      tm.left = 10;
      tm.carryMs = 0;

    lastTick = Date.now() - (tm.carryMs || 0);
