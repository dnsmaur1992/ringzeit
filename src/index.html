<title>Ringzeit Dev</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<style>
  /* Layout: quiet premium sports app — near-black ground, hairline panels with soft radius, thin condensed numerals, brass for state and focus, crimson only for kicks. Deliberately dark-only. */
  :root {
    --night: #0a0b0d;
    --panel: #121418;
    --panel2: #181b20;
    --frost: #ece8e1;
    --mist: #8c9099;
    --line: #24272d;
    --ice: #c9a86a;
    --ice-dim: #2b261c;
    --ember: #c8404a;
    --ember-dim: #2a1417;
    --done: #8ec9a4;
    --paper: #ece8e1;
    --ink: #0a0b0d;
    --display: "Saira Condensed", "Arial Narrow", sans-serif;
    --body: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "DM Mono", ui-monospace, Menlo, monospace;
    --r: 14px;
    color-scheme: dark;
  }
  html,
  body {
    background: var(--night);
    color: var(--frost);
  }
  html {
    min-height: 100%;
  }
  body {
    /* Short views must fill the screen too: iOS otherwise leaves the fixed
       navigation above the bottom after switching from a scrollable view. */
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(120% 60% at 50% -10%, #16181d 0%, var(--night) 60%);
    background-attachment: fixed;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 calc(92px + env(safe-area-inset-bottom, 0px));
  }
  * {
    box-sizing: border-box;
  }
  /* no zooming: no double-tap zoom, no pinch zoom – only scrolling */
  html,
  body {
    touch-action: pan-x pan-y;
  }
  button,
  input,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled {
    cursor: not-allowed;
  }
  :focus-visible {
    outline: 1.5px solid var(--ice);
    outline-offset: 2px;
  }
  .wrap {
    max-width: 620px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
  }
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding-top: 4px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ice);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .eyebrow i {
    display: inline-block;
    width: 20px;
    height: 1px;
    background: var(--ice);
  }
  .eyebrow em {
    font-style: normal;
    color: var(--ember);
  }
  h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 42px;
    line-height: 1.02;
    margin: 8px 0 0;
    letter-spacing: 0.005em;
    text-wrap: balance;
  }
  h2 {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--mist);
    margin: 0 0 10px 2px;
  }
  .lang {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
    flex: none;
  }
  .lang button {
    border: 0;
    background: none;
    padding: 5px 10px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--mist);
  }
  .lang button[aria-pressed="true"] {
    background: var(--frost);
    color: var(--ink);
  }
  .panel {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--r);
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
  }
  .row:first-child {
    border-top: 0;
  }
  .sub {
    font-size: 13px;
    color: var(--mist);
  }
  .note {
    border: 1px solid var(--line);
    border-left: 2px solid var(--ice);
    border-radius: 10px;
    background: var(--panel);
    padding: 12px 14px;
    font-size: 14px;
    color: var(--frost);
  }
  .note.act {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .note.warn {
    border-left-color: var(--ember);
  }
  .note.ok {
    border-left-color: var(--done);
  }
  .note b {
    color: var(--ice);
    font-weight: 600;
  }
  .note .btn.ghost {
    padding: 4px 0;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tg {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--mist);
    white-space: nowrap;
  }
  .tg.no {
    color: #e08a90;
    border-color: #3a2125;
  }
  .tg.ok {
    color: var(--ice);
    border-color: #4a3f2b;
  }
  /* hero */
  /* week */
  .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 0 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 0;
  }
  .day .d {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .day .n {
    font-family: var(--display);
    font-weight: 400;
    font-size: 22px;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  /* 7m: month hint under the date (first shown day and the 1st of a month) and the week navigation */
  .day .m {
    font-family: var(--mono);
    font-size: 9px;
    height: 11px;
    line-height: 11px;
    color: var(--mist);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .day .m.first {
    color: var(--ice);
    font-weight: 700;
  }
  .wknav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 18px 0 8px;
  }
  .wknav .x {
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--frost);
    font-size: 22px;
    line-height: 1;
  }
  .wknav .x:disabled {
    opacity: 0.35;
  }
  .wknav .wkt {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .wknav .wkt b {
    font-size: 18px;
  }
  .wknav .wkt small {
    color: var(--mist);
    font-size: 12.5px;
  }
  .wknav .wktoday {
    flex: none;
    padding: 6px 12px;
  }
  .day .k {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    height: 13px;
    color: var(--mist);
  }
  .day.train .k {
    color: var(--ice);
  }
  .code.ico {
    font-family: inherit;
    font-size: 20px;
    letter-spacing: 0;
  }
  .day .k.ico {
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0;
    height: 16px;
    line-height: 16px;
  }
  .day.done {
    border-color: #3c4a40;
  }
  .day.done .k {
    color: var(--done);
  }
  .day.today {
    border-color: var(--ice);
  }
  .day.sel {
    background: var(--frost);
    color: var(--ink);
    border-color: var(--frost);
  }
  .day.sel .d,
  .day.sel .k {
    color: var(--ink);
  }
  .sess {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 0;
    border-top: 1px solid var(--line);
    background: none;
    width: 100%;
    text-align: left;
  }
  .sess:first-child {
    border-top: 0;
  }
  .code {
    width: 44px;
    height: 44px;
    flex: none;
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    border: 1px solid #4a3f2b;
    border-radius: 50%;
    color: var(--ice);
  }
  .code.T,
  .code.P,
  .code.C {
    border-color: #4a2a2e;
    color: #e08a90;
  }
  .code.M {
    border-color: #34473b;
    color: var(--done);
  }
  .sess .lbl {
    flex: 1;
    min-width: 0;
  }
  .sess .lbl b {
    font-family: var(--display);
    font-weight: 500;
    font-size: 19px;
  }
  .chev {
    color: var(--mist);
  }
  .check {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--done);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  /* controls */
  .seg {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 4px;
    background: var(--night);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
  }
  .seg.g2 {
    grid-auto-flow: row;
    grid-template-columns: 1fr 1fr;
  }
  .seg.g3 {
    grid-auto-flow: row;
    grid-template-columns: repeat(3, 1fr);
  }
  .seg.g5 {
    grid-template-columns: repeat(5, 1fr);
    grid-auto-flow: row;
  }
  .seg button {
    border: 0;
    border-radius: 9px;
    background: none;
    padding: 9px 6px;
    font-size: 14px;
    color: var(--mist);
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .seg button[aria-pressed="true"] {
    background: var(--panel2);
    color: var(--frost);
    box-shadow: inset 0 0 0 1px #4a3f2b;
    font-weight: 600;
  }
  .seg button:disabled {
    opacity: 0.3;
  }
  .seg button small {
    display: block;
    font-size: 11px;
    opacity: 0.75;
    font-weight: 400;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    padding: 8px 14px;
    font-size: 14px;
    color: var(--mist);
  }
  .chip[aria-pressed="true"] {
    border-color: var(--ice);
    color: var(--frost);
    background: var(--ice-dim);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
  }
  .field + .field {
    border-top: 1px solid var(--line);
  }
  .lab {
    font-size: 14px;
    font-weight: 600;
  }
  input[type="date"],
  input[type="number"],
  input[type="text"],
  textarea {
    background: var(--night);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    width: 100%;
    font-size: 16px; /* below 16px iOS zooms in on focus */
  }
  input:focus,
  textarea:focus {
    border-color: var(--ice);
    outline: none;
  }
  textarea {
    min-height: 76px;
    resize: vertical;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--ice);
  }
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 15px 16px;
    font-family: var(--body);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.01em;
    background: var(--frost);
    color: var(--ink);
    width: 100%;
  }
  a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-sizing: border-box;
  }
  .btn.sec {
    background: transparent;
    color: var(--frost);
    border: 1px solid var(--line);
  }
  .btn.ghost {
    background: none;
    color: var(--ice);
    padding: 8px;
    width: auto;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .btn:disabled {
    opacity: 0.35;
  }
  /* session */
  .block {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--r);
    overflow: hidden;
  }
  .bhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .bhead b {
    font-family: var(--display);
    font-weight: 500;
    font-size: 22px;
  }
  .bhead span {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--mist);
    text-align: right;
  }
  .ex {
    display: flex;
    gap: 14px;
    padding: 13px 16px;
    border-top: 1px solid var(--line);
    transition: background 0.25s;
  }
  .bhead + .ex,
  .legend + .ex {
    border-top: 0;
  }
  .ex .num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--mist);
    width: 30px;
    flex: none;
    padding-top: 3px;
  }
  .ex .num.r {
    color: var(--ice);
  }
  .ex .tx {
    min-width: 0;
    flex: 1;
  }
  .ex .tx b {
    font-weight: 600;
  }
  .ex .tx div {
    font-size: 14px;
    color: var(--mist);
  }
  .ex.cur {
    background: linear-gradient(90deg, rgba(201, 168, 106, 0.14), transparent 85%);
    box-shadow: inset 2px 0 0 var(--ice);
  }
  .ex.cur .num {
    color: var(--frost);
  }
  .ex.cur.resting {
    background: linear-gradient(90deg, rgba(142, 201, 164, 0.1), transparent 85%);
    box-shadow: inset 2px 0 0 var(--done);
  }
  /* completed rounds: green bar, tick, struck-through title */
  .ex.past {
    opacity: 0.55;
    box-shadow: inset 2px 0 0 var(--done);
  }
  .ex.past .num {
    color: var(--done);
  }
  .ex.past .num::after {
    content: " ✓";
    color: var(--done);
  }
  .ex.past .tx > b,
  .ex.past .tx > .exn b {
    text-decoration: line-through;
    text-decoration-color: var(--done);
    text-decoration-thickness: 2px;
  }
  /* completed sets */
  .sets .sl.ok {
    color: var(--done);
  }
  .sets .sl.ok::after {
    content: " ✓";
  }
  .sets .si.ok {
    border-color: color-mix(in srgb, var(--done) 55%, var(--line));
    background: color-mix(in srgb, var(--done) 9%, var(--night));
    color: var(--frost);
    font-weight: 600;
  }
  .combo {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
  }
  .combo span {
    font-family: var(--mono);
    font-size: 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 7px;
    color: var(--frost);
    background: var(--night);
  }
  /* partner rounds: who does what as framed groups – A light blue, B yellow */
  .pseq {
    align-items: stretch;
  }
  .combo .pg {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    padding: 4px 6px 4px 4px;
    border: 1.5px solid;
    border-radius: 10px;
    background: none;
    font-family: inherit;
  }
  .combo .pg.a,
  .legend .lg.a,
  .fnext .lg.a,
  .pmine .lg.a {
    border-color: #7fb7f2;
  }
  .combo .pg.b,
  .legend .lg.b,
  .fnext .lg.b {
    border-color: #e8c25a;
  }
  .combo .pg .pgw,
  .legend .lg,
  .fnext .lg,
  .pmine .lg {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 5px;
  }
  .combo .pg.a .pgw,
  .legend .lg.a,
  .fnext .lg.a,
  .pmine .lg.a {
    color: #0a0b0d;
    background: #7fb7f2;
  }
  .combo .pg.b .pgw,
  .legend .lg.b,
  .fnext .lg.b {
    color: #0a0b0d;
    background: #e8c25a;
  }
  .legend .lg {
    display: inline-block;
    border: 0;
    margin-top: 4px;
  }
  .combo span.dfn {
    font-style: italic;
    color: var(--mist);
  }
  /* taekwondo series: several kicks in one flow, one bracket */
  .combo span.ser {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px dashed var(--ice);
    border-radius: 9px;
    padding: 3px 5px;
    background: transparent;
  }
  .combo span.ser .arr {
    color: var(--ice);
    font-weight: 700;
  }
  .combo span.k {
    border-color: #4a2a2e;
    color: #e08a90;
  }
  .combo span i {
    font-style: normal;
    font-weight: 500;
    margin-left: 6px;
    color: var(--ice);
  }
  .combo span.k i {
    color: var(--ember);
  }
  .legend {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--mist);
    padding: 9px 16px;
    border-bottom: 1px solid var(--line);
  }
  .legend i {
    font-style: normal;
    color: var(--ice);
  }
  .timer {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    z-index: 5;
    overflow: hidden;
    background: rgba(18, 20, 24, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid #3a3426;
    border-radius: 16px;
    padding: 16px 18px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  }
  .timer.rest {
    border-color: #2f3d34;
  }
  .timer .clock {
    font-family: var(--display);
    font-weight: 300;
    font-size: 60px;
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .timer .info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .timer .ph {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ice);
  }
  .timer.rest .ph {
    color: var(--done);
  }
  .timer .tr {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--mist);
  }
  .timer .tb {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .timer .tb button {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: none;
    padding: 9px 14px;
    font-weight: 600;
    font-size: 14px;
    color: var(--frost);
  }
  .timer .tb button:first-child {
    background: var(--frost);
    color: var(--ink);
    border-color: var(--frost);
  }
  .timer .bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--line);
  }
  .timer .bar span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--ice);
    transition: width 1s linear;
  }
  .timer.rest .bar span {
    background: var(--done);
  }
  /* stats & charts */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 14px;
    min-width: 0;
  }
  .stat .v {
    font-family: var(--display);
    font-weight: 300;
    font-size: 34px;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .stat .k {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mist);
    margin-top: 4px;
  }
  .stat.hot .v {
    color: var(--ice);
  }
  .chart {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 14px 14px 8px;
  }
  .chart svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .empty {
    border: 1px dashed var(--line);
    border-radius: var(--r);
    padding: 24px 18px;

  .sets {

    opacity: 0.55;
    font-style: italic;
  }
  .sets .x {
    border: 1px solid var(--line);

  }
  .inline .u {

    font-size: 12px;
    color: var(--mist);
  }
  .foot {
    font-size: 12px;
    color: var(--mist);
    line-height: 1.7;
  }
  .foot a {
    color: var(--ice);
  }
  /* test */
  .radar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 14px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);

  .radar svg {

  @media (max-width: 420px) {
    .radar {
      grid-template-columns: 1fr;
    }
  }
  /* tab bar */
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    background: rgba(10, 11, 13, 0.86);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--line);
    padding: 8px max(6px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px))
      max(6px, env(safe-area-inset-left, 0px));
    display: grid;
    /* as many equal columns as there are tabs (6 in the detailed view, 4 in the simple view) */
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
  }
  .tabbar .tabft i {
    display: grid;
    place-items: center;
    color: var(--c-T);
  }
  .tabbar .tabft svg {
    width: 22px;
    height: 22px;
  }
  .tabbar button {
    border: 0;
    background: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 2px 0;
    color: var(--mist);
    min-width: 0;
  }
  .tabbar svg {
    width: 22px;
    height: 22px;
  }
  .tabbar span {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .tabbar button[aria-current="page"] {
    color: var(--frost);
  }
  .tabbar button[aria-current="page"] svg {
    color: var(--ice);
  }
  /* loader */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: radial-gradient(90% 60% at 50% 35%, #16181d, var(--night) 70%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    overflow: hidden;
    cursor: pointer;
    padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px))
      calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  }
  .loader .burst {
    position: absolute;
    width: min(560px, 140vw);
    height: auto;
    left: 50%;
    top: 35%;
    transform: translate(-50%, -50%);
    opacity: 0.6;
  }
  .loader .fig {
    position: relative;
    width: min(340px, 86vw);
  }
  .loader .lt {
    position: relative;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ice);
  }
  .fact {
    position: relative;
    max-width: 420px;
    background: rgba(18, 20, 24, 0.9);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .fact .fk {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ice);
  }
  .fact.tip .fk {
    color: var(--done);
  }
  .fact p {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 21px;
    line-height: 1.35;
    text-wrap: pretty;
  }
  .fact .src {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--mist);
  }
  .loader .btn.ghost {
    position: relative;
  }
  .loader .hint {
    position: relative;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mist);
  }
  .toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    z-index: 70;
    background: var(--frost);
    color: var(--ink);
    border-radius: 18px;
    padding: 10px 18px;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.35;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    width: max-content;
    max-width: min(340px, calc(100% - 32px));
  }
  @keyframes rot {
    to {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }
  .loader:not([hidden]) .burst {
    animation: rot 60s linear infinite;
  }
  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  .loader:not([hidden]) .fact {
    animation: rise 0.5s ease-out both;
  }
  @media (prefers-reduced-motion: reduce) {
    .loader .burst,
    .loader .fact {
      animation: none !important;
    }
    .timer .bar span {
      transition: none;
    }
  }
  @media (max-width: 380px) {
    h1 {
      font-size: 34px;
    }
    .timer .clock {
      font-size: 48px;
    }
    .stat .v {
      font-size: 26px;
    }
    .seg button {
      font-size: 13px;
    }
  }

  /* ===== Life: type colours, motion, feedback (all motion respects prefers-reduced-motion) ===== */
  :root {
    --c-T: #d9545c;
    --c-C: #e0914a;
    --c-P: #e5683c;
    --c-S: #c9a86a;
    --c-K: #5fb3a6;
    --c-M: #8ec9a4;
  }
  .code[style],
  .sess .code {
    border-color: color-mix(in srgb, var(--tc) 45%, transparent) !important;
    color: var(--tc) !important;
    background: color-mix(in srgb, var(--tc) 12%, transparent) !important;
  }
  .sess {
    position: relative;
  }
  .sess::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    bottom: 14px;
    width: 2px;
    border-radius: 2px;
    background: var(--tc, transparent);
    opacity: 0.8;
  }
  .day.train .k {
    color: var(--tc, var(--ice)) !important;
  }
  .day.sel .k {
    color: var(--ink) !important;
  }
  button,
  .chip,
  .seg button,
  .day,
  .sess {
    transition:
      transform 0.15s ease,
      background-color 0.2s ease,
      border-color 0.2s ease,
      color 0.2s ease;
  }
  button:active:not(:disabled) {
    transform: scale(0.97);
  }
  .sess:active {
    background: rgba(236, 232, 225, 0.04);
  }
  @keyframes lift {
    from {
      opacity: 0.35;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  .wrap.enter > * {
    animation: lift 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .wrap.enter > *:nth-child(2) {
    animation-delay: 0.04s;
  }
  .wrap.enter > *:nth-child(3) {
    animation-delay: 0.08s;
  }
  .wrap.enter > *:nth-child(4) {
    animation-delay: 0.12s;
  }
  .wrap.enter > *:nth-child(5) {
    animation-delay: 0.16s;
  }
  .wrap.enter > *:nth-child(n + 6) {
    animation-delay: 0.2s;
  }
  @keyframes bob {
    0%,
    100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(2.5px);
    }
  }
  .loader .bob {
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,
    100% {
      opacity: 0.15;
    }
    50% {
      opacity: 0.8;
    }
  }
  @keyframes breathe {
    0%,
    100% {
      opacity: 0.7;
    }
    50% {
      opacity: 1;
    }
  }
  .pulse {
    display: grid;
    grid-template-columns: auto 1fr 1fr;
    gap: 14px;
    align-items: center;
    padding: 14px 16px;
  }
  .pulse .ring {
    width: 72px;
    height: 72px;
    position: relative;
  }
  .pulse .ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  @keyframes fill {
    from {
      stroke-dashoffset: 188.5;
    }
  }
  .pulse .ring .arc {
    animation: fill 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .pulse .ring b {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-weight: 400;
    font-size: 22px;
  }
  .pulse .pv {
    font-family: var(--display);
    font-weight: 300;
    font-size: 32px;
    line-height: 1;
  }
  .pulse .pk {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mist);
    margin-top: 4px;
  }
  .pulse .hot {
    color: var(--c-C);
  }
  @keyframes urgent {
    0%,
    100% {
      color: var(--frost);
    }
    50% {
      color: var(--ember);
    }
  }
  .timer.last .clock {
    animation: urgent 1s steps(2) infinite;
  }
  .timer.on {
    border-color: var(--ice);
    box-shadow:
      0 0 0 1px rgba(201, 168, 106, 0.25),
      0 12px 30px rgba(0, 0, 0, 0.45);
  }
  .spark {
    position: fixed;
    z-index: 60;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    pointer-events: none;
    animation: spark 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  @keyframes spark {
    from {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }
    to {
      transform: translate(var(--dx), var(--dy)) scale(0.3);
      opacity: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .wrap.enter > *,
    .loader .bob,
    .timer.last .clock,
    .pulse .ring .arc {
      animation: none !important;
    }
    .spark {
      display: none;
    }
  }

  /* ===== Natural iOS look (after Apple Fitness / Strava): system type, sentence case, soft cards ===== */
  :root {
    --display: -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --body: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --num: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 20px;
    --panel: #15171c;
    --panel2: #1b1e24;
    --line: #262a31;
  }
  body {

  /* ===== B: Today card with a big start button ===== */
  .today {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    background: var(--panel);
  }
  .today .greet {
    margin: 12px 18px -4px;
    width: fit-content;
    padding: 5px 12px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--ice) 14%, transparent);
    color: var(--ice);
    font-size: 13.5px;
    font-weight: 700;
    animation: wUp 0.6s 0.2s both;
  }
  .today .flame {
    animation: flame 0.9s ease-in-out infinite alternate;
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  @keyframes flame {
    to {
      transform: scale(0.82, 1.12);
      opacity: 0.85;
    }

  .today svg {
    display: block;
    width: 100%;
    height: auto;

  @keyframes glowpulse {

    }
    50% {
      box-shadow: 0 10px 34px color-mix(in srgb, var(--tc, var(--ice)) 60%, transparent);
    }

  .go:not(.small) {
    animation: glowpulse 2.4s ease-in-out infinite;

  /* ===== C: full-screen training mode ===== */
  .focus {
    position: fixed;
    inset: 0;
    z-index: 45;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: radial-gradient(
      120% 70% at 50% 20%,
      color-mix(in srgb, var(--tc, var(--ice)) 14%, #0a0b0d),
      #0a0b0d 70%
    );
    padding: calc(14px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px))
      calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  }
  .focus.rest {
    --tc: var(--done);
  }
  .fbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .fbar .x {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 255, 255, 0.08);
    color: var(--frost);
    font-size: 18px;
  }
  .fbar span {
    font-size: 15px;
    font-weight: 600;
    color: var(--mist);
  }
  .fring {
    position: relative;
    width: min(280px, 72vw, 32vh);
    aspect-ratio: 1;
    max-width: 100%;
    margin: 0 auto;
  }

  /* ===== Success moments: summary after a session ===== */
  .win {
    position: fixed;
    inset: 0;
    z-index: 55;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
    padding: calc(34px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(90% 55% at 50% 18%, color-mix(in srgb, var(--tc) 30%, transparent), transparent 70%),
      #0a0b0d;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .win.in {
    opacity: 1;
  }
  .win.out {
    opacity: 0;
    transition-duration: 0.22s;
  }
  .wcheck {
    position: relative;
    width: 116px;
    height: 116px;
    flex: none;
  }
  .wcheck svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .wcheck .c {
    fill: color-mix(in srgb, var(--tc) 18%, transparent);
    stroke: var(--tc);
    stroke-width: 6;
    stroke-dasharray: 327;
    stroke-dashoffset: 327;
    transform: rotate(-90deg);
    transform-origin: 60px 60px;
  }
  .wcheck .k {
    fill: none;
    stroke: var(--frost);
    stroke-width: 9;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 70;
    stroke-dashoffset: 70;
  }
  .wcheck .ray {
    stroke: var(--tc);
    stroke-width: 4;
    stroke-linecap: round;
    opacity: 0;
  }
  .in .wcheck .c,
  .fdone .wcheck .c,
  .ftdone .wcheck .c {
    animation: wDraw 0.6s 0.1s cubic-bezier(0.6, 0, 0.3, 1) forwards;
  }
  .in .wcheck .k,
  .fdone .wcheck .k,
  .ftdone .wcheck .k {
    animation: wDraw 0.35s 0.6s ease-out forwards;
  }
  .in .wcheck .ray,
  .fdone .wcheck .ray,
  .ftdone .wcheck .ray {
    animation: wRay 0.7s 0.75s ease-out forwards;
  }
  .in .wcheck,
  .fdone .wcheck,
  .ftdone .wcheck {
    animation: wPop 0.5s 0.55s cubic-bezier(0.2, 1.6, 0.4, 1) both;
  }
  @keyframes wDraw {
    to {
      stroke-dashoffset: 0;
    }
  }
  @keyframes wRay {
    0% {
      opacity: 0;
      stroke-dasharray: 0 30;
    }
    40% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      stroke-dasharray: 14 30;
      stroke-dashoffset: -16;
    }
  }
  @keyframes wPop {
    0% {
      transform: scale(1);
    }
    40% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  .ftdone .wcheck .c {
    fill: rgba(255, 255, 255, 0.12);
    stroke: #fff;
  }
  .ftdone .wcheck .ray {
    stroke: #fff;
  }
  .win h2 {
    margin: 0;
    font-size: 34px;
    letter-spacing: -0.02em;
  }
  .win > .sub {
    margin: -10px 0 0;
  }
  .wstats {
    display: grid;

    grid-auto-columns: 1fr;
    gap: 8px;

    max-width: 420px;
  }
  .wstats > div {

  .wweek {

  }
  .wweek.full {

  .wring {

  }
  .wring svg {
    width: 100%;

  @keyframes flicker {

    }
  }
  .wblk {

  }
  .wbdg {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
  }
  .wbdg > div {
    display: flex;
    flex-direction: column;

    gap: 4px;

  }
  .wbdg small {
    font-size: 11px;

  .wmed {
    position: relative;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    overflow: hidden;
  }
  .wmed .medal {
    width: 100%;
    height: 100%;
    animation-delay: 0.9s;
  }
  .wmed::after {
    content: "";
    position: absolute;
    inset: -20%;
    background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.55) 50%, transparent 65%);
    transform: translateX(-120%);
    animation: shine 1.1s 1.6s ease-in-out forwards;
  }
  @keyframes shine {

  }
  .win .btn {

    max-width: 420px;
    margin-top: auto;
  }
  .win > * {
    animation: wUp 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .win > :nth-child(2) {
    animation-delay: 0.15s;
  }
  .win > :nth-child(3) {
    animation-delay: 0.2s;
  }
  .win > :nth-child(4) {
    animation-delay: 0.3s;
  }
  .win > :nth-child(5) {
    animation-delay: 0.4s;
  }
  .win > :nth-child(n + 6) {
    animation-delay: 0.5s;
  }
  @keyframes wUp {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
  }
  /* ===== Timer: splash at round start and end, heartbeat in the last 10 seconds ===== */
  .tfx {
    position: fixed;
    inset: 0;
    z-index: 58;
    pointer-events: none;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .tfx::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.5), transparent 62%);
    animation: tfxFlash 0.8s ease-out forwards;
  }
  .tfx.end::before {
    background: radial-gradient(circle at 50% 40%, rgba(142, 201, 164, 0.55), transparent 65%);
  }
  .tfx.done::before {
    background: radial-gradient(circle at 50% 40%, rgba(201, 168, 106, 0.6), transparent 68%);
  }
  .tfx i {
    position: absolute;
    left: 50%;
    top: 40%;
    width: 140px;
    height: 140px;
    margin: -70px 0 0 -70px;
    border-radius: 50%;
    border: 5px solid rgba(255, 255, 255, 0.9);
    animation: tfxWave 0.9s ease-out forwards;
  }
  .tfx b {
    position: relative;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(40px, 13vw, 68px);
    line-height: 1.05;
    text-align: center;
    padding: 0 20px;
    color: #fff;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
    animation: tfxText 1.4s cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
  }
  @keyframes tfxFlash {
    from {
      opacity: 1;
    }
    to {
      opacity: 0;
    }
  }
  @keyframes tfxWave {
    from {
      transform: scale(0.3);
      opacity: 0.9;
    }
    to {
      transform: scale(4.5);
      opacity: 0;
    }
  }
  @keyframes tfxText {
    0% {
      transform: scale(0.4);
      opacity: 0;
    }
    22% {
      transform: scale(1.08);
      opacity: 1;
    }
    38% {
      transform: scale(1);
    }
    78% {
      opacity: 1;
    }
    100% {
      transform: scale(1.03);
      opacity: 0;
    }
  }
  .fknob {
    transform-origin: 140px 140px;
    transition: transform 1s linear;
  }
  .ftimer .fknob {
    transition-duration: 0.25s;
  }
  .focus.last .fring,
  .ftimer.run.last .fring {
    animation: ringBeat 1s ease-in-out infinite;
  }
  @keyframes ringBeat {
    0%,
    100% {
      transform: scale(1);
    }
    12% {
      transform: scale(1.04);
    }
    30% {
      transform: scale(1);
    }
  }
  .focus.last #farc,
  .focus.last .fknob circle {
    stroke: var(--ember);
    fill: var(--ember);
    fill-opacity: 0;
  }
  .focus.last .fknob circle {
    fill-opacity: 1;
  }
  .focus.last .fring svg,
  .ftimer.run.last .fring svg {
    filter: drop-shadow(0 0 12px rgba(255, 90, 100, 0.7));
  }
  .focus.last .clk {
    animation: ftpulse 1s ease-in-out infinite;
  }
  .focus::after,
  .ftimer.run::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    box-shadow: inset 0 0 140px 40px rgba(200, 64, 74, 0.5);
  }
  .ftimer.run::after {
    box-shadow: inset 0 0 140px 40px rgba(255, 255, 255, 0.28);
  }
  .focus.last::after,
  .ftimer.run.last::after {
    animation: vign 1s ease-in-out infinite;
  }
  @keyframes vign {
    0%,
    100% {
      opacity: 0.25;
    }
    50% {
      opacity: 1;
    }
  }
  .fdone .wcheck,
  .ftdone .wcheck {
    margin-bottom: 4px;
  }
  /* ===== Today: living hero (time of day, exchange of blows, dust in the light) ===== */
  .today .bob {
    animation: bob 1.8s ease-in-out infinite;
  }
  .today .tw {
    animation: twinkle 3.4s ease-in-out infinite;
  }
  .today .glow {
    animation: breathe 6s ease-in-out infinite;
  }
  .today .pa,
  .today .pb,
  .today .hitfx,
  .today .kb {
    animation-duration: 4.2s;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
  }
  .today .pa {
    animation-name: poseA;
  }
  .today .pb {
    animation-name: poseB;
    opacity: 0;
  }
  .today .def .pa {
    animation-name: poseAd;
