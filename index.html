ztliche Beratung.","Bei Vorerkrankungen, Verletzungen oder Beschwerden vorher \xE4rztlich abkl\xE4ren. Bei Schmerzen, Schwindel oder Atemnot sofort aufh\xF6ren.","Sparring und Partner\xFCbungen nur unter Aufsicht.","Unter 18 nur mit Einverst\xE4ndnis deiner Eltern."],priv:"Ringzeit ist ein privates Projekt \u2013 kein Angebot deines Vereins, der WAKO oder eines Verbands.",ok:"Verstanden \u2013 los geht's"},legal:{row:"Hinweise & Datenschutz",sub:"Sicherheit, Haftung, deine Daten",h1:"Sicherheit & Haftung",p1:["Ringzeit ist ein privates, kostenloses Projekt. Es ist kein Angebot eines Vereins, der WAKO, der WAKO Deutschland oder eines Verbands.","Die Trainingsvorschl\xE4ge sind allgemeine Empfehlungen und ersetzen weder Trainer noch \xE4rztliche Beratung. Die Nutzung erfolgt auf eigene Verantwortung.","Bei Vorerkrankungen, Verletzungen, Schwangerschaft oder Beschwerden das Training vorher \xE4rztlich abkl\xE4ren. Bei Schmerzen, Schwindel oder Atemnot sofort aufh\xF6ren.","Sparring und Partner\xFCbungen nur unter Aufsicht. Kinder und Jugendliche unter 18 nutzen Ringzeit nur mit Einverst\xE4ndnis der Eltern.","Verbindlich sind immer die aktuellen Regelwerke der WAKO Deutschland und die Anweisungen deiner Trainer."],h2:"Datenschutz",p2:["Ringzeit hat kein Konto, keine Werbung und kein Tracking. Alles, was du eintr\xE4gst, bleibt nur auf deinem Ger\xE4t.","Ringzeit wird \xFCber GitHub Pages bereitgestellt. Beim Laden und bei Updates verarbeitet GitHub technisch \xFCbliche Zugriffsdaten wie die IP-Adresse.","Sicherungen speicherst du selbst. Mit \u201ENeu starten\u201C l\xF6schst du alle Daten auf diesem Ger\xE4t."]},resetLbl:"Neu starten",resetHint:"L\xF6scht alle Daten auf diesem Ger\xE4t \u2013 Plan, Eintr\xE4ge, Tests, Kombis \u2013 und startet die Einrichtung von vorn. Vorher am besten eine Sicherung speichern.",resetBtn:"Alle Daten l\xF6schen",resetAsk:"Wirklich alles l\xF6schen? Das l\xE4sst sich nicht r\xFCckg\xE4ngig machen \u2013 au\xDFer mit einer gespeicherten Sicherung.",psec:{back:"Profil",train:["Training","Disziplin, Level, Tage, Verein, Einschr\xE4nkungen"],goals:["Ziele","Turniere, G\xFCrtelpr\xFCfungen, Schwerpunkt"],life:["Alltag & Pausen","Woche, Wenig-Zeit, Arbeit, Pausen, K.o."],guide:["Ratgeber","Bandagieren, Materialpflege, Erste Hilfe"],app:["App & Daten","Sicherung, Meine Kombis, Design, Tour"],days:e=>`${e} ${e===1?"Tag":"Tage"} Ringzeit`,club:e=>`${e}\xD7 Verein`,noGoal:"Noch kein Ziel eingetragen",nextComp:e=>`Turnier am ${e}`,nextGrade:e=>`Pr\xFCfung am ${e}`,paused:"Pause l\xE4uft"},life:{title:"Alltag",hint:"Job, Schule, Studium und Familie kosten auch Kraft. Alles hier ist freiwillig.",weekQ:"Wie wird deine Woche?",weekS:"Ringzeit passt die Einheiten an \u2013 ein Tipp gen\xFCgt.",moods:{easy:"Entspannt",normal:"Normal",hard:"Stressig"},weekLbl:"Diese Woche",moodToast:{easy:"Woche angepasst \u2013 etwas mehr drin",normal:"Alles klar \u2013 normaler Plan",hard:"Woche angepasst \u2013 leichter und mehr Technik"},lowLbl:"Wenig-Zeit-Modus",lowHint:"F\xFCr Pr\xFCfungszeit, Umzug, Baby & Co.: Einheiten h\xF6chstens 30 Minuten, nur das Wesentliche. Deine Serie l\xE4uft weiter.",lowOn:"Wenig-Zeit-Modus an \u2013 h\xF6chstens 30 Minuten",lowOff:"Wenig-Zeit-Modus aus",workLbl:"Art der Arbeit",workHint:"Sitzend: mehr Mobility f\xFCr H\xFCfte und R\xFCcken. K\xF6rperlich schwer: etwas weniger Kraftvolumen.",works:{"":"Keine Angabe",sit:"Sitzend",phys:"K\xF6rperlich"},formQ:"Tagesform",formS:"Optional \u2013 passt die heutige Einheit an.",sleep:"Schlaf",energy:"Energie",lv:["Schlecht","Okay","Gut"],formDone:"Einheit an deine Tagesform angepasst",notes:{hard:"Stressige Woche: weniger Runden, kein Sparring, keine harte Kondition \u2013 Training soll heute Energie geben, nicht nehmen.",easy:"Entspannte Woche: eine Runde mehr ist drin.",formLow:"Tagesform niedrig: heute leichter. Technik sauber, kein Vollgas \u2013 lieber gut erholt in die n\xE4chste Einheit.",formMid:"Tagesform mittel: etwas weniger Umfang, Tempo nach Gef\xFChl.",low:"Wenig-Zeit-Modus: nur das Wesentliche.",sit:"Viel Sitzen: zum Schluss H\xFCfte und Brustwirbels\xE4ule mobilisieren.",phys:"K\xF6rperlich schwere Arbeit: etwas weniger Kraftvolumen."}},planUpd:"Plan aktualisiert",autoSave:"\xC4nderungen werden sofort in deinen Plan \xFCbernommen.",needDay:"W\xE4hle mindestens einen Trainingstag.",guide:{title:"Ratgeber",hint:"Bandagieren, Pflege der Ausr\xFCstung und Erste Hilfe bei kleinen Blessuren.",wrap:"Bandagieren",care:"Materialpflege",aid:"Pflege & Erste Hilfe",wrapLink:"Bandagieren",video:"Video ansehen (\xF6ffnet YouTube)",step:(e,n)=>`Schritt ${e} von ${n}`,prev:"Zur\xFCck",next:"Weiter",again:"Von vorn",wrapIntro:"Bandagen sch\xFCtzen Mittelhandknochen und Handgelenk. F\xFCr Erwachsene sind 4\u20134,5 m \xFCblich. Hand beim Wickeln gespreizt halten \u2013 so dr\xFCckt nichts, wenn du die Faust machst.",wrapSteps:["Daumen durch die Schlaufe stecken und die Bandage \xFCber den Handr\xFCcken nach unten f\xFChren.","Das Handgelenk 3\xD7 umwickeln \u2013 fest, aber ohne abzuschn\xFCren.","Schr\xE4g \xFCber den Handr\xFCcken zu den Kn\xF6cheln und die Kn\xF6chel 3\xD7 umwickeln.","Zwischen den Fingern durch: kleiner/Ringfinger, Ring-/Mittelfinger, Mittel-/Zeigefinger \u2013 jedes Mal \xFCber das Handgelenk zur\xFCck.","Den Daumen einmal umwickeln \u2013 das gibt ihm Halt.","Mit Kreuzen (X) \xFCber den Handr\xFCcken festigen, den Rest ums Handgelenk wickeln und mit dem Klett schlie\xDFen. Faust machen: Nichts darf dr\xFCcken oder kribbeln."],careSecs:[["Handschuhe","Nach jedem Training aus der Tasche nehmen und \xF6ffnen. Innen mit einem desinfizierenden Textilerfrischer einspr\xFChen und offen an der Luft trocknen lassen \u2013 nicht auf die Heizung, nicht in die pralle Sonne. Au\xDFen mit einem feuchten Tuch abwischen. Das Spray ersetzt das Ausl\xFCften nicht, es erg\xE4nzt es: Feuchtigkeit ist der Hauptgrund f\xFCr Geruch und Keime. Bei Leder alkoholhaltige Sprays erst an einer unauff\xE4lligen Stelle testen."],["Bandagen","Nach jedem Training waschen: im W\xE4schenetz bei 30\u201340 \xB0C, den Klett vorher schlie\xDFen. An der Luft trocknen und aufgerollt aufbewahren \u2013 Daumenschlaufe innen, Klett au\xDFen. Dann sind sie beim n\xE4chsten Mal sofort bereit."],["Schienbein- und Fu\xDFschutz","Wie Handschuhe: innen einspr\xFChen, ausl\xFCften, au\xDFen abwischen. Stoffschoner d\xFCrfen oft in die W\xE4sche \u2013 Etikett beachten."],["Mundschutz","Nach dem Training mit kaltem Wasser absp\xFClen \u2013 hei\xDFes Wasser verformt ihn. In einer bel\xFCfteten Box trocknen lassen und ab und zu mit der Zahnb\xFCrste reinigen. Ersetzen, wenn er rissig ist oder nicht mehr gut sitzt."],["Kopf- und Tiefschutz","Innen einspr\xFChen und ausl\xFCften. Den Tiefschutz waschen, wenn das Etikett es erlaubt."],["Sporttasche","Kein Trockenraum: Ausr\xFCstung nach dem Training immer auspacken. Ein W\xE4schenetz f\xFCr die Bandagen und ein Beutel f\xFCr nasse Sachen halten Ordnung."]],aidSecs:[["Prellung, Zerrung: PECH-Regel","Pause \u2013 sofort aufh\xF6ren. Eis \u2013 10\u201320 Minuten k\xFChlen, immer mit einem Tuch dazwischen. Compression \u2013 leichter Druckverband. Hochlagern \u2013 \xFCber Herzh\xF6he. Das bremst Schwellung und Bluterguss."],["Thai-Boxing-\xD6l (z. B. Namman Muay)","Zum Einreiben, um die Muskeln vor dem Training zu w\xE4rmen, und zur Massage bei Verspannungen oder \xE4lteren blauen Flecken. Nicht bei frischen Verletzungen: In den ersten 1\u20132 Tagen erst k\xFChlen \u2013 W\xE4rme kann eine frische Schwellung verst\xE4rken. Nicht auf offene Haut, nicht in die Augen, danach H\xE4nde waschen, nicht mit W\xE4rmflasche oder Sauna kombinieren. Die \xD6le enthalten meist Methylsalicylat (aspirin\xE4hnlich): Wer darauf allergisch ist oder Blutverd\xFCnner nimmt, fragt vorher in der Apotheke."],["Nasenbluten","Kopf leicht nach vorn beugen, nicht in den Nacken legen. Die Nasenfl\xFCgel 10 Minuten zusammendr\xFCcken, den Nacken k\xFChlen. H\xF6rt es nach 20 Minuten nicht auf: zum Arzt."],["Sofort aufh\xF6ren und zum Arzt","Nach einem Kopftreffer mit Kopfschmerzen, \xDCbelkeit, Schwindel, Sehst\xF6rungen oder Verwirrtheit \u2013 das kann eine Gehirnersch\xFCtterung sein; die WAKO-Sperre nach K.o. gilt. Bei Verdacht auf einen Bruch (starker Schmerz, Fehlstellung, Knacken), bei Schwellungen, die nicht zur\xFCckgehen, und bei Schmerzen, die nach 2\u20133 Tagen nicht besser werden."]],aidNote:"Diese Tipps ersetzen keinen Arzt. Im Notfall: 112.",winCare:"Handschuhe und Schoner innen mit desinfizierendem Textilerfrischer einspr\xFChen und offen trocknen lassen."},pack:{title:"Packliste",card:e=>`Turnier am ${e}`,cardS:(e,n)=>`Packliste: ${e} von ${n} gepackt`,all:"Alles gepackt \u2013 viel Erfolg!",open:"Packliste \xF6ffnen",add:"Eigener Punkt",addBtn:"Hinzuf\xFCgen",reset:"Alle Haken entfernen",hint:"Und packt schon mal eure Sachen!",items:["Kopfschutz","Mundschutz","T-Shirt / Kick Light \xE4rmellos","Handschuhe","Bandagen","Hose / Shorts","Tiefschutz","Schienbeinschutz","Fu\xDFschutz","Fu\xDFn\xE4gel schneiden","Coach-Lizenz","Wasser","Snacks / Essen","Duschsachen"]},coach:{lbl:"Coach-Ansagen",hint:"Ruft w\xE4hrend der Runde Kombis aus deinem Level aus \u2013 reagiere sofort."},feast:{newyear0:"Guten Rutsch!",newyear1:"Frohes neues Jahr!",karneval:"Helau & Alaaf!",valentine:"Liebe dein Training \u2764",ramadan:"Ramadan Kareem \u2013 gesegnete Fastenzeit",eidfitr:"Eid Mubarak \u2013 frohes Zuckerfest!",eidadha:"Eid Mubarak \u2013 gesegnetes Opferfest!",nouruz:"Nouruz Mobarak \u2013 frohes neues Jahr!",ostara:"Gesegnete Ostara \u2013 Fr\xFChlingsanfang",easter:"Frohe Ostern!",summer:"Sommersonnenwende \u2013 der l\xE4ngste Tag des Jahres",winter:"Wintersonnenwende \u2013 ab morgen wird es wieder heller",diwali:"Happy Diwali \u2013 frohes Lichterfest!",hanukkah:e=>`Chag Chanukka sameach! \xB7 ${e}. Licht`,christmas:"Frohe Weihnachten!",kwanzaa:"Happy Kwanzaa",halloween:"Happy Halloween!"},fast:{ask:"Fastest du im Ramadan?",askS:"Dann pas iPhone: set the side switch to ring. Android: turn up the media volume.","<b>10 seconds ahead:</b> before each phase ends or starts you get a tone and a short call \u2013 also for holds like the plank.","<b>Strength:</b> one-legged exercises are entered for left and right separately. Holds go straight into the set rest, and the rest can be paused."],ok:"Got it"},profMore:"More: level, discipline, age, limitations",ack:{h:"Quick safety note",pts:["You train at your own risk. Ringzeit doesn't replace a coach or medical advice.","With pre-existing conditions, injuries or complaints, check with a doctor first. Stop at once with pain, dizziness or shortness of breath.","Sparring and partner drills only under supervision.","Under 18 only with your parents' consent."],priv:"Ringzeit is a private project \u2013 not offered by your club, WAKO or any federation.",ok:"Got it \u2013 let's go"},legal:{row:"Notes & privacy",sub:"Safety, liability, your data",h1:"Safety & liability",p1:["Ringzeit is a private, free project. It is not offered by a club, WAKO, WAKO Germany or any federation.","The training suggestions are general recommendations and replace neither a coach nor medical advice. Use at your own risk.","With pre-existing conditions, injuries, pregnancy or complaints, check with a doctor before training. Stop at once with pain, dizziness or shortness of breath.","Sparring and partner drills only under supervision. Children and teenagers under 18 use Ringzeit only with their parents' consent.","The current WAKO Germany rulebooks and your coaches' instructions always take precedence."],h2:"Privacy",p2:["Ringzeit has no account, no ads and no tracking. Everything you enter stays on your device only.","Ringzeit is served via GitHub Pages. When loading and updating, GitHub processes the usual technical access data such as the IP address.","You save backups yourself. \u201CStart over\u201D deletes all data on this device."]},resetLbl:"Start over",resetHint:"Deletes all data on this device \u2013 plan, entries, tests, combos \u2013 and starts the setup again. Best save a backup first.",resetBtn:"Delete all data",resetAsk:"Really delete everything? This can't be undone \u2013 except with a saved backup.",psec:{back:"Profile",train:["Training","Discipline, level, days, club, limitations"],goals:["Goals","Tournaments, belt gradings, focus"],life:["Everyday life & breaks","Week, short on time, work, breaks, KO"],guide:["Guide","Hand wraps, gear care, first aid"],app:["App & data","Backup, my combos, design, tour"],days:e=>`${e} ${e===1?"day":"days"} Ringzeit`,club:e=>`${e}\xD7 club`,noGoal:"No goal set yet",nextComp:e=>`Tournament on ${e}`,nextGrade:e=>`Grading on ${e}`,paused:"Break running"},life:{title:"Everyday life",hint:"Work, school, studies and family take energy too. Everything here is optional.",weekQ:"How is your week looking?",weekS:"Ringzeit adapts your sessions \u2013 one tap is enough.",moods:{easy:"Relaxed",normal:"Normal",hard:"Stressful"},weekLbl:"This week",moodToast:{easy:"Week adjusted \u2013 a bit more on",normal:"Got it \u2013 normal plan",hard:"Week adjusted \u2013 lighter, more technique"},lowLbl:"Short-on-time mode",lowHint:"For exams, moving house, a new baby and the like: sessions of 30 minutes at most, essentials only. Your streak keeps going.",lowOn:"Short-on-time mode on \u2013 30 minutes at most",lowOff:"Short-on-time mode off",workLbl:"Type of work",workHint:"Desk job: more mobility for hips and back. Physical job: a little less strength volume.",works:{"":"Not set",sit:"Desk",phys:"Physical"},formQ:"How do you feel today?",formS:"Optional \u2013 adjusts today's session.",sleep:"Sleep",energy:"Energy",lv:["Poor","Okay","Good"],formDone:"Session adjusted to how you feel",notes:{hard:"Stressful week: fewer rounds, no sparring, no hard conditioning \u2013 training should give energy today, not take it.",easy:"Relaxed week: one extra round is on.",formLow:"Low on energy today: go lighter. Clean technique, no all-out \u2013 better to be well rested for the next session.",formMid:"Medium form: a bit less volume, pace by feel.",low:"Short-on-time mode: essentials only.",sit:"Lots of sitting: finish by mobilising hips and upper back.",phys:"Physical job: a little less strength volume."}},planUpd:"Plan updated",autoSave:"Changes go into your plan right away.",needDay:"Pick at least one training day.",guide:{title:"Guide",hint:"Wrapping your hands, caring for your gear and first aid for small knocks.",wrap:"Hand wraps",care:"Gear care",aid:"Care & first aid",wrapLink:"Hand wraps",video:"Watch video (opens YouTube)",step:(e,n)=>`Step ${e} of ${n}`,prev:"Back",next:"Next",again:"Start over",wrapIntro:"Wraps protect the knuckle bones and the wrist. Adults usually use 4\u20134.5 m. Keep the hand spread while wrapping \u2013 then nothing pinches when you make a fist.",wrapSteps:["Put your thumb through the loop and run the wrap down over the back of the hand.","Wrap the wrist 3 times \u2013 firm, but not cutting off the blood.","Go diagonally over the back of the hand to the knuckles and wrap them 3 times.","Between the fingers: little/ring, ring/middle, middle/index \u2013 each time back over the wrist.","Wrap the thumb once \u2013 it gives it support.","Secure with crosses (X) over the back of the hand, wrap the rest around the wrist and close the velcro. Make a fist: nothing may pinch or tingle."],careSecs:[["Gloves","Take them out of the bag after every session and open them up. Spray the inside with a disinfecting textile freshener and let them air-dry \u2013 not on the radiator, not in blazing sun. Wipe the outside with a damp cloth. The spray adds to airing, it doesn't replace it: moisture is the main cause of smell and germs. On leather, test alcohol-based sprays on a hidden spot first."],["Hand wraps","Wash after every session: in a laundry bag at 30\u201340 \xB0C, velcro closed. Air-dry and store rolled up \u2013 thumb loop inside, velcro outside. Then they're ready to go next time."],["Shin and foot guards","Like gloves: spray inside, air out, wipe the outside. Fabric guards can often go in the wash \u2013 check the label."],["Mouthguard","Rinse with cold water after training \u2013 hot water deforms it. Let it dry in a ventilated case and clean it with a toothbrush now and then. Replace it when it cracks or no longer fits well."],["Head guard and groin guard","Spray inside and air out. Wash the groin guard if the label allows."],["Gym bag","Not a drying room: always unpack your gear after training. A laundry bag for the wraps and a pouch for wet things keep it tidy."]],aidSecs:[["Bruises and strains: PRICE","Protect and rest \u2013 stop right away. Ice \u2013 cool for 10\u201320 minutes, always with a cloth in between. Compression \u2013 a light bandage. Elevate \u2013 above heart level. This limits swelling and bruising."],["Thai boxing liniment (e.g. Namman Muay)","Rub in to warm up the muscles before training, and for massage on tight muscles or older bruises. Not on fresh injuries: cool first for the first 1\u20132 days \u2013 heat can make fresh swelling worse. Not on broken skin, not in the eyes, wash your hands afterwards, don't combine with a hot-water bottle or sauna. These oils usually contain methyl salicylate (aspirin-like): if you're allergic or take blood thinners, ask at the pharmacy first."],["Nosebleed","Lean the head slightly forward, don't tilt it back. Pinch the soft part of the nose for 10 minutes and cool the neck. If it hasn't stopped after 20 minutes: see a doctor."],["Stop at once and see a doctor","After a blow to the head with headache, nausea, dizziness, blurred vision or confusion \u2013 it may be a concussion; the WAKO suspension after a KO applies. If you suspect a fracture (severe pain, deformity, cracking), with swelling that doesn't go down, and with pain that isn't better after 2\u20133 days."]],aidNote:"These tips don't replace a doctor. In an emergency call 112.",winCare:"Spray the inside of gloves and guards with a disinfecting textile freshener and let them air-dry."},pack:{title:"Packing list",card:e=>`Tournament on ${e}`,cardS:(e,n)=>`Packing list: ${e} of ${n} packed`,all:"All packed \u2013 good luck!",open:"Open packing list",add:"Own item",addBtn:"Add",reset:"Clear all ticks",hint:"Time to pack your things!",items:["Head guard","Mouthguard","T-shirt / sleeveless for Kick Light","Gloves","Hand wraps","Trousers / shorts","Groin guard","Shin guards","Foot guards","Cut your toenails","Coach licence","Water","Snacks / food","Shower things"]},coach:{lbl:"Coach calls",hint:"Calls out combos from your level during the round \u2013 react right away."},feast:{newyear0:"Happy New Year's Eve!",newyear1:"Happy New Year!",karneval:"Happy carnival \u2013 Helau & Alaaf!",valentine:"Love your training \u2764",ramadan:"Ramadan Kareem",eidfitr:"Eid Mubarak!",eidadha:"Eid al-Adha Mubarak!",nouruz:"Happy Nowruz!",ostara:"Blessed Ostara \u2013 first day of spring",easter:"Happy Easter!",summer:"Summer solstice \u2013 the longest day of the year",winter:"Winter solstice \u2013 brighter days from tomorrow",diwali:"Happy Diwali!",hanukkah:e=>`Happy Hanukkah! \xB7 candle ${e}`,christmas:"Merry Christmas!",kwanzaa:"Happy Kwanzaa",halloween:"Happy Halloween!"},fast:{ask:"Are you fasting during Ramadan?",askS:"Then Ringzeit adapts your training: lighter, more technique, hard conditioning becomes technique.",yes:"Yes, I'm fasting",no:"No",lbl:"Ramadan mode",hint:"During Ramadan: lighter sessions, technique instead of hard conditioning.",note:"Ramadan: keep training lighter. Best 60\u201390 min before breaking the fast or 1\u20132 h after. After iftar, drink well spread over the evening; stop at once if you feel dizzy.",on:"Ramadan mode on \u2013 blessed fasting",off:"Ramadan mode off"},easeRound:"Opening round: 70 % pace, kicks no higher than the body.",seasonLbl:"Seasonal design",music:{lbl:"Music during round timers",opts:["Interrupt","Keep playing"],hint:"Keep playing: your musi ans 4\u20136 weeks of preparation in your bout format.",compHint:"Several tournaments are possible \u2013 each one is followed by a recovery week.",fmtTxt:(e,n,s)=>`${e} \xD7 ${fmt(n)} min \xB7 ${fmt(s)} rest`,noFormat:"WAKO has no category for your age in this discipline \u2013 the preparation uses the standard format instead.",needBirth:"Add your year of birth in the profile so the bout format for your age category can be worked out.",prep:{build:(e,n,s)=>`Tournament prep \xB7 week ${e} of ${n}: rounds in your bout format (${s}) with fight-pace intervals.`,peak:(e,n,s)=>`Tournament prep \xB7 week ${e} of ${n}: fight simulations in the exact format (${s}), two bouts per session like on tournament day.`,taper:e=>`Taper before the tournament: half the volume, short sharp rounds (${e}), no hard sparring, no impact hardening.`,recover:"Recovery week after the tournament: fewer rounds, low intensity, no impact hardening.",grade:e=>`Grading prep (${e} days left): clean technique, combinations without rushing, practise the grading syllabus. Light sparring only.`},simT:(e,n)=>`Bout ${e} \xB7 round ${n}`,simD1:"In the exact tournament format \u2013 full focus, like a real bout.",simD2:"Take 20\u201330 min of active rest first, like between two tournament bouts. Then be fully back on.",paceIv:"Fight pace: 15 s all-out, 15 s steady \u2013 the whole round.",fmtTag:"Bout format",toComp:"Days to tournament",cheers:["Strong!","Round by round.","Well fought.","One step further.","Discipline pays off."],explosive:"explosive",days:"Extra with Ringzeit",ownHint:"On these days you train extra with Ringzeit \u2013 it builds the sessions for them. Marked blue: your club days.",dayNames:["Mo","Tu","We","Th","Fr","Sa","Su"],minutes:"Minutes per session",minCap:"Mobility sessions last 45 min at most.",compClear:"Remove",limits:"Limitations",lim:{knee:"Knee",shoulder:"Shoulder",wrist:"Wrist",back:"Back",ankle:"Ankle"},limitsHint:"Exercises that load these areas get replaced.",planMade:"New plan is set",storage:"Storage",cloud:"In your account, on all devices",local:"This device only",disclaimer:"Ringzeit does not replace a coach. Spar only under supervision and in full protective gear. Stop if anything hurts. Rules: ",loadingPlan:"Building your plan",loadingSess:"Building your session",loadingApp:"Ringzeit is loading",loadingTest:"Scoring your test",nextFact:"Next \u2192",tapClose:"Tap to close",factK:"Did you know?",tipK:"Technique tip",src:"Source",wrNote:"Wrist: bag work with kicks only.",knNote:"Knee/ankle: no jumps, easy kicks.",noLowNote:e=>`Because of your limitation (knee/ankle), ${e==="k1"?"low kicks and knees are":"low kicks are"} left out today. Change this under Profile \u2192 Limitations.`,deloadNote:"Deload week: rounds and sets reduced.",holdNote:"60\u201390 s each, breathe slowly",weekday:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],cats:{str:"Strength",spd:"Speed",end:"Endurance",flx:"Flexibility",tec:"Technique"},tDesc:{str:"Push-ups in one set, clean: body straight, chest to a fist above the floor.",spd:"Jab-cross pairs in 20 seconds \u2013 on the bag or pads, a partner counts.",end:"Run 2.4 km as fast as you can. Enter your time.",flx:"How high does your clean, controlled side kick reach?",tec:"A coach or partner rates jab, cross, hook, roundhouse, side kick and guard."},tUnit:{str:"reps",spd:"pairs",end:"min : sec"},flxOpt:["Hip","Belly","Chest","Shoulder","Head"],tecOpt:["unsure","basics","clean slow","clean at pace","clean under pressure"],testStart:"Start test",testSave:"Score test",testCancel:"Cancel",testSkip:"Leave a field empty if a limitation means you can't test it.",testNone:"No test yet",testNoneT:"The test takes about 30 minutes and measures five areas. Do it rested, not after a hard session.",testLast:"Latest test",testPrev:"previous",testTotal:"points",testHist:"All tests",testIncomplete:"incomplete",unlocked:"Unlocked",lockedL:"Still locked",need1:"Advanced: at least 15 points, no area below 2",need2:"Competition: at least 20 points, no area below 3",testEvery:"Recommendation: test every 6\u20138 weeks, always rested and under the same conditions.",lvlUp:e=>`Level \u201C${e}\u201D unlocked!`,setL:"Set",holdTarget:(e,n)=>`Timed: hold ${e}\xD7 ${n[0]}\u2013${n[1]} s`,reps:"reps",secs:"sec",kg:"kg",addSet:"+ Set",lastTime:"Last time",volume:"Volume",exDone:e=>`${e} strength exercises`}},CODE={T:"TEC",C:"MIX",P:"SPA",S:"STR",K:"CON",M:"MOB"},FACTS=[{de:"Die WAKO wurde am 26. Februar 1977 in Berlin offiziell gegr\xFCndet \u2013 von Georg Br\xFCckner.",en:"WAKO was officially founded in Berlin on 26 February 1977 by Georg Br\xFCckner.",s:"wako.sport"},{de:"WAKO stand urspr\xFCnglich f\xFCr \u201EWorld All-Style Karate Organization\u201C. Kickboxen hie\xDF anfangs noch Semi- und Full-Contact-Karate.",en:"WAKO originally stood for \u201CWorld All-Style Karate Organization\u201D. Early on, the sport was still called semi- and full-contact karate.",s:"wako.sport"},{de:"Georg Br\xFCckner gilt als \u201EVater des europ\xE4ischen Kickboxens\u201C. Ab 1974 veranstaltete er die ersten Kickbox-Shows in Europa.",en:"Georg Br\xFCckner is known as the \u201Cfather of European kickboxing\u201D. From 1974 he promoted the first kickboxing shows in Europe.",s:"Wikipedia"},{de:"Br\xFCckner erfand und patentierte Schutzausr\xFCstung, damit K\xE4mpfer verschiedener Stile ohne schwere Verletzungen gegeneinander antreten konnten.",en:"Br\xFCckner invented and patented protective gear so fighters from different styles could compete without serious injuries.",s:"Wikipedia"},{de:"Als erster \u201EKickbox-Kampf\u201C gilt f\xFCr die WAKO das Duell Joe Lewis gegen Greg Baines 1970 in den USA \u2013 erstmals mit Boxhandschuhen.",en:"WAKO regards Joe Lewis vs. Greg Baines (USA, 1970) as the first \u201Ckickboxing fight\u201D \u2013 the first time boxing gloves were worn.",s:"wako.sport"},{de:"1974 fand in Los Angeles die erste \u201EWeltmeisterschaft im Full Contact\u201C statt. Erste Weltmeister: Bill Wallace, Jeff Smith und Joe Lewis.",en:"The first \u201CWorld Championship in Full Contact\u201D took place in Los Angeles in 1974. First champions: Bill Wallace, Jeff Smith and Joe Lewis.",s:"wako.sport"},{de:"Die ersten WAKO-Europameisterschaften fanden 1977 in Wien statt \u2013 alle K\xE4mpfe nach Full-Contact-Regeln.",en:"The first WAKO European Championships were held in Vienna in 1977 \u2013 every bout under Full Contact rules.",s:"Wikipedia"},{de:"Bei der ersten WAKO-Weltmeisterschaft 1978 traten 110 Athleten aus 18 L\xE4ndern an.",en:"The first WAKO World Championships in 1978 had 110 competitors from 18 countries.",s:"WAKO India"},{de:"Am 20. Juli 2021 erkannte das IOC die WAKO auf seiner 138. Session in Tokio vollst\xE4ndig an.",en:"On 20 July 2021, the 138th IOC Session in Tokyo granted WAKO full recognition.",s:"wako.sport"},{de:"Die vorl\xE4ufige IOC-Anerkennung f\xFCr Kickboxen kam bereits am 30. November 2018.",en:"Kickboxing received provisional IOC recognition on 30 November 2018.",s:"WAKO India"},{de:"Die WAKO hat 7 Wettkampfdisziplinen: 3 im Ring (Full Contact, Low Kick, K1) und 4 auf der Tatami (Point Fighting, Light Contact, Kick Light, Musical Forms).",en:"WAKO has 7 competitive disciplines: 3 in the ring (Full Contact, Low Kick, K1) and 4 on the tatami (Point Fighting, Light Contact, Kick Light, Musical Forms).",s:"wako.sport"},{de:"Ein Kampf im Ring dauert drei Runden \xE0 zwei Minuten, mit einer Minute Pause dazwischen.",en:"A ring bout is three two-minute rounds with a one-minute break between them.",s:"wako.sport"},{de:"Im Full Contact m\xFCssen pro Runde mindestens 6 Kicks geschlagen werden \u2013 sonst drohen Punktabz\xFCge.",en:"In Full Contact you must throw at least 6 kicks per round, or the referee may deduct points.",s:"Wikipedia"},{de:"Fu\xDFfeger sind im Full Contact erlaubt \u2013 aber nur Fu\xDF gegen Fu\xDF.",en:"Foot sweeps are legal in Full Contact \u2013 but only foot against foot.",s:"USA Kickboxing"},{de:"Full-Contact-K\xE4mpfer tragen lange Hosen, Low-Kick- und K1-K\xE4mpfer kurze Shorts.",en:"Full Contact fighters compete in long pants; Low Kick and K1 fighters wear shorts.",s:"Ontario Kickboxing Rules"},{de:"Light Contact liegt zwischen Point Fighting und Full Contact: gleiche Techniken, aber jeder Treffer muss kontrolliert sein.",en:"Light Contact sits between Point Fighting and Full Contact: the same techniques, but every hit must be controlled.",s:"WAKO Technical Book"},{de:"Laut WAKO trainieren weltweit \xFCber 4 Millionen Menschen Kickboxen \u2013 in mehr als 40.000 Vereinen.",en:"According to WAKO, over 4 million people practise kickboxing in more than 40,000 clubs worldwide.",s:"wako.sport"},{de:"135 Nationen auf f\xFCnf Kontinenten sind Mitglied der WAKO.",en:"135 nations across five continents are WAKO members.",s:"wako.sport"},{de:"Seit der Regelreform hei\xDFt die Disziplin \u201EK1 Rules\u201C offiziell \u201EK1 Style\u201C.",en:"Since the rules reform, the discipline \u201CK1 Rules\u201D is officially called \u201CK1 Style\u201D.",s:"wako.sport"},{de:"Der Hauptsitz der WAKO liegt heute in Monza, Italien.",en:"WAKO's headquarters are in Monza, Italy.",s:"Wikipedia"},{de:"Das Wort \u201EKickboxing\u201C wurde in den 1960er-Jahren in Japan gepr\xE4gt \u2013 vom Box-Promoter Osamu Noguchi.",en:"The word \u201Ckickboxing\u201D was coined in Japan in the 1960s \u2013 by boxing promoter Osamu Noguchi.",s:"Wikipedia: Kickboxing"},{de:"K-1 wurde 1993 in Japan von Kazuyoshi Ishii gegr\xFCndet. Das \u201EK\u201C steht f\xFCr Kampfk\xFCnste wie Karate, Kickboxen und Kung-Fu, die \u201E1\u201C f\xFCr den einen Sieger.",en:"K-1 was founded in Japan in 1993 by Kazuyoshi Ishii. The \u201CK\u201D stands for styles like karate, kickboxing and kung fu, the \u201C1\u201D for the one champion.",s:"Wikipedia: K-1"},{de:"Muay Thai hei\xDFt \u201EKunst der acht Gliedma\xDFen\u201C: zwei F\xE4uste, zwei Ellbogen, zwei Knie, zwei Schienbeine.",en:"Muay Thai is called \u201Cthe art of eight limbs\u201D: two fists, two elbows, two knees, two shins.",s:"Wikipedia: Muay Thai"},{de:"Bill Wallace bekam den Spitznamen \u201ESuperfoot\u201C \u2013 er kickte fast nur mit dem linken Bein, weil sein rechtes Knie verletzt war.",en:"Bill Wallace was nicknamed \u201CSuperfoot\u201D \u2013 he kicked almost only with his left leg because his right knee was injured.",s:"Wikipedia: Bill Wallace"},{de:"Die Queensberry-Regeln von 1867 machten Handschuhe im Boxen zur Pflicht und f\xFChrten Runden \xE0 3 Minuten mit 1 Minute Pause ein.",en:"The Queensberry Rules of 1867 made gloves mandatory in boxing and introduced 3-minute rounds with a 1-minute break.",s:"Wikipedia: Marquess of Queensberry Rules"},{de:"Handschuhe werden in Unzen gewogen: Ein 10-oz-Handschuh wiegt rund 283 Gramm.",en:"Gloves are weighed in ounces: a 10 oz glove weighs about 283 grams.",s:"1 oz = 28,35 g"},{de:"Savate ist franz\xF6sisches \u201EFu\xDFboxen\u201C \u2013 gek\xE4mpft wird dort mit Schuhen.",en:"Savate is French \u201Cfoot boxing\u201D \u2013 it is fought wearing shoes.",s:"Wikipedia: Savate"},{de:"Sanda (Sanshou) ist chinesisches Kickboxen: Schl\xE4ge, Tritte \u2013 und W\xFCrfe sind erlaubt.",en:"Sanda (Sanshou) is Chinese kickboxing: punches, kicks \u2013 and throws are allowed.",s:"Wikipedia: Sanda"},{de:"Im burmesischen Lethwei sind sogar Kopfst\xF6\xDFe erlaubt \u2013 traditionell k\xE4mpft man mit Bandagen, aber ohne Handschuhe.",en:"In Burmese Lethwei even headbutts are allowed \u2013 traditionally fought with wraps but no gloves.",s:"Wikipedia: Lethwei"},{de:"\u201EDojo\u201C bedeutet \u201EOrt des Weges\u201C \u2013 der Raum, in dem man den Weg einer Kampfkunst \xFCbt.",en:"\u201CDojo\u201D means \u201Cplace of the way\u201D \u2013 the room where you practise the way of a martial art.",s:"Wikipedia: Dojo"},{de:"Der h\xE4ufigste Bruch beim Schlagen ist der \u201EBoxerbruch\u201C am f\xFCnften Mittelhandknochen. Bandagen und Treffen mit den ersten beiden Kn\xF6cheln sch\xFCtzen davor.",en:"The most common fracture from punching is the \u201Cboxer's fracture\u201D of the fifth metacarpal. Hand wraps and hitting with the first two knuckles protect against it.",s:"DocCheck Flexikon: Boxerfraktur"},{de:"Muskelkater entsteht durch winzige Risse in den Muskelfasern \u2013 nicht durch Milchs\xE4ure, wie man lange dachte.",en:"Muscle soreness comes from tiny tears in the muscle fibres \u2013 not from lactic acid, as was long believed.",s:"Sportmedizin"},{de:"Knochen passen sich der Belastung an (Wolffsches Gesetz) \u2013 deshalb wird das Schienbein durch langsames, regelm\xE4\xDFiges Training belastbarer.",en:"Bones adapt to the load placed on them (Wolff's law) \u2013 which is why the shin gets tougher with slow, regular training.",s:"Wikipedia: Wolffsches Gesetz"},{de:"Schon rund 2 % Fl\xFCssigkeitsverlust (gemessen am K\xF6rpergewicht) k\xF6nnen die Leistung messbar senken.",en:"Losing as little as about 2 % of body weight in fluid can measurably reduce performance.",s:"ACSM Position Stand"},{de:"Im Tiefschlaf sch\xFCttet der K\xF6rper besonders viel Wachstumshormon aus \u2013 Schlaf ist Teil deines Trainings.",en:"In deep sleep the body releases most of its growth hormone \u2013 sleep is part of your training.",s:"Schlafmedizin"},{de:"Die Reaktionszeit auf einen Sehreiz liegt meist bei rund 0,2 Sekunden \u2013 deshalb sind Finten so wirksam.",en:"Reaction time to something you see is usually around 0.2 seconds \u2013 that's why feints work so well.",s:"Physiologie"},{de:"Im Profiboxen ist der Jab laut Schlagstatistiken der am h\xE4ufigsten geschlagene Schlag.",en:"In pro boxing, punch statistics show the jab is the most frequently thrown punch.",s:"CompuBox"},{de:"Im Ring gibt es eine rote und eine blaue Ecke f\xFCr die K\xE4mpfer \u2013 die zwei \xFCbrigen hei\xDFen \u201Eneutrale Ecken\u201C.",en:"A ring has a red and a blue corner for the fighters \u2013 the other two are called \u201Cneutral corners\u201D.",s:"Wettkampfregeln"},{de:"Im Point Fighting wird nach jedem Treffer unterbrochen und gewertet \u2013 im Light Contact l\xE4uft der Kampf weiter.",en:"In Point Fighting the bout stops after every hit to score it \u2013 in Light Contact the fight keeps going.",s:"WAKO-Regeln"},{de:"\u201EFloat like a butterfly, sting like a bee\u201C \u2013 der ber\xFChmte Spruch von Muhammad Ali stammt aus dem Jahr 1964.",en:"\u201CFloat like a butterfly, sting like a bee\u201D \u2013 Muhammad Ali's famous line dates from 1964.",s:"Wikipedia: Muhammad Ali"},{de:"Seilspringen trainiert Rhythmus, Fu\xDFarbeit und Ausdauer zugleich \u2013 darum geh\xF6rt es seit Generationen zum Box-Training.",en:"Skipping rope trains rhythm, footwork and stamina at once \u2013 that's why it has been part of boxing training for generations.",s:"Trainingslehre"},{de:"Die Kraft eines Schlags kommt aus der ganzen Kette: Fu\xDF, Bein, H\xFCfte, Rumpf, Schulter, Arm \u2013 nicht aus dem Arm allein.",en:"The power of a punch comes from the whole chain: foot, leg, hip, trunk, shoulder, arm \u2013 not from the arm alone.",s:"Biomechanik"},{de:"Bei den World Games 2022 in Birmingham (USA) war Kickboxen erstmals offizielle Sportart \u2013 gek\xE4mpft wurde nach K1-Regeln. 2017 war es dort noch Einladungssportart.",en:"At the 2022 World Games in Birmingham (USA) kickboxing was an official sport for the first time \u2013 fought under K1 rules. In 2017 it had been an invitational sport.",s:"Wikipedia: Kickboxing at the 2022 World Games"},{de:"2023 war Kickboxen zum ersten Mal Teil der European Games: 16 Wettbewerbe in Point Fighting, Light Contact und Full Contact, ausgetragen in My\u015Blenice (Polen).",en:"In 2023 kickboxing was part of the European Games for the first time: 16 events in point fighting, light contact and full contact, held in My\u015Blenice (Poland).",s:"Wikipedia: Kickboxing at the 2023 European Games"},{de:"Ernesto Hoost hie\xDF \u201EMr. Perfect\u201C \u2013 wegen seiner fast maschinenhaft pr\xE4zisen Kombinationen. Er gewann den K-1 World Grand Prix 1997, 1999, 2000 und 2002.",en:"Ernesto Hoost was called \u201CMr. Perfect\u201D for his almost machine-like precise combinations. He won the K-1 World Grand Prix in 1997, 1999, 2000 and 2002.",s:"Wikipedia: Ernesto Hoost"},{de:"Semmy Schilt ist 2,12 m gro\xDF und gewann den K-1 World Grand Prix viermal \u2013 2005, 2006, 2007 und 2009.",en:"Semmy Schilt is 2.12 m tall and won the K-1 World Grand Prix four times \u2013 2005, 2006, 2007 and 2009.",s:"Wikipedia: Semmy Schilt"},{de:"Peter Aerts, \u201EThe Dutch Lumberjack\u201C, gewann den K-1 World Grand Prix 1994, 1995 und 1998 \u2013 und gilt vielen als \u201EMr. K-1\u201C.",en:"Peter Aerts, \u201CThe Dutch Lumberjack\u201D, won the K-1 World Grand Prix in 1994, 1995 and 1998 \u2013 many call him \u201CMr. K-1\u201D.",s:"Wikipedia: Peter Aerts"},{de:"Das Rajadamnern-Stadion in Bangkok wurde ab 1941 gebaut, der Krieg stoppte den Bau. Der erste Kampf fand am 23. Dezember 1945 statt.",en:"Construction of Bangkok's Rajadamnern Stadium began in 1941 and was halted by the war. The first fight took place on 23 December 1945.",s:"WMC: Rajadamnern Stadium History"},{de:"Vor der ersten Runde zeigen Muay-Thai-K\xE4mpfer den Wai Khru Ram Muay \u2013 ein Ritual, das Lehrer und Training ehrt. Gewertet wird er nicht.",en:"Before the first round, Muay Thai fighters perform the Wai Khru Ram Muay \u2013 a ritual honouring their teachers and training. It isn't scored.",s:"Muay Thai Records: Wai Kru Ram Muay"},{de:"Wie schnell dein Puls in der ersten Minute Pause f\xE4llt, zeigt deine Ausdauer: Je schneller er sinkt, desto besser erholst du dich zwischen den Runden.",en:"How fast your pulse drops in the first minute of rest shows your endurance: the faster it falls, the better you recover between rounds.",s:"Sportmedizin"}],TIPS=[{de:"Low Kick: Mit dem Schienbein treffen, nicht mit dem Fu\xDF \u2013 und die H\xFCfte ganz durchdrehen.",en:"Low kick: hit with the shin, not the foot \u2013 and turn the hip all the way through."},{de:"Nach jeder Kombi bewegen: raus aus der Linie oder zur\xFCck in Deckung \u2013 nie stehen bleiben.",en:"Move after every combo: off the line or back into guard \u2013 never stand still."},{de:"Haken: Ellbogen auf Schulterh\xF6he, die Faust dreht mit \u2013 die Kraft kommt aus der Drehung des vorderen Fu\xDFes.",en:"Hook: elbow at shoulder height, the fist turns with it \u2013 power comes from pivoting on the front foot."},{de:"Atmen nicht vergessen: Bei jedem Schlag und Kick kurz und scharf ausatmen.",en:"Don't forget to breathe: a short, sharp exhale with every punch and kick."},{de:"Sidekick: Ferse f\xFChrt, Fu\xDFkante zeigt zum Ziel \u2013 und das Knie erst hoch anziehen, dann strecken.",en:"Side kick: heel leads, the edge of the foot points at the target \u2013 chamber the knee high first, then extend."},{de:"Kinn runter, Augen hoch: So trifft dich weniger, und du siehst trotzdem alles.",en:"Chin down, eyes up: you get hit less and still see everything."},{de:"Abstand ist Verteidigung: Bleib knapp au\xDFerhalb der Reichweite und komm nur zum Treffen rein.",en:"Distance is defence: stay just outside range and only step in to hit."},{de:"Uppercut: Erst leicht in die Knie, dann aus Beinen und H\xFCfte nach oben \u2013 nicht ausholen.",en:"Uppercut: dip the knees slightly, then drive up from legs and hips \u2013 don't wind up."},{de:"Jab: Die Schulter sch\xFCtzt das Kinn, und die Hand kommt auf derselben Linie zur\xFCck, auf der sie rausging.",en:"Jab: your shoulder covers your chin, and the hand returns on the same line it went out."},{de:"Cross: Die Kraft kommt aus H\xFCfte und hinterem Fu\xDF \u2013 die Ferse dreht mit nach au\xDFen.",en:"Cross: power comes from the hip and rear foot \u2013 turn the heel out with it."},{de:"Haken: Ellbogen auf Fausth\xF6he, Rotation aus dem Rumpf. Nicht ausholen, sonst sieht man ihn kommen.",en:"Hook: elbow level with the fist, rotate from the trunk. Don't wind up, or they'll see it coming."},{de:"Roundhouse: Standfu\xDF eindrehen, bis die Ferse zum Gegner zeigt \u2013 sonst fehlt die H\xFCfte.",en:"Roundhouse: pivot the standing foot until the heel points at your opponent \u2013 otherwise the hip is missing."},{de:"Sidekick: Erst das Knie hoch zur Brust ziehen, dann die Ferse auf gerader Linie raussto\xDFen.",en:"Side kick: chamber the knee to your chest first, then drive the heel out in a straight line."},{de:"Frontkick: Knie anheben, H\xFCfte nach vorn schieben, mit dem Ballen treffen und schnell zur\xFCckziehen.",en:"Front kick: lift the knee, push the hip forward, hit with the ball of the foot and retract fast."},{de:"Nach jedem Kick sofort die H\xE4nde zur\xFCck ans Kinn \u2013 die meisten Treffer kassiert man beim Absetzen.",en:"After every kick, hands straight back to the chin \u2013 most hits land while you're putting the foot down."},{de:"Bei jedem Schlag kurz ausatmen. Das stabilisiert den Rumpf und verhindert, dass dir in Runde 3 die Luft ausgeht.",en:"Exhale sharply with every strike. It braces your core and keeps you from gassing out in round 3."},{de:"Beinarbeit: Niemals die F\xFC\xDFe kreuzen. Der Fu\xDF in Bewegungsrichtung geht immer zuerst.",en:"Footwork: never cross your feet. The foot nearest the direction of travel always moves first."},{de:"Gedrehter Backkick: Erst dreht der Kopf, der Blick geht \xFCber die Schulter \u2013 dann l\xF6st du den Kick.",en:"Spinning back kick: turn your head first and look over your shoulder \u2013 then release the kick."},{de:"Fu\xDFfeger klappen \xFCber Timing, nicht \xFCber Kraft: fegen, wenn der Gegner das Gewicht auf den vorderen Fu\xDF verlagert.",en:"Sweeps are about timing, not power: sweep as your opponent shifts weight onto the front foot."},{de:"Kontrolle ist Technik: treffen und sofort zur\xFCckziehen, statt durchzuschlagen.",en:"Control is technique: touch and retract instantly instead of punching through.",d:["lc","kl"]},{de:"Plane deine 6 Kicks fr\xFCh in der Runde ein. Wer am Ende nachz\xE4 ,62],p:[118,96],w:[150,70],W:[146,74],ea:[0,1],f:[112,148],F:[104,148]}),props:[["cable",[168,2],[168,24]],["rect",[150,24],[36,100]]],arrow:[[200,74],[186,74]],hold:!0},"Schienbeine abklopfen":{a:{p:[96,140],s:[100,106],h:[104,82],f:[150,146],F:[146,146],ka:[0,-1],KA:[0,-1],w:[132,112],W:[128,116],ea:[0,1]},b:{p:[96,140],s:[100,106],h:[106,82],f:[150,146],F:[146,146],ka:[0,-1],KA:[0,-1],w:[140,128],W:[128,116],ea:[0,1]},arrow:[[160,100],[150,120]]}});function sdCircleSvg(){let e=`<svg class="sketch" viewBox="0 0 240 156" role="img"><defs><marker id="skHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${SK.BRASS}"/></marker></defs><circle cx="120" cy="78" r="58" fill="none" stroke="#2b2f36" stroke-width="2" stroke-dasharray="5 6"/>`;return[0,72,144,216,288].forEach(n=>{const s=n*Math.PI/180,i=120+Math.cos(s)*58,r=78+Math.sin(s)*58;e+=`<ellipse cx="${i.toFixed(1)}" cy="${r.toFixed(1)}" rx="13" ry="9" transform="rotate(${n+90} ${i.toFixed(1)} ${r.toFixed(1)})" fill="${SD_PAL.near}"/><circle cx="${i.toFixed(1)}" cy="${r.toFixed(1)}" r="6.5" fill="${SD_PAL.far}"/>`}),e+=`<ellipse cx="120" cy="78" rx="15" ry="10" fill="${SK.W}"/><circle cx="120" cy="78" r="7.5" fill="#d9d4cc"/>`,e+=skArrow([136,66],[156,48])+skArrow([108,92],[92,108]),e+"</svg>"}function sdSketchSvg(e){if(e==="4.sd.1"||e==="5.sd.1")return sdCircleSvg();const n=SDSK[e];if(!n)return"";const s=n.props||[];let i=`<svg class="sketch" viewBox="0 0 240 156" role="img"><defs><marker id="skHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${SK.BRASS}"/></marker></defs>${skProp(["floor"])}`;return n.parts.forEach(([r,l,a])=>i+=skFigure(l,r==="a"?SD_PAL:null,a)),i+=s.map(skProp).join(""),i+(n.arrow?skArrow(...n.arrow):"")+"</svg>"}const SDTIPS={"1.sd.0":[["Kinn senken, Schultern hochziehen \u2013 das sch\xFCtzt den Hals.","Schritt schr\xE4g zur\xFCck, einen Arm gestreckt nach oben rei\xDFen.","Kr\xE4ftig zur Seite dieses Arms drehen: Die Schulter dr\xFCckt \xFCber die Arme des Angreifers, der Griff geht auf.","Aus der Drehung sofort kontern (Ellbogen oder hintere Gerade), dann Distanz und Deckung."],["Lower the chin, raise the shoulders \u2013 this protects the throat.","Step back at an angle and throw one arm straight up.","Turn hard to the side of that arm: the shoulder rolls over the attacker's arms and breaks the grip.","Counter straight out of the turn (elbow or rear straight), then distance and guard."]],"1.sd.1":[["Kinn senken, mit beiden H\xE4nden kurz an den Fingern ziehen, um Luft zu bekommen.","Einen Arm gestreckt nach oben rei\xDFen.","Zum Angreifer hin drehen \u2013 der Arm wickelt \xFCber seine Arme und l\xF6st den Griff.","Ellbogen oder Haken zum K\xF6rper, dann Distanz schaffen."],["Lower the chin, pull at the fingers with both hands for air.","Throw one arm straight up.","Turn towards the attacker \u2013 the arm wraps over his arms and breaks the grip.","Elbow or hook to the body, then create distance."]],"1.sd.2":[["Kinn zur Schulter, die Schulter auf der Angreiferseite hochziehen.","Den Arm zum Angreifer hin gestreckt nach oben rei\xDFen.","Zum Angreifer drehen, der Arm dr\xFCckt seine Arme vom Hals weg.","Ellbogen oder Faustschlag zum K\xF6rper, dann weg."],["Chin to the shoulder, raise the shoulder on the attacker's side.","Throw the arm nearest the attacker straight up.","Turn into the attacker; the arm drives his arms off the neck.","Elbow or punch to the body, then get away."]],"1.sd.3":[["Mit beiden H\xE4nden die greifende Hand fest auf den Kopf dr\xFCcken \u2013 das nimmt den Zug.","Mit dem Zug gehen statt dagegen.","Konter mit Tritt oder Knie zum K\xF6rper.","Die Hand am Handgelenk nach unten abknicken, l\xF6sen, Distanz."],["Press the grabbing hand onto your head with both hands \u2013 this takes the pull out.","Go with the pull instead of against it.","Counter with a kick or knee to the body.","Bend the hand down at the wrist, release, distance."]],"2.sd.0":[["Kinn einziehen, Kopf zum Angreifer drehen, damit der Hals frei bleibt.","Mit der nahen Hand in den K\xF6rper oder Unterleib schlagen.","Die freie Hand greift \xFCber seine Schulter ins Gesicht und zieht den Kopf nach hinten.","Kopf herausziehen, aufrichten, Konter und Distanz. Von vorne: am Unterarm ziehen, Schl\xE4ge zum K\xF6rper, Kopf zur Seite herausdrehen."],["Tuck the chin, turn the head towards the attacker to keep the throat free.","Strike the body or groin with the near hand.","Reach over his shoulder to his face with the free hand and pull his head back.","Pull the head out, stand up, counter and distance. From the front: pull at the forearm, strikes to the body, twist the head out sideways."]],"2.sd.1":[["Kinn in die Armbeuge dr\xFCcken, mit beiden H\xE4nden den Unterarm nach unten ziehen.","Gewicht tief, H\xFCfte zur Seite schieben.","Ellbogen nach hinten in den K\xF6rper, Ferse auf den Fu\xDF.","Unter dem Arm zur Ellbogenseite herausdrehen, Distanz."],["Press the chin into the crook of the arm, pull the forearm down with both hands.","Drop your weight, shift the hips to the side.","Elbow back into the body, heel onto the foot.","Turn out under the arm towards the elbow side, distance."]],"2.sd.2":[["Sofort die Ellbogen fest an den K\xF6rper pressen, damit der Griff nicht schlie\xDFt.","Gewicht tief, Kopf nicht nach vorne dr\xFCcken lassen.","Ferse auf den Fu\xDF oder Schritt zur Seite, Ellbogen nach hinten.","Nach unten aus dem Griff gleiten und herausdrehen, Distanz."],["Clamp the elbows to the body at once so the hold can't close.","Drop your weight, don't let the head be pushed forward.","Heel onto the foot or step to the side, elbow back.","Slide down out of the hold and turn out, distance."]],"2.sd.3":[["Hand \xF6ffnen, Ellbogen zum Angreifer bringen.","Gegen den Daumen herausdrehen \u2013 das ist die schw\xE4chste Stelle des Griffs.","Bei Griff mit beiden H\xE4nden: eigene Hand von oben greifen und nach oben herausrei\xDFen.","Sofort Konter oder Distanz."],["Open the hand, bring the elbow towards the attacker.","Twist out against the thumb \u2013 the weakest point of the grip.","Two-handed grip: grab your own hand from above and rip it out upwards.","Counter or distance straight away."]],"3.sd.0":[["H\xFCfte zur\xFCck, Gewicht tief \u2013 nicht ausheben lassen.","Die H\xE4nde sind frei: Handballen unter sein Kinn und den Kopf wegdr\xFCcken.","Knie zum K\xF6rper.","Aus der gelockerten Umklammerung l\xF6sen, Distanz. Von hinten: Gewicht tief, Ellbogen nach hinten, Ferse auf den Fu\xDF, herausdrehen."],["Hips back, weight low \u2013 don't get lifted.","Your hands are free: heel of the hand under his chin, push the head away.","Knee to the body.","Break out of the loosened hug, distance. From behind: weight low, elbow back, heel onto the foot, turn out."]],"3.sd.1":[["Gewicht tief, H\xFCfte zur Seite oder zur\xFCck.","H\xE4nde an seine H\xFCfte bringen und Raum schaffen.","Knie oder Hammerfaust in den Unterleib.","Arme nach au\xDFen sprengen, nach unten herausducken, Distanz. Von hinten genauso, mit Ferse auf den Fu\xDF."],["Weight low, hips to the side or back.","Bring the hands to his hips and make space.","Knee or hammer fist to the groin.","Burst the arms outwards, duck out downwards, distance. Same from behind, plus heel onto the foot."]],"3.sd.2":[["Gewicht tief, Stand verbreitern.","Ellbogen in seinen K\xF6rper.","Mit der freien Hand Kopf oder Kinn wegdr\xFCcken.","Herausdrehen, Distanz."],["Weight low, widen the stance.","Elbow into his body.","Push his head or chin away with the free hand.","Turn out, distance."]],"4.sd.0":[["Nach vorne in die Distanz gehen \u2013 nah an seine Hand, nie an die Stockspitze.","Doppelblock mit beiden Unterarmen gegen seinen Arm, nicht gegen den Stock.","Den Stockarm umklammern und kontrollieren, Knie oder Schl\xE4ge zum K\xF6rper.","Stock wegnehmen oder Distanz. Von innen und au\xDFen genauso, beim Stich seitlich aus der Linie und den Arm nach au\xDFen parieren."],["Move forward into the range \u2013 close to his hand, never to the tip of the stick.","Double block with both forearms against his arm, not the stick.","Wrap and control the stick arm, knee or strikes to the body.","Take the stick or create distance. Same from inside and outside; against a thrust, step off the line and parry the arm outwards."]],"4.sd.1":[["St\xE4ndig bewegen, nie stehen bleiben.","Alle Angreifer im Blick halten, keinem l\xE4nger den R\xFCcken zeigen.","Jeden Angriff kurz und klar l\xF6sen: abwehren, kontern, sofort weiter.","Pr\xFCfer achten auf \xDCbersicht und Kontrolle, nicht auf H\xE4rte."],["Keep moving, never stand still.","Keep all attackers in view, never turn your back for long.","Solve each attack short and clean: defend, counter, move on.","Examiners look for awareness and control, not hardness."]],"5.sd.0":[["H\xE4nde vorne, Distanz halten.","Beim Stich seitlich aus der Linie, mit der Hand am Unterarm parieren.","Messerarm mit beiden H\xE4nden kontrollieren, Klinge vom K\xF6rper weg.","Konter mit Knie oder Tritt, Entwaffnen oder Distanz. Von oben, innen, au\xDFen: Doppelblock am Unterarm, dann Arm kontrollieren."],["Hands up front, keep your distance.","Against a thrust, step off the line and parry the forearm with your hand.","Control the knife arm with both hands, blade away from you.","Counter with knee or kick, disarm or create distance. Overhead, inside, outside: double block on the forearm, then control the arm."]],"5.sd.1":[["St\xE4ndig bewegen, nie stehen bleiben.","Alle Angreifer im Blick halten, keinem l\xE4nger den R\xFCcken zeigen.","Jeden Angriff kurz und klar l\xF6sen: abwehren, kontern, sofort weiter.","Pr\xFCfer achten auf \xDCbersicht und Kontrolle, nicht auf H\xE4rte."],["Keep moving, never stand still.","Keep all attackers in view, never turn your back for long.","Solve each attack short and clean: defend, counter, move on.","Examiners look for awareness and control, not hardness."]],"6.sd.0":[["Kinn runter, mit den H\xE4nden an seinen Unterarmen ziehen, um Luft zu bekommen.","Einen seiner Arme mit deinem Arm klemmen, den Fu\xDF auf derselben Seite neben seinem Fu\xDF aufstellen.","H\xFCfte explosiv hoch (Br\xFCcke) und \xFCber die geklemmte Seite rollen.","Oben ankommen, aufstehen, Distanz."],["Chin down, pull at his forearms with your hands for air.","Trap one of his arms with yours, plant the foot on the same side next to his foot.","Drive the hips up explosively (bridge) and roll over the trapped side.","Come out on top, stand up, distance."]],"6.sd.1":[["Auf der H\xFCfte drehen, die F\xFC\xDFe bleiben zum Angreifer.","Ist er zu nah: Doppelblock mit den Unterarmen \xFCber dem Kopf.","Tritt gegen Knie oder Schienbein seines vorderen Beins.","Technisch aufstehen: eine Hand hinten aufst\xFCtzen, Bein durchziehen, Deckung oben, Distanz."],["Spin on the hip, keep the feet towards the attacker.","If he's too close: double forearm block above the head.","Kick his lead knee or shin.","Technical stand-up: post one hand behind, pull the leg through, guard up, distance."]],"6.sd.2":[["Unterarme sch\xFCtzen den Kopf, F\xFC\xDFe zum Angreifer.","Den tretenden Fu\xDF abfangen und festklammern oder sein Standbein treten.","Ihn mit dem Bein aus dem Gleichgewicht bringen.","Technisch aufstehen, Deckung oben, Distanz."],["Forearms cover the head, feet towards the attacker.","Catch and trap the kicking leg, or kick his standing leg.","Use your legs to take his balance.","Technical stand-up, guard up, distance."]]};function sdInfoHtml(e){const n=SDTIPS[e],s=S.profile.lang==="de"?0:1,i=sdSketchSvg(e);return`${i?`<div class="skwrap">${i}</div><span class="sub">${t("sdLegend")}</span>`:""}<div class="lab">${t("sdSteps")}</div><ol class="cues">${n[s].map(r=>`<li>${esc(r)}</li>`).join("")}</ol><div class="note warn">${t("sdSafe")}</div><span class="sub">${t("sdNote")}</span>`}const THEORY={notwehr:{de:{t:"Notwehr",cards:[["Das Gesetz","\xA7 32 StGB: Wer eine Tat begeht, die durch Notwehr geboten ist, handelt nicht rechtswidrig. Notwehr ist die Verteidigung, die erforderlich ist, um einen gegenw\xE4rtigen rechtswidrigen Angriff von sich oder einem anderen abzuwenden."],["Angriff, gegenw\xE4rtig, rechtswidrig","Ein Angriff ist die Bedrohung deines K\xF6rpers, deiner Freiheit oder deines Eigentums durch einen Menschen. Gegenw\xE4rtig hei\xDFt: Er steht unmittelbar bevor, l\xE4uft gerade oder dauert noch an. Ist er vorbei, ist ein Gegenschlag keine Notwehr mehr, sondern selbst eine Straftat. Rechtswidrig hei\xDFt: Der Angreifer hat kein Recht dazu."],["Erforderlich","Erlaubt ist die Verteidigung, die den Angriff sicher beendet. Gibt es mehrere gleich sichere Mittel, musst du das mildeste w\xE4hlen. Wer Kampfsport kann, hat oft mildere wirksame Mittel wie Befreien oder Wegsto\xDFen, und das wird ber\xFCcksichtigt."],["Nothilfe","Notwehr gilt auch, wenn jemand anderes angegriffen wird: \u201Evon sich oder einem anderen\u201C. Das nennt man Nothilfe."],["Grenzen","Eingeschr\xE4nkt ist Notwehr zum Beispiel bei Angriffen von Kindern oder erkennbar Betrunkenen, bei einem krassen Missverh\xE4ltnis zwischen Angriff und Verteidigung oder wenn du den Angriff selbst provoziert hast. Dann gilt: ausweichen, Abstand, Hilfe holen."],["Notwehrexzess (\xA7 33 StGB)","Wer die Grenzen der Notwehr aus Verwirrung, Furcht oder Schrecken \xFCberschreitet, wird nicht bestraft. Aus Wut oder Rache gilt das nicht."],["In der Praxis","Weggehen, Abstand halten, laut werden und Hilfe holen (110) ist fast immer die beste L\xF6sung. Das ist eine Lernhilfe f\xFCr die Pr\xFCfung, keine Rechtsberatung."]],quiz:[["Nach einem Schlag l\xE4uft der Angreifer weg. Darfst du hinterher und zur\xFCckschlagen?",["Ja, das ist Notwehr","Nein, der Angriff ist nicht mehr gegenw\xE4rtig","Ja, wenn der Schlag wehgetan hat"],1,"Notwehr gibt es nur gegen einen gegenw\xE4rtigen Angriff. Ein Racheschlag ist selbst strafbar."],["Was bedeutet \u201Eerforderlich\u201C?",["Jede Verteidigung ist erlaubt","Das mildeste von mehreren gleich sicheren Mitteln","Nur Abwehr, nie ein Gegenschlag"],1,"Die Verteidigung muss den Angriff sicher beenden, aber unter gleich sicheren Mitteln das mildeste sein."],["Ein Freund wird angegriffen. Darfst du eingreifen?",["Ja, das ist Nothilfe","Nein, Notwehr gilt nur f\xFCr dich selbst","Nur wenn er dich darum bittet"],0,"\xA7 32 StGB: Angriff \u201Evon sich oder einem anderen\u201C."],["Wann bleibt ein \xDCberschreiten der Notwehr straffrei?",["Aus Wut","Aus Furcht oder Schrecken","Wenn der Angreifer st\xE4rker war"],1,"\xA7 33 StGB nennt Verwirrung, Furcht oder Schrecken, nicht Wut oder Rache."],["Wo ist die Notwehr geregelt?",["\xA7 32 StGB","\xA7 823 BGB","Grundgesetz Artikel 2"],0,"Notwehr steht in \xA7 32 des Strafgesetzbuchs, der Notwehrexzess in \xA7 33."]]},en:{t:"Self-defence law (Germany)",cards:[["The law","\xA7 32 of the German Criminal Code: an act required by self-defence is not unlawful. Self-defence is the defence necessary to avert a present unlawful attack on yourself or another person."],["Attack, present, unlawful","An attack is a threat by a person to your body, freedom or property. Present means it's imminent, happening or still ongoing. Once it's over, hitting back is no longer self-defence but an offence itself. Unlawful means the attacker has no right to do it."],["Necessary","You may use the defence that reliably ends the attack. Of several equally safe means you must choose the mildest. Trained fighters often have milder effective options such as releasing or pushing away, and that is taken into account."],["Defending others","Self-defence also covers attacks on someone else: \u201Cyourself or another person\u201D."],["Limits","Self-defence is restricted, for example, against children or obviously drunk people, when attack and defence are grossly out of proportion, or if you provoked the attack. Then: step away, keep distance, get help."],["Excessive self-defence (\xA7 33)","Exceeding the limits out of confusion, fear or shock is not punished. Out of anger or revenge it is."],["In practice","Walking away, keeping distance, shouting and calling for help (110 in Germany) is almost always best. This is a study aid for the grading, not legal advice."]],quiz:[["After a punch the attacker runs off. May you chase him and hit back?",["Yes, that's self-defence","No, the attack is no longer present","Yes, if the punch hurt"],1,"Self-defence only applies to a present attack. A revenge punch is an offence itself."],["What does \u201Cnecessary\u201D mean?",["Any defence is allowed","The mildest of several equally safe means","Only blocking, never a counter"],1,"The defence must reliably end the attack, but be the mildest of equally safe options."],["A friend is attacked. May you step in?",["Yes, defending others is covered","No, it only applies to yourself","Only if he asks you"],0,"\xA7 32: an attack on \u201Cyourself or another person\u201D."],["When does exceeding self-defence go unpunished?",["Out of anger","Out of fear or shock","If the attacker was stronger"],1,"\xA7 33 names confusion, fear or shock, not anger or revenge."],["Where is self-defence regulated in Germany?",["\xA7 32 Criminal Code (StGB)","\xA7 823 Civil Code","Basic Law Article 2"],0,"Self-defence is \xA7 32 StGB, excessive self-defence \xA7 33."]]}},pf:{de:{t:"Regelkunde Point Fighting",cards:[["Prinzip","Kontrollierte, schnelle Techniken auf erlaubte Ziele. Wie beim Fechten z\xE4hlt der erste Treffer: Nach jeder Wertung unterbricht der Hauptkampfrichter den Kampf."],["Punkte","Schlag (auch gesprungen): 1 \xB7 Tritt zum K\xF6rper: 1 \xB7 Fu\xDFfeger: 1 \xB7 Tritt zum Kopf: 2 \xB7 gesprungener Tritt zum K\xF6rper: 2 \xB7 gesprungener Tritt zum Kopf: 3."],["Trefferfl\xE4chen","Kopf vorne und seitlich, Hinterkopf nur bei einem Angriff von vorne. Oberk\xF6rper vorne und seitlich oberhalb des G\xFCrtels. Fu\xDFfeger nur Fu\xDF gegen Fu\xDF bis zur Kn\xF6chelh\xF6he."],["Verboten","Angriffe auf Hals, R\xFCcken, Beine und unterhalb der G\xFCrtellinie, Knie, Ellbogen, Kopfsto\xDF, W\xFCrfe, Klammern, blinde Techniken, der gedrehte Backfist, Angriffe auf einen fallenden oder liegenden Gegner und Weiterk\xE4mpfen nach \u201EStop\u201C."],["Zeit und Kampfende","Landesebene 2 Runden \xE0 2 min (1 min Pause) oder \xE0 1,5 min (30 s Pause), Bundesfinale und international 3 \xD7 2 min. Die Zeit l\xE4uft bei Wertungen weiter. Bei 6 bzw. 10 Punkten Vorsprung endet der Kampf vorzeitig. Jeder Exit gibt einen Minuspunkt, der vierte f\xFChrt zur Disqualifikation."]],quiz:[["Wie viele Punkte gibt ein Tritt zum Kopf?",["1","2","3"],1,"Tritt zum Kopf: 2 Punkte, gesprungen 3."],["Was passiert nach einem Wertungstreffer?",["Es wird weitergek\xE4mpft","Der Hauptkampfrichter unterbricht","Die Runde endet"],1,"Point Fighting ist Stop-and-go: Nach jeder Wertung wird unterbrochen."],["Ist der gedrehte Backfist erlaubt?",["Ja","Nein","Nur zum K\xF6rper"],1,"Der gedrehte Backfist (spinning backfist) ist im Point Fighting verboten."],["Wohin darf ein Fu\xDFfeger gehen?",["Gegen den Fu\xDF bis Kn\xF6chelh\xF6he","Gegen die Wade","Gegen das Knie"],0,"Nur Fu\xDF gegen Fu\xDF bis zur Kn\xF6chelh\xF6he."],["Was gibt ein gesprungener Tritt zum Kopf?",["2 Punkte","3 Punkte","4 Punkte"],1,"Das ist die h\xF6chste Einzelwertung: 3 Punkte."]]},en:{t:"Point fighting rules",cards:[["Principle","Controlled, fast techniques to legal targets. As in fencing the first hit counts: after every score the referee stops the fight."],["Points","Punch (also jumping): 1 \xB7 kick to the body: 1 \xB7 foot sweep: 1 \xB7 kick to the head: 2 \xB7 jumping kick to the body: 2 \xB7 jumping kick to the head: 3."],["Targets","Head front and side, back of the head only when attacked from the front. Torso front and side above the belt. Foot sweeps only foot to foot up to the ankle."],["Forbidden","Attacks to the throat, back, legs and below the belt, knees, elbows, headbutts, throws, clinching, blind techniques, the spinning backfist, attacking a falling or downed opponent and fighting on after \u201Cstop\u201D."],["Time and end","State level 2 rounds of 2 min (1 min break) or 1.5 min (30 s break), national finals and international 3 \xD7 2 min. The clock keeps running during scoring. A lead of 6 or 10 points ends the fight early. Each exit costs a minus point, the fourth means disqualification."]],quiz:[["How many points is a kick to the head?",["1","2","3"],1,"Kick to the head: 2 points, jumping 3."],["What happens after a score?",["The fight goes on","The referee stops the fight","The round ends"],1,"Point fighting is stop-and-go: every score stops the fight."],["Is the spinning backfist allowed?",["Yes","No","Only to the body"],1,"The spinning backfist is forbidden in point fighting."],["Where may a foot sweep go?",["Foot to foot up to the ankle","To the calf","To the knee"],0,"Only foot to foot up to the ankle."],["What does a jumping kick to the head score?",["2 points","3 points","4 points"],1,"The highest single score: 3 points."]]}},lkvk:{de:{t:"Regelkunde Leicht- und Vollkontakt",cards:[["Leichtkontakt: Prinzip","Durchk\xE4mpfen ohne Unterbrechung nach Treffern. Schnelle, kraftvolle Techniken, aber nur leichter Kontakt. Hand- und Fu\xDFtechniken sollen ausgeglichen eingesetzt werden. Leichtkontakt gilt als Vorstufe zum Full Contact."],["Leichtkontakt: Wertung","Drei Seitenrichter werten elektronisch. Punkte wie im Point Fighting: Schlag, Tritt zum K\xF6rper, Fu\xDFfeger 1 \xB7 Tritt zum Kopf und gesprungener Tritt zum K\xF6rper 2 \xB7 gesprungener Tritt zum Kopf 3. Bei 15 Punkten Vorsprung endet der Kampf. Jeder Exit gibt einen Minuspunkt, der vierte f\xFChrt zur Disqualifikation."],["Leichtkontakt: Zeit","Landesebene 2 \xD7 2 min oder 2 \xD7 1,5 min, Bundesfinale und international 3 \xD7 2 min mit 1 min Pause. Kampffl\xE4che bei Meisterschaften 7 \xD7 7 m."],["Vollkontakt: Prinzip","Im Ring, Schl\xE4ge und Tritte mit voller Kraft, ein K. o. ist m\xF6glich. Erlaubt sind Jab, Punch, Haken, Aufw\xE4rtshaken, Tritte auch mit dem Schienbein und Fu\xDFfeger. Treffer nur an Kopf und Oberk\xF6rper oberhalb des G\xFCrtels, keine Tritte gegen die Beine."],["Vollkontakt: Regeln","3 Runden \xE0 2 min, 1 min Pause. Pro Runde mindestens 6 Kicks, ein Kickz\xE4hler z\xE4hlt mit. Wer weniger tritt, bekommt einen Minuspunkt, der 3 Trefferpunkten entspricht. Kopfschutz, 10-oz-Handschuhe, Mund-, Schienbein-, Fu\xDF- und Tiefschutz sind Pflicht."]],quiz:[["Wird im Leichtkontakt nach einem Treffer unterbrochen?",["Ja, wie im Point Fighting","Nein, es wird durchgek\xE4mpft","Nur bei Kopftreffern"],1,"Leichtkontakt ist ein Continuous Fight."],["Ab welchem Vorsprung endet ein Leichtkontakt-Kampf vorzeitig?",["6 Punkte","10 Punkte","15 Punkte"],2,"Sieg durch \xDCberlegenheit bei 15 Punkten Vorsprung."],["Wie viele Kicks pro Runde sind im Vollkontakt mindestens gefordert?",["4","6","8"],1,"Mindestens 6 Kicks, sonst gibt es einen Minuspunkt."],["Darf man im Vollkontakt gegen den Oberschenkel treten?",["Ja","Nein, nur Kopf und Oberk\xF6rper","Nur mit dem Schienbein"],1,"Tritte gegen die Beine gibt es erst im Low Kick und K1. Im Vollkontakt ist am Bein nur der Fu\xDFfeger erlaubt."],["Wie lang ist eine Vollkontakt-Runde?",["1,5 min","2 min","3 min"],1,"3 Runden \xE0 2 min mit 1 min Pause."]]},en:{t:"Light & full contact rules",cards:[["Light contact: principle","Continuous fighting without stops after scores. Fast, powerful techniques but only light contact. Hands and kicks should be balanced. Light contact is the step before full contact."],["Light contact: scoring","Three judges score electronically. Points as in point fighting: punch, body kick, foot sweep 1 \xB7 head kick and jumping body kick 2 \xB7 jumping head kick 3. A 15-point lead ends the fight. Each exit costs a minus point, the fourth means disqualification."],["Light contact: time","State level 2 \xD7 2 min or 2 \xD7 1.5 min, national finals and international 3 \xD7 2 min with 1 min breaks. Area at championships 7 \xD7 7 m."],["Full contact: principle","In the ring, punches and kicks with full power, knockouts are possible. Allowed: jab, punch, hook, uppercut, kicks including with the shin, and foot sweeps. Targets only head and torso above the belt, no kicks to the legs."],["Full contact: rules","3 rounds of 2 min, 1 min break. At least 6 kicks per round, counted by a kick judge. Fewer kicks cost a minus point worth 3 scoring points. Headguard, 10 oz gloves, mouth, shin, foot and groin guard are mandatory."]],quiz:[["Is light contact stopped after a score?",["Yes, like point fighting","No, it's continuous","Only for head shots"],1,"Light contact is a continuous fight."],["What lead ends a light contact bout early?",["6 points","10 points","15 points"],2,"Win by superiority with a 15-point lead."],["How many kicks per round are required in full contact?",["4","6","8"],1,"At least 6 kicks, otherwise a minus point."],["May you kick the thigh in full contact?",["Yes","No, only head and torso","Only with the shin"],1,"Leg kicks come with low kick and K1. In full contact only the foot sweep may go to the leg."],["How long is a full contact round?",["1.5 min","2 min","3 min"],1,"3 rounds of 2 min with 1 min breaks."]]}},formen:{de:{t:"Regelkunde Formen",cards:[["Was sind Formen?","Eine Vorf\xFChrung ohne Gegner: eine selbst gestaltete Abfolge von Techniken, Tritten und Bewegungen, die wie ein Kampf gegen imagin\xE4re Gegner wirkt."],["Musikformen","Vorf\xFChrung zur Musik, unterteilt in Hard Style (kraftvoll, karate\xE4hnlich), Soft Style (flie\xDFend, wushu\xE4hnlich) und Creative Forms mit akrobatischen Elementen. Jede Variante gibt es auch mit Waffen."],["Kreativformen","Bei WAKO Deutschland zus\xE4tzlich: Kreativformen und Kreativformen mit Waffen, ohne Musik und ohne Zeitlimit. Ein Starter darf pro Turnier h\xF6chstens vier Kategorien aus Musik- und Kreativformen belegen."],["Bewertung","Punkte von 7,0 bis 10,0. Kriterien sind Basics (Stellungen, Hand- und Fu\xDFtechniken, Blocks), Gleichgewicht und Fokus, Schwierigkeit (Spr\xFCnge, Drehungen, Kombinationen) und Darbietung. In Waffenkategorien z\xE4hlt die Waffenhandhabung zuerst."]],quiz:[["In welchem Bereich liegen die Wertungen bei Formen?",["0\u201310","5,0\u201310,0","7,0\u201310,0"],2,"Bewertet wird von 7,0 bis 10,0 Punkten."],["Werden Kreativformen mit Musik gezeigt?",["Ja, immer","Nein, ohne Musik","Nur mit Waffen"],1,"Kreativformen laufen ohne Musik, Musikformen mit."],["Welcher Stil ist flie\xDFend und wushu\xE4hnlich?",["Hard Style","Soft Style","Creative"],1,"Soft Style ist flie\xDFend, Hard Style kraftvoll und karate\xE4hnlich."],["Was z\xE4hlt in Waffenkategorien zuerst?",["Die Musik","Die Waffenhandhabung","Die Kleidung"],1,"Die Waffenhandhabung ist dort das erste Kriterium."]]},en:{t:"Forms rules",cards:[["What are forms?","A performance without an opponent: a self-designed sequence of techniques, kicks and movements, like a fight against imaginary opponents."],["Musical forms","Performed to music, divided into hard style (powerful, karate-like), soft style (flowing, wushu-like) and creative forms with acrobatics. Each also exists with weapons."],["Creative forms","WAKO Germany also has creative forms with and without weapons, performed without music and without a time limit. A competitor may enter at most four musical and creative forms categories per tournament."],["Judging","Scores from 7.0 to 10.0. Criteria are basics (stances, hand and foot techniques, blocks), balance and focus, difficulty (jumps, spins, combinations) and presentation. In weapon categories weapon handling comes first."]],quiz:[["What is the scoring range for forms?",["0\u201310","5.0\u201310.0","7.0\u201310.0"],2,"Forms are scored from 7.0 to 10.0."],["Are creative forms performed to music?",["Yes, always","No, without music","Only with weapons"],1,"Creative forms are performed without music, musical forms with."],["Which style is flowing and wushu-like?",["Hard style","Soft style","Creative"],1,"Soft style is flowing, hard style powerful and karate-like."],["What comes first in weapon categories?",["The music","Weapon handling","The outfit"],1,"Weapon handling is the first criterion there."]]}},geschichte:{de:{t:"Geschichte des Kickboxens",cards:[["Wurzeln","In Japan entstand in den 1960er-Jahren das Kickboxen aus Karate und Muay Thai. In den USA wurde Anfang der 1970er Full Contact Karate popul\xE4r: Karateka k\xE4mpften mit Boxhandschuhen und vollem Kontakt. 1974 fand in Los Angeles eine erste Weltmeisterschaft im Full Contact statt."],["Gr\xFCndung der WAKO","Die WAKO (World Association of Kickboxing Organizations) wurde am 26. Februar 1977 in Berlin gegr\xFCndet. Gr\xFCnder war Georg F. Br\xFCckner, die Idee eines weltweiten Verbands teilte er mit Mike Anderson. 1978 folgte die erste Weltmeisterschaft mit 110 K\xE4mpfern aus 18 L\xE4ndern."],["Olympische Anerkennung","2018 erkannte das IOC die WAKO vorl\xE4ufig an, im Juli 2021 vollst\xE4ndig. Heute vertritt die WAKO rund 130 Nationen. Kickboxen geh\xF6rt zu den World Games und den European Games."],["Disziplinen","Tatami-Disziplinen: Point Fighting, Light Contact, Kick Light und Formen. Ring-Disziplinen: Full Contact, Low Kick und K1. In Deutschland ist die WAKO Deutschland (Bundesfachverband f\xFCr Kickboxen) der Dachverband."]],quiz:[["Wann wurde die WAKO gegr\xFCndet?",["1974","1977","1985"],1,"Am 26. Februar 1977."],["In welcher Stadt wurde die WAKO gegr\xFCndet?",["Los Angeles","Tokio","Berlin"],2,"Gr\xFCndungsort war Berlin."],["Wer gilt als Gr\xFCnder der WAKO?",["Georg F. Br\xFCckner","Bruce Lee","Benny Urquidez"],0,"Georg F. Br\xFCckner, gemeinsam mit der Idee von Mike Anderson."],["Seit wann ist die WAKO vom IOC vollst\xE4ndig anerkannt?",["2012","2018","2021"],2,"Vorl\xE4ufig 2018, vollst\xE4ndig im Juli 2021."],["Welche Disziplin ist eine Ring-Disziplin?",["Point Fighting","Light Contact","K1"],2,"K1, Low Kick und Full Contact werden im Ring gek\xE4mpft."]]},en:{t:"History of kickboxing",cards:[["Roots","In Japan, kickboxing grew out of karate and Muay Thai in the 1960s. In the USA full contact karate became popular in the early 1970s: karateka fought with boxing gloves and full contact. A first full contact world championship was held in Los Angeles in 1974."],["WAKO is founded","WAKO (World Association of Kickboxing Organizations) was founded on 26 February 1977 in Berlin. Its founder was Georg F. Br\xFCckner, who shared the vision of a world body with Mike Anderson. The first world championships followed in 1978 with 110 fighters from 18 countries."],["Olympic recognition","The IOC recognised WAKO provisionally in 2018 and fully in July 2021. Today WAKO represents about 130 nations. Kickboxing is part of the World Games and the European Games."],["Disciplines","Tatami: point fighting, light contact, kick light and forms. Ring: full contact, low kick and K1. In Germany the umbrella body is WAKO Deutschland (Bundesfachverband f\xFCr Kickboxen)."]],quiz:[["When was WAKO founded?",["1974","1977","1985"],1,"On 26 February 1977."],["In which city was WAKO founded?",["Los Angeles","Tokyo","Berlin"],2,"It was founded in Berlin."],["Who is considered WAKO's founder?",["Georg F. Br\xFCckner","Bruce Lee","Benny Urquidez"],0,"Georg F. Br\xFCckner, together with Mike Anderson's vision."],["Since when has WAKO had full IOC recognition?",["2012","2018","2021"],2,"Provisional in 2018, full in July 2021."],["Which discipline is fought in the ring?",["Point fighting","Light contact","K1"],2,"K1, low kick and full contact are ring disciplines."]]}},lehre:{de:{t:"Lehrbeispiel Technikvermittlung",cards:[["Aufbau","Ein bew\xE4hrter Ablauf: Ziel nennen, vormachen, kurz erkl\xE4ren, \xFCben lassen, korrigieren, anwenden. Plane 5\u201310 Minuten f\xFCr eine Technik."],["Vormachen und erkl\xE4ren","Erst die ganze Technik in normalem Tempo zeigen, dann langsam und von zwei Seiten. Nur 1\u20132 Kernpunkte nennen, zum Beispiel \u201EH\xFCfte dreht mit\u201C oder \u201EHand sofort zur\xFCck zur Deckung\u201C."],["\xDCben lassen","Vom Leichten zum Schweren: erst in der Luft, dann an der Pratze, dann mit Partner. Bei komplexen Techniken in Teilen \xFCben und dann zusammensetzen."],["Korrigieren","Immer nur einen Fehler auf einmal, den wichtigsten zuerst. Positiv formulieren (\u201EEllbogen h\xF6her\u201C statt \u201Enicht so tief\u201C) und zwischendurch loben."],["Anwenden","Die Technik in eine Kombination oder eine kleine Partneraufgabe einbauen, damit sie im Sparring ankommt. Zum Schluss kurz zusammenfassen."]],quiz:[["Wie viele Kernpunkte nennst du beim Erkl\xE4ren?",["1\u20132","5\u20136","Alle, die es gibt"],0,"Wenige Kernpunkte bleiben h\xE4ngen, zu viele verwirren."],["Wie korrigierst du am besten?",["Alle Fehler auf einmal","Einen Fehler nach dem anderen","Gar nicht, \xDCbung macht den Meister"],1,"Den wichtigsten Fehler zuerst, dann den n\xE4chsten."],["Was kommt nach dem Vormachen?",["Sofort Sparring","Kurz erkl\xE4ren und \xFCben lassen","Die Theorie abfragen"],1,"Vormachen, kurz erkl\xE4ren, dann \xFCben lassen."]]},en:{t:"Teaching a technique",cards:[["Structure","A proven sequence: state the goal, demonstrate, explain briefly, let them practise, correct, apply. Plan 5\u201310 minutes per technique."],["Demonstrate and explain","Show the whole technique at normal speed first, then slowly and from two sides. Give only 1\u20132 key points, for example \u201Cthe hip turns with it\u201D or \u201Chand straight back to guard\u201D."],["Practise","From easy to hard: in the air first, then on pads, then with a partner. Break complex techniques into parts, then put them together."],["Correct","One mistake at a time, the most important first. Phrase it positively (\u201Celbow higher\u201D rather than \u201Cnot so low\u201D) and praise in between."],["Apply","Build the technique into a combination or a small partner task so it reaches sparring. Sum up briefly at the end."]],q
