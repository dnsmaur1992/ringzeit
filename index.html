h\xE4rtung), WT auf Beweglichkeit, Spritzigkeit und Kickketten, ITF auf Hand-Fu\xDF-Kombinationen und spektakul\xE4re Tritte. Auch Kraft, Kondition und Mobility richten sich nach deinem Hauptsport.","<b>Taekwondo-Grade:</b> Grad je Style, Pr\xFCfungsteile und Wartezeiten nach Pr\xFCfungsordnung, 4 Wochen Pr\xFCfungsvorbereitung im Plan. Dreh- und Sprungtritte schaltet dein Level oder dein G\xFCrtel frei. Technik-Namen auf Koreanisch oder Deutsch.","<b>Profil neu sortiert:</b> \u201E\xDCber mich\u201C fragt nach Wahl der Sportart nur das, was zu ihr geh\xF6rt. Turniere und Pr\xFCfungen stehen gemeinsam unter \u201ETermine & Ziele\u201C, Verein und Trainingstage unter \u201ETrainingswoche\u201C.","<b>F\xFCr jede Sportart:</b> eigener Ratgeber, Packliste, Tipps, Rundentimer-Vorlagen und Hinweise zur Schutzausr\xFCstung bei Sparring und Partner\xFCbungen.","<b>Kickboxen:</b> ab Fortgeschritten auch Kickketten (bei \u201EMehr Boxen\u201C seltener), Sparring auch in der einfachen Ansicht."],ok:"Verstanden"},ack:{h:"Kurz zur Sicherheit",pts:["Du trainierst auf eigene Verantwortung. Ringzeit ersetzt keinen Trainer und keine \xE4rztliche Beratung.","Bei Vorerkrankungen, Verletzungen oder Beschwerden vorher \xE4rztlich abkl\xE4ren. Bei Schmerzen, Schwindel oder Atemnot sofort aufh\xF6ren.","Sparring und Partner\xFCbungen nur unter Aufsicht.","Unter 18 nur mit Einverst\xE4ndnis deiner Eltern."],priv:"Ringzeit ist ein privates Projekt \u2013 kein Angebot deines Vereins, der WAKO oder eines Verbands.",ok:"Verstanden \u2013 los geht's"},legal:{row:"Hinweise & Datenschutz",sub:"Sicherheit, Haftung, deine Daten",h1:"Sicherheit & Haftung",p1:["Ringzeit ist ein privates, kostenloses Projekt. Es ist kein Angebot eines Vereins, der WAKO, der WAKO Deutschland oder eines Verbands.","Die Trainingsvorschl\xE4ge sind allgemeine Empfehlungen und ersetzen weder Trainer noch \xE4rztliche Beratung. Die Nutzung erfolgt auf eigene Verantwortung.","Bei Vorerkrankungen, Verletzungen, Schwangerschaft oder Beschwerden das Training vorher \xE4rztlich abkl\xE4ren. Bei Schmerzen, Schwindel oder Atemnot sofort aufh\xF6ren.","Sparring und Partner\xFCbungen nur unter Aufsicht. Kinder und Jugendliche unter 18 nutzen Ringzeit nur mit Einverst\xE4ndnis der Eltern.","Verbindlich sind immer die aktuellen Regelwerke deines Verbands (WAKO Deutschland, DBV, DTU, ITF-D) und die Anweisungen deiner Trainer."],h2:"Datenschutz",p2:["Ringzeit hat kein Konto, keine Werbung und kein Tracking. Alles, was du eintr\xE4gst, bleibt nur auf deinem Ger\xE4t.","Ringzeit wird \xFCber GitHub Pages bereitgestellt. Beim Laden und bei Updates verarbeitet GitHub technisch \xFCbliche Zugriffsdaten wie die IP-Adresse.","Sicherungen speicherst du selbst. Mit \u201ENeu starten\u201C l\xF6schst du alle Daten auf diesem Ger\xE4t.","Feedback ist freiwillig und l\xE4uft \xFCber ein Formular bei Tally (Anbieter in der EU). \xDCbertragen wird nur, was du dort selbst eintr\xE4gst, dazu die App-Version und die Ger\xE4teart (z. B. \u201EiPhone, installiert\u201C) \u2013 keine Trainingsdaten."]},fb:{lbl:"Feedback",hint:"Was gef\xE4llt dir, was st\xF6rt? Das Formular \xF6ffnet sich im Browser und braucht Internet. Trainingsdaten werden nicht mitgeschickt.",btn:"Feedback senden",offline:"F\xFCr das Feedback brauchst du Internet."},resetLbl:"Neu starten",resetHint:"L\xF6scht alle Daten auf diesem Ger\xE4t \u2013 Plan, Eintr\xE4ge, Tests, Kombis \u2013 und startet die Einrichtung von vorn. Vorher am besten eine Sicherung speichern.",resetBtn:"Alle Daten l\xF6schen",resetAsk:"Wirklich alles l\xF6schen? Das l\xE4sst sich nicht r\xFCckg\xE4ngig machen \u2013 au\xDFer mit einer gespeicherten Sicherung.",pme:{sportSec:"Sport & G\xFCrtel",forLbl:"Angaben f\xFCr:",mainBadge:"Hauptsport",mainIs:e=>`${e} ist dein Hauptsport \u2013 danach plant Ringzeit.`,otherMain:(e,n)=>`Dein Hauptsport ist ${e}. Die Angaben zu ${n} kannst du trotzdem eintragen.`,setMain:e=>`${e} als Hauptsport festlegen`,beltKb:"G\xFCrtel",beltKbNote:"Pr {e===1?"Tag":"Tage"} Ringzeit`,club:e=>`${e}\xD7 Verein`,noGoal:"Noch kein Ziel eingetragen",nextComp:e=>`Turnier am ${e}`,nextGrade:e=>`Pr\xFCfung am ${e}`,paused:"Pause l\xE4uft"},life:{title:"Alltag",hint:"Job, Schule, Studium und Familie kosten auch Kraft. Alles hier ist freiwillig.",weekQ:"Wie wird deine Woche?",weekS:"Ringzeit passt die Einheiten an \u2013 ein Tipp gen\xFCgt.",moods:{easy:"Entspannt",normal:"Normal",hard:"Stressig"},weekLbl:"Diese Woche",moodToast:{easy:"Woche angepasst \u2013 etwas mehr drin",normal:"Alles klar \u2013 normaler Plan",hard:"Woche angepasst \u2013 leichter und mehr Technik"},lowLbl:"Wenig-Zeit-Modus",lowHint:"F\xFCr Pr\xFCfungszeit, Umzug, Baby & Co.: Einheiten h\xF6chstens 30 Minuten, nur das Wesentliche. Deine Serie l\xE4uft weiter.",lowOn:"Wenig-Zeit-Modus an \u2013 h\xF6chstens 30 Minuten",lowOff:"Wenig-Zeit-Modus aus",workLbl:"Art der Arbeit",workHint:"Sitzend: mehr Mobility f\xFCr H\xFCfte und R\xFCcken. K\xF6rperlich schwer: etwas weniger Kraftvolumen.",works:{"":"Keine Angabe",sit:"Sitzend",phys:"K\xF6rperlich"},formQ:"Tagesform",formS:"Optional \u2013 passt die heutige Einheit an.",sleep:"Schlaf",energy:"Energie",lv:["Schlecht","Okay","Gut"],formDone:"Einheit an deine Tagesform angepasst",notes:{hard:"Stressige Woche: weniger Runden, kein Sparring, keine harte Kondition \u2013 Training soll heute Energie geben, nicht nehmen.",easy:"Entspannte Woche: eine Runde mehr ist drin.",formLow:"Tagesform niedrig: heute leichter. Technik sauber, kein Vollgas \u2013 lieber gut erholt in die n\xE4chste Einheit.",formMid:"Tagesform mittel: etwas weniger Umfang, Tempo nach Gef\xFChl.",low:"Wenig-Zeit-Modus: nur das Wesentliche.",sit:"Viel Sitzen: zum Schluss H\xFCfte und Brustwirbels\xE4ule mobilisieren.",phys:"K\xF6rperlich schwere Arbeit: etwas weniger Kraftvolumen."}},planUpd:"Plan aktualisiert",autoSave:"\xC4nderungen werden sofort in deinen Plan \xFCbernommen.",needDay:"W\xE4hle mindestens einen Trainingstag.",guide:{title:"Ratgeber",hint:"Bandagieren, Pflege, Erste Hilfe \u2013 und Lesestoff rund ums Kickboxen.",hintBox:"Bandagieren, Pflege, Erste Hilfe \u2013 und Lesestoff rund ums Boxen.",hintTkd:"Pflege, Erste Hilfe \u2013 und Lesestoff rund ums Taekwondo.",practical:"Praktisch",reads:"Zum Lesen",nextRead:"N\xE4chstes Thema",wrap:"Bandagieren",care:"Materialpflege",aid:"Pflege & Erste Hilfe",wrapLink:"Bandagieren",video:"Video ansehen (\xF6ffnet YouTube)",step:(e,n)=>`Schritt ${e} von ${n}`,prev:"Zur\xFCck",next:"Weiter",again:"Von vorn",wrapIntro:"Bandagen sch\xFCtzen Mittelhandknochen und Handgelenk. F\xFCr Erwachsene sind 4\u20134,5 m \xFCblich. Hand beim Wickeln gespreizt halten \u2013 so dr\xFCckt nichts, wenn du die Faust machst.",wrapSteps:["Daumen durch die Schlaufe stecken und die Bandage \xFCber den Handr\xFCcken nach unten f\xFChren.","Das Handgelenk 3\xD7 umwickeln \u2013 fest, aber ohne abzuschn\xFCren.","Schr\xE4g \xFCber den Handr\xFCcken zu den Kn\xF6cheln und die Kn\xF6chel 3\xD7 umwickeln.","Zwischen den Fingern durch: kleiner/Ringfinger, Ring-/Mittelfinger, Mittel-/Zeigefinger \u2013 jedes Mal \xFCber das Handgelenk zur\xFCck.","Den Daumen einmal umwickeln \u2013 das gibt ihm Halt.","Mit Kreuzen (X) \xFCber den Handr\xFCcken festigen, den Rest ums Handgelenk wickeln und mit dem Klett schlie\xDFen. Faust machen: Nichts darf dr\xFCcken oder kribbeln."],careSecs:[["Handschuhe","Nach jedem Training aus der Tasche nehmen und \xF6ffnen. Innen mit einem desinfizierenden Textilerfrischer einspr\xFChen und offen an der Luft trocknen lassen \u2013 nicht auf die Heizung, nicht in die pralle Sonne. Au\xDFen mit einem feuchten Tuch abwischen. Das Spray ersetzt das Ausl\xFCften nicht, es erg\xE4nzt es: Feuchtigkeit ist der Hauptgrund f\xFCr Geruch und Keime. Bei Leder alkoholhaltige Sprays erst an einer unauff\xE4lligen Stelle testen."],["Bandagen","Nach jedem Training waschen: im W\xE4schenetz bei 30\u201340 \xB0C, den Klett vorher schlie\xDFen. An der Luft trocknen und aufgerollt aufbewahren \u2013 Daumenschlaufe innen, Klett au\xDFen. Dann sind sie beim n\xE4chsten Mal sofort bereit."],["Schienbein- und Fu\xDFschutz","Wie Handschuhe: innen einspr\xFChen, ausl\xFCften, au\xDFen abwischen. Stoffschoner d\xFCrfen oft in die W\xE4sche \u2013 Etikett beachten."],["Mundschutz","Nach dem Training mit kaltem Wasser absp\xFClen \u2013 hei\xDFes Wasser verformt ihn. In einer bel\xFCfteten Box trocknen lassen und ab und zu mit der Zahnb\xFCrste reinigen. Ersetzen, wenn er rissig ist oder nicht mehr gut sitzt."],["Kopf- und Tiefschutz","Innen einspr\xFChen und ausl\xFCften. Den Tiefschutz waschen, wenn das Etikett es erlaubt."],["Sporttasche","Kein Trockenraum: Ausr\xFCstung nach dem Training immer auspacken. Ein W\xE4schenetz f\xFCr die Bandagen und ein Beutel f\xFCr nasse Sachen halten Ordnung."]],aidSecs:[["Prellung, Zerrung: PECH-Regel","Pause \u2013 sofort aufh\xF6ren. Eis \u2013 10\u201320 Minuten k\xFChlen, immer mit einem Tuch dazwischen. Compression \u2013 leichter Druckverband. Hochlagern \u2013 \xFCber Herzh\xF6he. Das bremst Schwellung und Bluterguss."],["Thai-Boxing-\xD6l (z. B. Namman Muay)","Zum Einreiben, um die Muskeln vor dem Training zu w\xE4rmen, und zur Massage bei Verspannungen oder \xE4lteren blauen Flecken. Nicht bei frischen Verletzungen: In den ersten 1\u20132 Tagen erst k\xFChlen \u2013 W\xE4rme kann eine frische Schwellung verst\xE4rken. Nicht auf offene Haut, nicht in die Augen, danach H\xE4nde waschen, nicht mit W\xE4rmflasche oder Sauna kombinieren. Die \xD6le enthalten meist Methylsalicylat (aspirin\xE4hnlich): Wer darauf allergisch ist oder Blutverd\xFCnner nimmt, fragt vorher in der Apotheke."],["Nasenbluten","Kopf leicht nach vorn beugen, nicht in den Nacken legen. Die Nasenfl\xFCgel 10 Minuten zusammendr\xFCcken, den Nacken k\xFChlen. H\xF6rt es nach 20 Minuten nicht auf: zum Arzt."],["Sofort aufh\xF6ren und zum Arzt","Nach einem Kopftreffer mit Kopfschmerzen, \xDCbelkeit, Schwindel, Sehst\xF6rungen oder Verwirrtheit \u2013 das kann eine Gehirnersch\xFCtterung sein; die WAKO-Sperre nach K.o. gilt. Bei Verdacht auf einen Bruch (starker Schmerz, Fehlstellung, Knacken), bei Schwellungen, die nicht zur\xFCckgehen, und bei Schmerzen, die nach 2\u20133 Tagen nicht besser werden."]],aidNote:"Diese Tipps ersetzen keinen Arzt. Im Notfall: 112.",winCare:"Handschuhe und Schoner innen mit desinfizierendem Textilerfrischer einspr\xFChen und offen trocknen lassen."},pack:{title:"Packliste",card:e=>`Turnier am ${e}`,cardS:(e,n)=>`Packliste: ${e} von ${n} gepackt`,all:"Alles gepackt \u2013 viel Erfolg!",open:"Packliste \xF6ffnen",add:"Eigener Punkt",addBtn:"Hinzuf\xFCgen",reset:"Alle Haken entfernen",hint:"Und packt schon mal eure Sachen!",items:["Kopfschutz","Mundschutz","T-Shirt / Kick Light \xE4rmellos","Handschuhe","Bandagen","Hose / Shorts","Tiefschutz","Schienbeinschutz","Fu\xDFschutz","Fu\xDFn\xE4gel schneiden","Coach-Lizenz","Wasser","Snacks / Essen","Duschsachen"],itemsBox:["Kopfschutz","Mundschutz","Boxhandschuhe","Bandagen","Trikot / T-Shirt (Farbe laut Ausschreibung)","Boxhose / Shorts","Tiefschutz","Boxschuhe","Sportpass / Ausweis","Wasser","Snacks / Essen","Duschsachen"],boxNote:"Abgeleitet aus den DBV-Wettkampfbestimmungen \u2013 Ausr\xFCstung laut Ausschreibung pr\xFCfen; eigene Punkte kannst du erg\xE4nzen.",itemsWt:["Dobok","G\xFCrtel","Rumpfschutz (Weste)","Kopfschutz","Tiefschutz","Unterarmsch\xFCtzer","Schienbeinsch\xFCtzer","Handsch\xFCtzer","Zahnschutz (wei\xDF oder transparent)","Sensorsocken (bei elektronischer Wertung)","Sportpass / Ausweis","Wasser","Snacks / Essen","Duschsachen"],itemsItf:["Dobok","G\xFCrtel","Geschlossene Handschuhe","Fu\xDFschutz","Kopfschutz (ohne Gesichtsmaske)","Zahnschutz","Schienbeinschutz","Tiefschutz (m) / Brustschutz (w)","Armbinden rot und blau","Sportpass / Ausweis","Wasser","Snacks / Essen","Duschsachen"],wtNote:"Abgeleitet aus den WT-Wettkampfregeln und der DTU-Wettkampfordnung \u2013 Ausr\xFCstung laut Ausschreibung pr\xFCfen (Jugend 4uft weiter",stopAsk:"Block wirklich beenden? Der Plan l\xE4uft dann wieder normal.",tag:"Block",hist:"Abgeschlossen",onbT:"Wo stehst du gerade?",onbS:"Freiwillig: Mit einem kurzen Fitnesstest schl\xE4gt dir Ringzeit einen ersten 6-Wochen-Schwerpunkt vor \u2013 Ausdauer, Schnellkraft oder Beweglichkeit. Einzelne Teile kannst du auslassen und sp\xE4ter nachtragen. Damit schaltest du auch Full Contact und K1 Style frei.",onbTest:"Fitnesstest \xF6ffnen",onbLater:"Sp\xE4ter \u2013 direkt loslegen",onbPts:["Liegest\xFCtze am St\xFCck","Jab-Cross in 20 s","2,4 km Lauf","Sidekick-H\xF6he","Technik-Einsch\xE4tzung"],wtxt:{end:[(e,n)=>`Diese Woche: Runden \xE0 ${e} in gleichm\xE4\xDFigem Tempo (\u2248 70 %), ${n} Pause \u2013 du baust den Motor. Optional: 20\u201330 Min. locker laufen an einem freien Tag.`,(e,n,s,i)=>`Diese Woche: ${s} \xD7 ${e} im Kampftempo, ${n} Pause.${i?` N\xE4chste Woche ${i} Runden.`:" Danach: Explosionen."}`,(e,n,s,i,a)=>a?`Diese Woche: \xDCberlast \u2013 ${s} \xD7 ${e} mit nur ${n} Pause. Danach: Fitnesstest zum Vergleich.`:`Diese Woche: ${e}-Runden mit 15 s Vollgas / 15 s Technik im Wechsel.`],pow:["Diese Woche: schwere Grund\xFCbungen mit langen Pausen. Sauber vor schwer.","Diese Woche: Spr\xFCnge und explosive \xDCbungen vor der Kraft \u2013 jede Wiederholung maximal schnell, volle Pause.","Diese Woche: Kontrast \u2013 schwerer Satz, direkt danach explosiv. Dazu Speed-Runden mit 10 s Maximaltempo."],mob:["Diese Woche: H\xFCfte und Adduktoren \u2013 l\xE4ngeres Dehnen nach jeder Einheit, ruhig atmen, nie federn.","Diese Woche: dynamische Kick-Mobilit\xE4t \u2013 kontrollierte Beinpendel und Zeitlupen-Kicks.","Diese Woche: aktive Beweglichkeit \u2013 Kicks oben halten. Z\xE4hlt nur die H\xF6he, die du kontrollierst."]},where:{end:"in Technik & Kondition und Kondition",pow:"in den Kraft-Einheiten",mob:"im Mobility-Flow und Cool-down"},note:{end:["Schwerpunkt Kampfausdauer \xB7 Motor aufbauen: lange Runden, gleichm\xE4\xDFig \u2013 nicht \xFCberpacen eifer \xB7 Pfeil: Hauptbewegung der Befreiung",sdSafe:"Im Training langsam und kontrolliert \xFCben. Abklopfen hei\xDFt sofort loslassen. W\xFCrgen, Hebel und Nackendruck nie mit Kraft, Konter nur andeuten. Stock und Messer nur als Trainingsger\xE4te.",sdNote:"Vorschlag nach g\xE4ngiger Lehrpraxis. Dein Verein kann eine andere L\xF6sung lehren, in der Pr\xFCfung z\xE4hlt, was dein Pr\xFCfer sehen will. Im Ernstfall gilt immer: wegkommen vor k\xE4mpfen.",exam:"Pr\xFCfungsprogramm",tview:{fit:"Fitnesstest",exam:"G\xFCrtelpr\xFCfung"},beltNow:"Dein aktueller Gurt",examTarget:"N\xE4chste Pr\xFCfung",exStage:e=>e===6?"1. Meistergrad":`Stufe ${e}`,examPrep:e=>`Vorbereitung ca. ${e===12?"1 Jahr":e+" Monate"}`,examProg:(e,n)=>`${e} von ${n} Punkten sitzen sicher`,examDate:e=>`Pr\xFCfungstermin: ${e}. In den 4 Wochen davor baut Ringzeit das Programm in deine Einheiten ein.`,examNoDate:"Noch kein Termin. Trag die G\xFCrtelpr\xFCfung im Profil unter Termine & Ziele ein, dann \xFCbst du das Programm in den 4 Wochen davor gezielt.",examHow:"Tippe einen Punkt an, um ihn als \u201Eunsicher\u201C oder \u201Esicher\u201C zu markieren. Offene und unsichere Punkte kommen im Training h\xE4ufiger dran. Bewertet wird jeder Block mit Noten 1\u20136: Ein Schnitt von 3,5 oder besser besteht, eine 6 in einem Block l\xE4sst die Pr\xFCfung durchfallen.",examEarlier:"Wiederholung fr\xFCherer Stufen",examDan:"Ab dem 2. Meistergrad gibt es kein festes Technikprogramm mehr, sondern Lehrg\xE4nge, Lizenzen und eine schriftliche Arbeit. Das deckt Ringzeit nicht ab.",examSrc:"Quelle: Pr\xFCfungsordnung des BFVKB (WAKO Deutschland), Stand 20.01.2019, Programm f\xFCr Erwachsene. Vereine und Pr\xFCfer k\xF6nnen Details festlegen, im Zweifel gilt, was dein Pr\xFCfer verlangt.",examNote:(e,n,s)=>`G\xFCrtelpr\xFCfung zum ${e}: ${n} von ${s} Punkten sitzen. Markiere nach dem \xDCben, was schon sicher ist.`,beltUp:e=>`Gl\xFCckwunsch zum ${e}!`,exNeedP:"mit Partner",exNeedM:"auf Matten",gpLbl:["offen","unsicher","sicher"],exBlk:{mv:"Kampfstellung & Schatten",hd:"Handtechniken",hc:"Handkombinationen",ft:"Fu\xDFtechniken",hf:"Hand-Fu\xDF-Kombinationen",db:"Doppeltritte",df:"Abwehrkombinationen",ms:"Modellsparring",fa:"Fallschule",sd:"Selbstverteidigung",th:"Theorie"},exDrill:{pad:"an der Pratze",bag:"am Sandsack",air:"in der Luft",tech:e=>`Je Seite 2\xD7 10 ${e}, erst sauber und langsam, dann z\xFCgig.`,combo:e=>`3\xD7 6 ${e}, fl\xFCssig und mit Deckung zur\xFCck.`,mv:"2\xD7 2 min, in alle Richtungen, Deckung oben.",db:"Am Partner, je Bein 2\xD7 6, ohne das Bein abzusetzen.",df:"Partner greift kontrolliert an, 8\xD7 abwehren und kontern, dann Rollentausch.",ms:"2 Runden \xE0 2 min mit fester Rollenverteilung, dann tauschen.",fa:"6\u20138 Wiederholungen auf der Matte, ruhig und kontrolliert.",sd:"Partner greift langsam an, je Seite 5\xD7, dann etwas z\xFCgiger. Abklopfen hei\xDFt sofort loslassen."},tourSkip:"Tour beenden",tourLbl:"App-Tour",tourHint:"Zeigt dir in einer Minute alle wichtigen Stellen der App.",tourStart:"Tour starten",tourIntroBox:"Ringzeit erg\xE4nzt dein Vereinstraining: Es plant eigene Boxeinheiten nach den DBV-Wettkampfbestimmungen, protokolliert alles und passt die Belastung an. Diese kurze Tour zeigt dir, wo du was findest.",tourBasicsBox:"Ringzeit erkl\xE4rt keine Grundtechniken. Kampfstellung, Deckung, Jab, Cross, Haken und Beinarbeit solltest du aus dem Vereinstraining sicher beherrschen. Bist du unsicher, frag zuerst deinen Trainer.",tourBasicsT:"Voraussetzung: die Grundlagen",tourTestBox:["Fitnesstest","Der Fitnesstest pr\xFCft Kraft, Schnelligkeit, Ausdauer, Beweglichkeit und Technik und ist Voraussetzung f\xFCr den Aufstieg ins n\xE4chste Trainingslevel."],tourIntroTkd:"Ringzeit erg\xE4nzt dein Vereinstraining: Es plant eigene Taekwondo-Einheiten nach dem gew\xE4hlten Stil (WT oder ITF), protokolliert alles und passt die Belastung an. Diese kurze Tour zeigt dir, wo du was findest.",tourBasicsTkd:"Ringzeit erkl\xE4rt keine Grundtechniken und ersetzt keinen Unterricht. Stellungen, Bl\xF6cke, Grundtritte und deine Formen solltest du aus dem Vereinstraining sicher beherrschen. Bist du unsicher, frag zuerst deinen Trainer.",tourProfTkd:"Das Profil ist in sechs Bereiche gegliedert. Unter \u201E\xDCber mich\u201C stehen Sport, G\xFCrtel und deine Angaben, unter \u201EAlltag & Pausen\u201C passt du Ringzeit an stressige Wochen, wenig Zeit oder einen k\xF6rperlichen Job an. Unter \u201ERatgeber\u201C findest du G\xFCrtel & Dobok, Grade und Pr\xFCfung, Begriffe, Materialpflege und Erste Hilfe.",tourBasics:"Ringzeit erkl\xE4rt keine Grundtechniken. Kampfstellung, Deckung, Grundschl\xE4ge und -tritte solltest du aus dem Vereinstraining sicher beherrschen. Bist du unsicher, frag zuerst deinen Trainer.",tour:{intro:["Willkommen bei Ringzeit","Ringzeit erg\xE4nzt dein Vereinstraining: Es plant eigene Einheiten nach WAKO-Regeln, protokolliert alles und passt die Belastung an. Diese kurze Tour zeigt dir, wo du was findest."],today:["Heute","Hier steht, was heute ansteht: eigene Einheit, Vereinstraining oder Ruhetag. Darunter siehst du deine Woche \u2013 f\xE4llt etwas aus, kannst du es verschieben oder streichen."],strip:["Deine Woche","Jede Farbe steht f\xFCr eine Art von Einheit. Tippe auf einen Tag, um ihn anzusehen."],plan:["Wochenplan","Alle Einheiten der Woche, auch die Vereinstrainings. F\xE4llt etwas aus, kannst du es verschieben, streichen oder nachholen."],setup:["Einheit einstellen","Dein Tagesplan ist bereits vorbereitet. Unter \u201EEinheit anpassen\u201C kannst du bei Bedarf Art, Dauer, Ort und Ausr\xFCstung \xE4ndern und den Plan neu erstellen. Die Vorschau ist noch kein laufendes Training."],timer:["Training beginnen","Unter \u201EEinheit\u201C siehst du deinen Tagesplan. \u201ETraining beginnen\u201C f\xFChrt dich \xDCbung f\xFCr \xDCbung im Vollbild durch: Zeit\xFCbungen mit Gong und Ansage, sonst \u2713 tippen, bei Kraft Wiederholungen eintragen. Am Ende speicherst du, wie anstrengend es war."],exinfo:["\xDCbungen","Das \u24D8 neben einer \xDCbung zeigt Skizze, Ausf\xFChrungshinweise und den typischen Fehler. Erst nach \u201ETraining beginnen\u201C hakst du \xDCbungen ab und tr\xE4gst Wiederholungen und Gewicht ein."],finish:["Abschlie\xDFen","Die F\xFChrung endet nach dem Cool-down mit tats\xE4chlicher Dauer und Anstrengung (RPE). Vorzeitig abschlie\xDFen bleibt m\xF6glich; offene \xDCbungen werden dabei nicht abgehakt. Zur\xFCck zur Plan\xFCbersicht pausiert laufende Trainings-Timer."],ftimer:["Rundentimer","Der rote Knopf in der Mitte startet einen freien Rundentimer mit Ringglocke \u2013 f\xFCrs Vereinstraining, Sparring oder zwischendurch, ganz ohne Plan. Mit \u201ECoach-Ansagen\u201C ruft er dir Kombis zu."],test:["Tests & G\xFCrtelpr\xFCfung","Der Fitnesstest pr\xFCft Kraft, Schnelligkeit, Ausdauer, Beweglichkeit und Technik und ist Voraussetzung f\xFCr den Aufstieg. Unter \u201EG\xFCrtelpr\xFCfung\u201C findest du das komplette Pr\xFCfungsprogramm f\xFCr deinen n\xE4chsten Gurt zum Abhaken."],log:["Verlauf","Trainingskalender, Bestleistungen, Gewicht und Turnierergebnisse auf einen Blick."],club:["Vereinstage","Trag deine festen Vereinstrainings ein. Ringzeit plant deine eigenen Einheiten drumherum, damit es nicht zu viel wird."],comp:["Turniere & Pr\xFCfungen","Mit einem Turnier oder einer G\xFCrtelpr\xFCfung als Ziel baut Ringzeit den Plan in Phasen auf, bis hin zur Entlastung kurz davor. Alles, was du im Profil \xE4nderst, gilt sofort \u2013 speichern musst du nichts."],pause:["Pausen","Krank, verletzt, im Urlaub oder nach einem KO: Pause eintragen. Danach steigt die Belastung behutsam wieder an."],life:["Alltag & Ratgeber","Das Profil ist in sechs Bereiche gegliedert. Unter \u201E\xDCber mich\u201C stehen Sport, G\xFCrtel und deine Angaben, unter \u201EAlltag & Pausen\u201C passt du Ringzeit an stressige Wochen, wenig Zeit oder einen k\xF6rperlichen Job an. Unter \u201ERatgeber\u201C findest du Bandagieren, Materialpflege und Erste Hilfe."],prof:["Profil","Hier stellst du alles ein: Vereins- und Ringzeit-Tage, Turniere und Pr\xFCfungen, Pausen und Alltag \u2013 dazu Ratgeber, Sicherung und diese Tour. \xC4nderungen gelten sofort. Fitnesstest und Verlauf findest du unten in der Leiste."],end:["Bereit","Das war's. Die Tour findest du jederzeit im Profil unter \u201EApp-Tour\u201C. Viel Spa\xDF beim Training!"]},afterLbl:"Danach",skHold:"Halten",skErr:"Typischer Fehler:",move:"Verschieben",moveTo:"Verschieben auf \u2026",movedTo:e=>`Verschoben auf ${e}`,movedFrom:e=>`verschoben von ${e}`,taken:"belegt",clubBadge:"Verein",addTraining:"Training hinzuf\xFCgen",removeExtra:"Einheit entfernen",missed:(e,n)=>`${e}: ${n} verpasst`,catchUp:"Nachholen",skipIt:"Auslassen",skipped:"Ausgelassen",undo:"R\xFCckg\xE4ngig",later:"Sp\xE4ter",dur:"Dauer heute (min)",pauseSec:"Pause & Ausfall",pauseWhy:{ill:"Krank",inj:"Verletzt",vac:"Urlaub"},pauseStart:"Pause eintragen",pauseFrom:"Von",pauseTo:"Bis (leer lassen, wenn noch offen)",pauseHint:"W\xE4hrend einer Pause ruht der Plan und die Wochen-Serie bleibt erhalten. Danach startet ein sanfter Wiedereinstieg.",pauseNow:(e,n)=>`Pause (${e}) seit ${n} \u2013 dein Plan ruht.`,pauseEnd:"Pause beenden",pausedDay:"Pause \u2013 an diesem Tag ist nichts geplant.",getWell:"Gute Besserung!",niceHoliday:"Sch\xF6nen Urlaub!",rampNote:e=>`Wiedereinstieg nach der Pause: weniger Runden und niedrigere Intensit\xE4t (noch ${e} Tage).`,ko:"K.-o. oder Abbruch durch Kopftreffer",koHint:"Nach einem K.-o. oder einem Kampfabbruch durch Kopftreffer darf man laut WAKO-Regelwerk mindestens 4 Wochen nicht k\xE4mpfen. So lange nimmt die App Sparring und Partnertreffer aus dem Plan. Lass dich in jedem Fall \xE4rztlich untersuchen.",koAdd:"Eintragen",koDate:"Datum",koActive:(e,n)=>`Sperre nach K.-o. bis ${e} (noch ${n} Tage): kein Sparring, keine Partnertreffer.`,koPast:e=>`Letzter Eintrag: ${e} \u2013 die 4-Wochen-Sperre ist vorbei.`,koNote:"K.-o.-Sperre: kein Sparring und keine Partnertreffer, nur Solo-Arbeit.",ko ds nothing here but counts these days in your load and asks about them the day after.",clubMin:"Club session length",clubOverlap:"On some club days you also plan your own sessions \u2013 the app will point that out when you build them.",clubLog:"Log",clubAsk:e=>`Did you go to club training on ${e}?`,yesLog:"Yes, log it",no:"No",yes:"Yes",clubMissed:"Didn't attend",clubCancelled:"Cancelled",clubCancel:"Cancelled",clubAdd:"Log club training",clubWhat:"What did you do?",clubSameDay:"There is already club training on this day. Are you sure you want to add a session of your own?",hardNeighbor:"The day before or after already has a hard session or club training. Two hard days in a row raise the risk of injury.",sure:"Yes, do it",cancel:"Cancel",close:"Close",news:{row:"What's new",sub:"The changes of the last big update",h:"What's new",pts:["<b>Three sports:</b> kickboxing, boxing (DBV rules) and taekwondo (WT/DTU and ITF-D). Pick your main sport under Profile \u2192 About me; any session or club training can also be another sport. Your existing data, history and belt are kept in full.","<b>Training by sport:</b> boxing builds endurance and toughness (3-minute rounds, body conditioning), WT flexibility, speed and kick chains, ITF hand-foot combos and spectacular kicks. Strength, conditioning and mobility follow your main sport too.","<b>Taekwondo grades:</b> grade per style, exam parts and waiting times by the grading rules, 4 weeks of exam preparation in the plan. Spinning and jump kicks are released by your level or your belt. Technique names in Korean or English.","<b>Profile re-sorted:</b> \u201CAbout me\u201D only asks what belongs to the sport you pick. Tournaments and gradings share \u201CDates & goals\u201D, club and training days live under \u201CTraining week\u201D.","<b>For every sport:</b> its own guide, packing list, tips, round timer presets and protective gear notes for sparring and partner drills.","<b>Kickboxing:</b> kick chains from advanced (rarer with \u201CMore boxing\u201D), sparring in the simple view too."],ok:"Got it"},ack:{h:"Quick safety note",pts:["You train at your own risk. Ringzeit doesn't replace a coach or medical advice.","With pre-existing conditions, injuries or complaints, check with a doctor first. Stop at once with pain, dizziness or shortness of breath.","Sparring and partner drills only under supervision.","Under 18 only with your parents' consent."],priv:"Ringzeit is a private project \u2013 not offered by your club, WAKO or any federation.",ok:"Got it \u2013 let's go"},legal:{row:"Notes & privacy",sub:"Safety, liability, your data",h1:"Safety & liability",p1:["Ringzeit is a private, free project. It is not offered by a club, WAKO, WAKO Germany or any federation.","The training suggestions are general recommendations and replace neither a coach nor medical advice. Use at your own risk.","With pre-existing conditions, injuries, pregnancy or complaints, check with a doctor before training. Stop at once with pain, dizziness or shortness of breath.","Sparring and partner drills only under supervision. Children and teenagers under 18 use Ringzeit only with their parents' consent.","The current rulebooks of your federation (WAKO Germany, DBV, DTU, ITF-D) and your coaches' instructions always take precedence."],h2:"Privacy",p2:["Ringzeit has no account, no ads and no tracking. Everything you enter stays on your device only.","Ringzeit is served via GitHub Pages. When loading and updating, GitHub processes the usual technical access data such as the IP address.","You save backups yourself. \u201CStart over\u201D deletes all data on this device.","Feedback is voluntary and goes through a form at Tally (an EU provider). Only what you enter there is sent, plus the app version and device type (e.g. \u201CiPhone, installed\u201D) \u2013 no training data."]},fb:{lbl:"Feedback",hint:"What do you like, what bugs you? The form opens in the browser and needs internet. No training data is sent.",btn:"Send feedback",offline:"You need internet to send feedback."},resetLbl:"Start over",resetHint:"Deletes all data on this device \u2013 plan, entries, tests, combos \u2013 and starts the setup again. Best save a backup first.",resetBtn:"Delete all data",resetAsk:"Really delete everything? This can't be undone \u2013 except with a saved backup.",pme:{sportSec:"Sport & belt",forLbl:"Details for:",mainBadge:"Main sport",mainIs:e=>`${e} is your main sport \u2013 Ringzeit plans for it.`,otherMain:(e,n)=>`Your main sport is ${e}. You can still enter your ${n} details.`,setMain:e=>`Make ${e} my main sport`,beltKb:"Belt",beltKbNote:"You practise the grading programme and theory under Test \u2192 Belt grading.",toExam:"To the belt grading \u203A",change:"Change",enter:"Enter",done:"Done",boxCls:"Age class (DBV)",boxNote:"Worked out from your birth year. Boxing has no belts.",namesNote:"Applies to the technique names in taekwondo plans. In ITF-D, Korean names exist only for terms of the ITF-D grading rules. The voice always says them in English.",gradeOf:e=>`Grade ${e}`,gradeNote:"It only changes through a passed exam or your correction \u2013 never through sessions, badges or the fitness test.",histN:e=>`History (${e} ${e===1?"entry":"entries"})`,person:"Person",birthHint:{kickboxing:"Used to work out your WAKO age category and bout format.",boxing:"Used to work out your DBV age class and round format.",taekwondo:"Used to work out your age class, competition format and grade line (e.g. Poom under 15)."},upcoming:"Upcoming dates",noDates:"No date entered yet.",kinds:{comp:"Tournament",exam:"Grading"},target:e=>`Target ${e}`,examParts:e=>`Grading for ${e} \u2013 what is asked`,newDate:"New date",boxNoExam:"Boxing has no belt gradings.",targetLbl:e=>`Target grade (${e})`,examHint:"In the 4 weeks before, Ringzeit prepares you for the grading.",topGrade:"You have reached the highest grade in Ringzeit.",past:"Past"},psec:{back:"Profile",me:["About me","Sport & belt, age, level, limitations"],train:["Training week","Club, own days, focus block"],goals:["Dates & goals","Tournaments and gradings"],life:["Everyday life & breaks","Relax, week, short on time, work, breaks, KO"],guide:["Guide","Hand wraps, first aid, 10 topics to read"],guideTkd:"Belt & dobok, grades, terms, first aid \u2013 topics to read",app:["App & data","Backup, my combos, voice, design, tour"],days:e=>`${e} ${e===1?"day":"days"} Ringzeit`,club:e=>`${e}\xD7 club`,noGoal:"No goal set yet",nextComp:e=>`Tournament on ${e}`,nextGrade:e=>`Grading on ${e}`,paused:"Break running"},life:{title:"Everyday life",hint:"Work, school, studies and family take energy too. Everything here is optional.",weekQ:"How is your week looking?",weekS:"Ringzeit adapts your sessions \u2013 one tap is enough.",moods:{easy:"Relaxed",normal:"Normal",hard:"Stressful"},weekLbl:"This week",moodToast:{easy:"Week adjusted \u2013 a bit more on",normal:"Got it \u2013 normal plan",hard:"Week adjusted \u2013 lighter, more technique"},lowLbl:"Short-on-time mode",lowHint:"For exams, moving house, a new baby and the like: sessions of 30 minutes at most, essentials only. Your streak keeps going.",lowOn:"Short-on-time mode on \u2013 30 minutes at most",lowOff:"Short-on-time mode off",workLbl:"Type of work",workHint:"Desk job: more mobility for hips and back. Physical job: a little less strength volume.",works:{"":"Not set",sit:"Desk",phys:"Physical"},formQ:"How do you feel today?",formS:"Optional \u2013 adjusts today's session.",sleep:"Sleep",energy:"Energy",lv:["Poor","Okay","Good"],formDone:"Session adjusted to how you feel",notes:{hard:"Stressful week: fewer rounds, no sparring, no hard conditioning \u2013 training should give energy today, not take it.",easy:"Relaxed week: one extra round is on.",formLow:"Low on energy today: go lighter. Clean technique, no all-out \u2013 better to be well rested for the next session.",formMid:"Medium form: a bit less volume, pace by feel.",low:"Short-on-time mode: essentials only.",sit:"Lots of sitting: finish by mobilising hips and upper back.",phys:"Physical job: a little less strength volume."}},planUpd:"Plan updated",autoSave:"Changes go into your plan right away.",needDay:"Pick at least one training day.",guide:{title:"Guide",hint:"Wrapping, gear care, first aid \u2013 and reading on all things kickboxing.",hintBox:"Wrapping, gear care, first aid \u2013 and reading on all things boxing.",hintTkd:"Gear care, first aid \u2013 and reading on all things taekwondo.",practical:"Practical",reads:"To read",nextRead:"Next topic",wrap:"Hand wraps",care:"Gear care",aid:"Care & first aid",wrapLink:"Hand wraps",video:"Watch video (opens YouTube)",step:(e,n)=>`Step ${e} of ${n}`,prev:"Back",next:"Next",again:"Start over",wrapIntro:"Wraps protect the knuckle bones and the wrist. Adults usually use 4\u20134.5 m. Keep the hand spread while wrapping \u2013 then nothing pinches when you make a fist.",wrapSteps:["Put your thumb through the loop and run the wrap down over the back of the hand.","Wrap the wrist 3 times \u2013 firm, but not cutting off the blood.","Go diagonally over the back of the hand to the knuckles and wrap them 3 times.","Between the fingers: little/ring, ring/middle, middle/index \u2013 each time back over the wrist.","Wrap the thumb once \u2013 it gives it support.","Secure with crosses (X) over the back of the hand, wrap the rest around the wrist and close the velcro. Make a fist: nothing may pinch or tingle."],careSecs:[["Gloves","Take them out of the bag after every session and open them up. Spray the inside with a disinfecting textile freshener and let them air-dry \u2013 not on the radiator, not in blazing sun. Wipe the outside with a damp cloth. The spray adds to airing, it doesn't replace it: moisture is the main cause of smell and germs. On leather, test alcohol-based sprays on a hidden spot first."],["Hand wraps","Wash after every session: in a laundry bag at 30\u201340 \xB0C, velcro closed. Air-dry and store rolled up \u2013 thumb loop inside, velcro outside. Then they're ready to go next time."],["Shin and foot guards","Like gloves: spray inside, air out, wipe the outside. Fabric guards can often go in the wash \u2013 check the label."],["Mouthguard","Rinse with cold water after training \u2013 hot water deforms it. Let it dry in a ventilated case and clean it with a toothbrush now and then. Replace it when it cracks or no longer fits well."],["Head guard and groin guard","Spray inside and air out. Wash the groin guard if the label allows."],["Gym bag","Not a drying room: always unpack your gear after training. A laundry bag for the wraps and a pouch for wet things keep it tidy."]],aidSecs:[["Bruises and strains: PRICE","Protect and rest \u2013 stop right away. Ice \u2013 cool for 10\u201320 minutes, always with a cloth in between. Compression \u2013 a light bandage. Elevate \u2013 above heart level. This limits swelling and bruising."],["Thai boxing liniment (e.g. Namman Muay)","Rub in to warm up the muscles before training, and for massage on tight muscles or older bruises. Not on fresh injuries: cool first for the first 1\u20132 days \u2013 heat can make fresh swelling worse. Not on broken skin, not in the eyes, wash your hands afterwards, don't combine with a hot-water bottle or sauna. These oils usually contain methyl salicylate (aspirin-like): if you're allergic or take blood thinners, ask at the pharmacy first."],["Nosebleed","Lean the head slightly forward, don't tilt it back. Pinch the soft part of the nose for 10 minutes and cool the neck. If it hasn't stopped after 20 minutes: see a doctor."],["Stop at once and see a doctor","After a blow to the head with headache, nausea, dizziness, blurred vision or confusion \u2013 it may be a concussion; the WAKO suspension after a KO applies. If you suspect a fracture (severe pain, deformity, cracking), with swelling that doesn't go down, and with pain that isn't better after 2\u20133 days."]],aidNote:"These tips don't replace a doctor. In an emergency call 112.",winCare:"Spray the inside of gloves and guards with a disinfecting textile freshener and let them air-dry."},pack:{title:"Packing list",card:e=>`Tournament on ${e}`,cardS:(e,n)=>`Packing list: ${e} of ${n} packed`,all:"All packed \u2013 good luck!",open:"Open packing list",add:"Own item",addBtn:"Add",reset:"Clear all ticks",hint:"Time to pack your things!",items:["Head guard","Mouthguard","T-shirt / sleeveless for Kick Light","Gloves","Hand wraps","Trousers / shorts","Groin guard","Shin guards","Foot guards","Cut your toenails","Coach licence","Water","Snacks / food","Shower things"],itemsBox:["Head guard","Mouthguard","Boxing gloves","Hand wraps","Vest / T-shirt (colour as per invitation)","Boxing shorts","Groin guard","Boxing shoes","Sports pass / ID","Water","Snacks / food","Shower things"],boxNote:"Derived from the DBV competition rules \u2013 check the invitation for equipment; you can add your own items.",itemsWt:["Dobok","Belt","Trunk protector","Head guard","Groin guard","Forearm guards","Shin guards","Hand protectors","Mouth guard (white or transparent)","Sensor socks (with electronic scoring)","Licence / ID","Water","Snacks / food","Shower things"],itemsItf:["Dobok","Belt","Closed gloves","Foot guards","Head guard (no face mask)","Mouth guard","Shin guards","Groin guard (m) / chest guard (f)","Red and blue armbands","Licence / ID","Water","Snacks / food","Shower things"],wtNote:"Derived from the WT competition rules and the DTU competition regulations \u2013 check the invitation for equipment (youth: head guard sometimes with visor); you can add your own items.",itfNote:"Derived from the ITF tournament rules and the ITF-D competition rules \u2013 check the invitation for equipment; you can add your own items."},coach:{lbl:"Coach calls",hint:"Calls out combos from your level during the round \u2013 react right away."},feast:{newyear0:"Happy New Year's Eve!",newyear1:"Happy New Year!",karneval:"Happy carnival \u2013 Helau & Alaaf!",valentine: 1CGuide\u201D you'll find belt & dobok, grades and exams, terms, gear care and first aid.",tourBasics:"Ringzeit doesn't teach basic technique. You should be solid on stance, guard, basic punches and kicks from club training. If you're unsure, ask your coach first.",tour:{intro:["Welcome to Ringzeit","Ringzeit complements your club training: it plans your own sessions under WAKO rules, logs everything and adjusts the load. This short tour shows you where to find what."],today:["Today","What's on today: your own session, club training or a rest day. Below is your week \u2013 if something falls through, you can move or skip it."],strip:["Your week","Each colour stands for a type of session. Tap a day to look at it."],plan:["Week plan","Every session of the week, club training included. If something falls through, you can move, skip or catch it up."],setup:["Set up a session","Your daily plan is already prepared. Under Adjust session you can change type, duration, place and equipment, then rebuild the plan. The preview is not an active workout yet."],timer:["Begin training","Session shows your daily plan. Begin training guides you exercise by exercise in full screen: timed exercises with gong and calls, otherwise tap \u2713, for strength enter your reps. At the end you save how hard it was."],exinfo:["Exercises","The \u24D8 shows a sketch, form cues and the common mistake. Checking exercises and logging reps and weight become available after Begin training."],finish:["Finish","After the cool-down, record actual duration and effort (RPE). You can finish early; open exercises stay open. Returning to the plan preview pauses active workout timers."],ftimer:["Round timer","The red button in the middle starts a free round timer with a ring bell \u2013 for club training, sparring or in between, no plan needed. With \u201Ccoach calls\u201D it calls out combos for you."],test:["Tests & belt grading","The fitness test checks strength, speed, endurance, mobility and technique and 0138 weeks, always rested and under the same conditions.",lvlUp:e=>`Level \u201C${e}\u201D unlocked!`,setL:"Set",holdTarget:(e,n)=>`Timed: hold ${e}\xD7 ${n[0]}\u2013${n[1]} s`,reps:"reps",secs:"sec",kg:"kg",addSet:"+ Set",lastTime:"Last time",volume:"Volume",exDone:e=>`${e} strength exercises`}},CODE={T:"TEC",C:"MIX",P:"SPA",S:"STR",K:"CON",M:"MOB"},FACTS=[{de:"Die WAKO wurde am 26. Februar 1977 in Berlin offiziell gegr\xFCndet \u2013 von Georg Br\xFCckner.",en:"WAKO was officially founded in Berlin on 26 February 1977 by Georg Br\xFCckner.",s:"wako.sport"},{de:"WAKO stand urspr\xFCnglich f\xFCr \u201EWorld All-Style Karate Organization\u201C. Kickboxen hie\xDF anfangs noch Semi- und Full-Contact-Karate.",en:"WAKO originally stood for \u201CWorld All-Style Karate Organization\u201D. Early on, the sport was still called semi- and full-contact karate.",s:"wako.sport"},{de:"Georg Br\xFCckner gilt als \u201EVater des europ\xE4ischen Kickboxens\u201C. Ab 1974 veranstaltete er die ersten Kickbox-Shows in Europa.",en:"Georg Br\xFCckner is known as the \u201Cfather of European kickboxing\u201D. From 1974 he promoted the first kickboxing shows in Europe.",s:"Wikipedia"},{de:"Br\xFCckner erfand und patentierte Schutzausr\xFCstung, damit K\xE4mpfer verschiedener Stile ohne schwere Verletzungen gegeneinander antreten konnten.",en:"Br\xFCckner invented and patented protective gear so fighters from different styles could compete without serious injuries.",s:"Wikipedia"},{de:"Als erster \u201EKickbox-Kampf\u201C gilt f\xFCr die WAKO das Duell Joe Lewis gegen Greg Baines 1970 in den USA \u2013 erstmals mit Boxhandschuhen.",en:"WAKO regards Joe Lewis vs. Greg Baines (USA, 1970) as the first \u201Ckickboxing fight\u201D \u2013 the first time boxing gloves were worn.",s:"wako.sport"},{de:"1974 fand in Los Angeles die erste \u201EWeltmeisterschaft im Full Contact\u201C statt. Erste Weltmeister: Bill Wallace, Jeff Smith und Joe Lewis.",en:"The first \u201CWorld Championship in Full Contact\u201D took place in Los Angeles in 1974. First champions: Bill Wallace, Jeff Smith and Joe Lewis.",s:"wako.sport"},{de:"Die ersten WAKO-Europameisterschaften fanden 1977 in Wien statt \u2013 alle K\xE4mpfe nach Full-Contact-Regeln.",en:"The first WAKO European Championships were held in Vienna in 1977 \u2013 every bout under Full Contact rules.",s:"Wikipedia"},{de:"Bei der ersten WAKO-Weltmeisterschaft 1978 traten 110 Athleten aus 18 L\xE4ndern an.",en:"The first WAKO World Championships in 1978 had 110 competitors from 18 countries.",s:"WAKO India"},{de:"Am 20. Juli 2021 erkannte das IOC die WAKO auf seiner 138. Session in Tokio vollst\xE4ndig an.",en:"On 20 July 2021, the 138th IOC Session in Tokyo granted WAKO full recognition.",s:"wako.sport"},{de:"Die vorl\xE4ufige IOC-Anerkennung f\xFCr Kickboxen kam bereits am 30. November 2018.",en:"Kickboxing received provisional IOC recognition on 30 November 2018.",s:"WAKO India"},{de:"Die WAKO hat 7 Wettkampfdisziplinen: 3 im Ring (Full Contact, Low Kick, K1) und 4 auf der Tatami (Point Fighting, Light Contact, Kick Light, Musical Forms).",en:"WAKO has 7 competitive disciplines: 3 in the ring (Full Contact, Low Kick, K1) and 4 on the tatami (Point Fighting, Light Contact, Kick Light, Musical Forms).",s:"wako.sport"},{de:"Ein Kampf im Ring dauert drei Runden \xE0 zwei Minuten, mit einer Minute Pause dazwischen.",en:"A ring bout is three two-minute rounds with a one-minute break between them.",s:"wako.sport"},{de:"Im Full Contact m\xFCssen pro Runde mindestens 6 Kicks geschlagen werden \u2013 sonst drohen Punktabz\xFCge.",en:"In Full Contact you must throw at least 6 kicks per round, or the referee may deduct points.",s:"Wikipedia"},{de:"Fu\xDFfeger sind im Full Contact erlaubt \u2013 aber nur Fu\xDF gegen Fu\xDF.",en:"Foot sweeps are legal in Full Contact \u2013 but only foot against foot.",s:"USA Kickboxing"},{de:"Full-Contact-K\xE4mpfer tragen lange Hosen, Low-Kick- und K1-K\xE4mpfer kurze Shorts.",en:"Full Contact fighters compete in long pants; Low Kick and K1 fighters wear shorts.",s:"Ontario Kickboxing Rules"},{de:"Light Contact liegt zwischen Point Fighting und Full Contact: gleiche Techniken, aber jeder Treffer muss kontrolliert sein.",en:"Light Contact sits between Point Fighting and Full Contact: the same techniques, but every hit must be controlled.",s:"WAKO Technical Book"},{de:"Laut WAKO trainieren weltweit \xFCber 4 Millionen Menschen Kickboxen \u2013 in mehr als 40.000 Vereinen.",en:"According to WAKO, over 4 million people practise kickboxing in more than 40,000 clubs worldwide.",s:"wako.sport"},{de:"135 Nationen auf f\xFCnf Kontinenten sind Mitglied der WAKO.",en:"135 nations across five continents are WAKO members.",s:"wako.sport"},{de:"Seit der Regelreform hei\xDFt die Disziplin \u201EK1 Rules\u201C offiziell \u201EK1 Style\u201C.",en:"Since the rules reform, the discipline \u201CK1 Rules\u201D is officially called \u201CK1 Style\u201D.",s:"wako.sport"},{de:"Der Hauptsitz der WAKO liegt heute in Monza, Italien.",en:"WAKO's headquarters are in Monza, Italy.",s:"Wikipedia"},{de:"Das Wort \u201EKickboxing\u201C wurde in den 1960er-Jahren in Japan gepr\xE4gt \u2013 vom Box-Promoter Osamu Noguchi.",en:"The word \u201Ckickboxing\u201D was coined in Japan in the 1960s \u2013 by boxing promoter Osamu Noguchi.",s:"Wikipedia: Kickboxing"},{de:"K-1 wurde 1993 in Japan von Kazuyoshi Ishii gegr\xFCndet. Das \u201EK\u201C steht f\xFCr Kampfk\xFCnste wie Karate, Kickboxen und Kung-Fu, die \u201E1\u201C f\xFCr den einen Sieger.",en:"K-1 was founded in Japan in 1993 by Kazuyoshi Ishii. The \u201CK\u201D stands for styles like karate, kickboxing and kung fu, the \u201C1\u201D for the one champion.",s:"Wikipedia: K-1"},{de:"Muay Thai hei\xDFt \u201EKunst der acht Gliedma\xDFen\u201C: zwei F\xE4uste, zwei Ellbogen, zwei Knie, zwei Schienbeine.",en:"Muay Thai is called \u201Cthe art of eight limbs\u201D: two fists, two elbows, two knees, two shins.",s:"Wikipedia: Muay Thai"},{de:"Bill Wallace bekam den Spitznamen \u201ESuperfoot\u201C \u2013 er kickte fast nur mit dem linken Bein, weil sein rechtes Knie verletzt war.",en:"Bill Wallace was nicknamed \u201CSuperfoot\u201D \u2013 he kicked almost only with his left leg because his right knee was injured.",s:"Wikipedia: Bill Wallace"},{de:"Die Queensberry-Regeln von 1867 machten Handschuhe im Boxen zur Pflicht und f\xFChrten Runden \xE0 3 Minuten mit 1 Minute Pause ein.",en:"The Queensberry Rules of 1867 made gloves mandatory in boxing and introduced 3-minute rounds with a 1-minute break.",s:"Wikipedia: Marquess of Queensberry Rules"},{de:"Handschuhe werden in Unzen gewogen: Ein 10-oz-Handschuh wiegt rund 283 Gramm.",en:"Gloves are weighed in ounces: a 10 oz glove weighs about 283 grams.",s:"1 oz = 28,35 g"},{de:"Savate ist franz\xF6sisches \u201EFu\xDFboxen\u201C \u2013 gek\xE4mpft wird dort mit Schuhen.",en:"Savate is French \u201Cfoot boxing\u201D \u2013 it is fought wearing shoes.",s:"Wikipedia: Savate"},{de:"Sanda (Sanshou) ist chinesisches Kickboxen: Schl\xE4ge, Tritte \u2013 und W\xFCrfe sind erlaubt.",en:"Sanda (Sanshou) is Chinese kickboxing: punches, kicks \u2013 and throws are allowed.",s:"Wikipedia: Sanda"},{de:"Im burmesischen Lethwei sind sogar Kopfst\xF6\xDFe erlaubt \u2013 traditionell k\xE4mpft man mit Bandagen, aber ohne Handschuhe.",en:"In Burmese Lethwei even headbutts are allowed \u2013 traditionally fought with wraps but no gloves.",s:"Wikipedia: Lethwei"},{de:"\u201EDojo\u201C bedeutet \u201EOrt des Weges\u201C \u2013 der Raum, in dem man den Weg einer Kampfkunst \xFCbt.",en:"\u201CDojo\u201D means \u201Cplace of the way\u201D \u2013 the room where you practise the way of a martial art.",s:"Wikipedia: Dojo"},{de:"Der h\xE4ufigste Bruch beim Schlagen ist der \u201EBoxerbruch\u201C am f\xFCnften Mittelhandknochen. Bandagen und Treffen mit den ersten beiden Kn\xF6cheln sch\xFCtzen davor.",en:"The most common fracture from punching is the \u201Cboxer's fracture\u201D of the fifth metacarpal. Hand wraps and hitting with the first two knuckles protect against it.",s:"DocCheck Flexikon: Boxerfraktur"},{de:"Muskelkater entsteht durch winzige Risse in den Muskelfasern \u2013 nicht durch Milchs\xE4ure, wie man lange dachte.",en:"Muscle soreness comes from tiny tears in the muscle fibres \u2013 not from lactic acid, as was long believed.",s:"Sportmedizin"},{de:"Knochen passen sich der Belastung an (Wolffsches Gesetz) \u2013 deshalb wird das Schienbein durch langsames, regelm\xE4\xDFiges Training belastbarer.",en:"Bones adapt to the load placed on them (Wolff's law) \u2013 which is why the shin gets tougher with slow, regular training.",s:"Wikipedia: Wolffsches Gesetz"},{de:"Schon rund 2 % Fl\xFCssigkeitsverlust (gemessen am K\xF6rpergewicht) k\xF6nnen die Leistung messbar senken.",en:"Losing as little as about 2 % of body weight in fluid can measurably reduce performance.",s:"ACSM Position Stand"},{de:"Im Tiefschlaf sch\xFCttet der K\xF6rper besonders viel Wachstumshormon aus \u2013 Schlaf ist Teil deines Trainings.",en:"In deep sleep the body releases most of its growth hormone \u2013 sleep is part of your training.",s:"Schlafmedizin"},{de:"Die Reaktionszeit auf einen Sehreiz liegt meist bei rund 0,2 Sekunden \u2013 deshalb sind Finten so wirksam.",en:"Reaction time to something you see is usually around 0.2 seconds \u2013 that's why feints work so well.",s:"Physiologie"},{de:"Im Profiboxen ist der Jab laut Schlagstatistiken der am h\xE4ufigsten geschlagene Schlag.",en:"In pro boxing, punch statistics show the jab is the most frequently thrown punch.",s:"CompuBox"},{de:"Im Ring gibt es eine rote und eine blaue Ecke f\xFCr die K\xE4mpfer \u2013 die zwei \xFCbrigen hei\xDFen \u201Eneutrale Ecken\u201C.",en:"A ring has a red and a blue corner for the fighters \u2013 the other two are called \u201Cneutral corners\u201D.",s:"Wettkampfregeln"},{de:"Im Point Fighting wird nach jedem Treffer unterbrochen und gewertet \u2013 im Light Contact l\xE4uft der Kampf weiter.",en:"In Point Fighting the bout stops after every hit to score it \u2013 in Light Contact the fight keeps going.",s:"WAKO-Regeln"},{de:"\u201EFloat like a butterfly, sting like a bee\u201C \u2013 der ber\xFChmte Spruch von Muhammad Ali stammt aus dem Jahr 1964.",en:"\u201CFloat like a butterfly, sting like a bee\u201D \u2013 Muhammad Ali's famous line dates from 1964.",s:"Wikipedia: Muhammad Ali"},{de:"Seilspringen trainiert Rhythmus, Fu\xDFarbeit und Ausdauer zugleich \u2013 darum geh\xF6rt es seit Generationen zum Box-Training.",en:"Skipping rope trains rhythm, footwork and stamina at once \u2013 that's why it has been part of boxing training for generations.",s:"Trainingslehre"},{de:"Die Kraft eines Schlags kommt aus der ganzen Kette: Fu\xDF, Bein, H\xFCfte, Rumpf, Schulter, Arm \u2013 nicht aus dem Arm allein.",en:"The power of a punch comes from the whole chain: foot, leg, hip, trunk, shoulder, arm \u2013 not from the arm alone.",s:"Biomechanik"},{de:"Bei den World Games 2022 in Birmingham (USA) war Kickboxen erstmals offizielle Sportart \u2013 gek\xE4mpft wurde nach K1-Regeln. 2017 war es dort noch Einladungssportart.",en:"At the 2022 World Games in Birmingham (USA) kickboxing was an official sport for the first time \u2013 fought under K1 rules. In 2017 it had been an invitational sport.",s:"Wikipedia: Kickboxing at the 2022 World Games"},{de:"2023 war Kickboxen zum ersten Mal Teil der European Games: 16 Wettbewerbe in Point Fighting, Light Contact und Full Contact, ausgetragen in My\u015Blenice (Polen).",en:"In 2023 kickboxing was part of the European Games for the first time: 16 events in point fighting, light contact and full contact, held in My\u015Blenice (Poland).",s:"Wikipedia: Kickboxing at the 2023 European Games"},{de:"Ernesto Hoost hie\xDF \u201EMr. Perfect\u201C \u2013 wegen seiner fast maschinenhaft pr\xE4zisen Kombinationen. Er gewann den K-1 World Grand Prix 1997, 1999, 2000 und 2002.",en:"Ernesto Hoost was called \u201CMr. Perfect\u201D for his almost machine-like precise combinations. He won the K-1 World Grand Prix in 1997, 1999, 2000 and 2002.",s:"Wikipedia: Ernesto Hoost"},{de:"Semmy Schilt ist 2,12 m gro\xDF und gewann den K-1 World Grand Prix viermal \u2013 2005, 2006, 2007 und 2009.",en:"Semmy Schilt is 2.12 m tall and won the K-1 World Grand Prix four times \u2013 2005, 2006, 2007 and 2009.",s:"Wikipedia: Semmy Schilt"},{de:"Peter Aerts, \u201EThe Dutch Lumberjack\u201C, gewann den K-1 World Grand Prix 1994, 1995 und 1998 \u2013 und gilt vielen als \u201EMr. K-1\u201C.",en:"Peter Aerts, \u201CThe Dutch Lumberjack\u201D, won the K-1 World Grand Prix in 1994, 1995 and 1998 \u2013 many call him \u201CMr. K-1\u201D.",s:"Wikipedia: Peter Aerts"},{de:"Das Rajadamnern-Stadion in Bangkok wurde ab 1941 gebaut, der Krieg stoppte den Bau. Der erste Kampf fand am 23. Dezember 1945 statt.",en:"Construction of Bangkok's Rajadamnern Stadium began in 1941 and was halted by the war. The first fight took place on 23 December 1945.",s:"WMC: Rajadamnern Stadium History"},{de:"Vor der ersten Runde zeigen Muay-Thai-K\xE4mpfer den Wai Khru Ram Muay \u2013 ein Ritual, das Lehrer und Training ehrt. Gewertet wird er nicht.",en:"Before the first round, Muay Thai fighters perform the Wai Khru Ram Muay \u2013 a ritual honouring their teachers and training. It isn't scored.",s:"Muay Thai Records: Wai Kru Ram Muay"},{de:"Wie schnell dein Puls in der ersten Minute Pause f\xE4llt, zeigt deine Ausdauer: Je schneller er sinkt, desto besser erholst du dich zwischen den Runden.",en:"How fast your pulse drops in the first minute of rest shows your endurance: the faster it falls, the better you recover between rounds.",s:"Sportmedizin"},{b:1,de:"Boxen geh\xF6rte schon zu den antiken Olympischen Spielen. Der erste bekannte Sieger war Onomastos von Smyrna im Jahr 688 v. Chr.",en:"Boxing was part of the ancient Olympic Games. The first known champion was Onomastos of Smyrna in 688 BCE.",s:"Olympedia"},{b:1,de:"Bei den modernen Olympischen Spielen war Boxen erstmals 1904 in St. Louis dabei \u2013 alle Teilnehmer waren Amerikaner.",en:"Boxing first appeared at the modern Olympic Games in 1904 in St. Louis \u2013 all entrants were American.",s:"Olympedia"},{b:1,de:"1912 in Stockholm fehlte Boxen, weil der Sport in Schweden damals eine Sondergenehmigung brauchte. Seit Antwerpen 1920 ist es bei jeder Austragung dabei.",en:"Boxing was missing in Stockholm in 1912 because the sport needed special permits in Sweden at that time. It has been on the programme at every Games since Antwerp 1920.",s:"Olympedia"},{b:1,de:"Olympisches Frauenboxen gab es erstmals 2012 in London.",en:"Women's boxing was first contested at the Olympic Games in London in 2012.",s:"Olympedia"},{b:1,de:"Die Amateur Boxing Association of England wurde 1880 von zw\xF6lf Vereinen gegr\xFCndet, die ersten Meisterschaften folgten 1881.",en:"The Amateur Boxing Association of England was formed in 1880 by twelve clubs; its first championships followed in 1881.",s:"Wikipedia"},{b:1,de:"Seit 2009 boxen M\xE4nner im internationalen Amateurboxen drei Runden zu je drei Minuten, vorher waren es vier Runden zu je zwei Minuten.",en:"Since 2009 men in international amateur boxing fight three rounds of three minutes; before that it was four rounds of two minutes.",s:"Wikipedia"},{b:1,de:"Die ersten Amateurbox-Weltmeisterschaften fanden 1974 statt.",en:"The first World Amateur Boxing Championships were held in 1974.",s:"Wikipedia"},{tk:!0,de:"Taekwondo setzt sich aus drei Silben zusammen: tae (Fu\xDF), kwon (Faust) und do (Weg). Der Name wurde in den 1950er-Jahren festgelegt.",en:"Taekwondo is made of three syllables: tae (foot), kwon (fist) and do (way). The name was settled in the 1950s.",s:"Wikipedia"},{tk:!0,de:"Die Sch\xFClergrade hei\xDFen Gup (Kup) und z\xE4hlen abw\xE4rts bis zum 1. Gup; danach folgen die Meistergrade (Dan), die aufw\xE4rts gez\xE4hlt werden.",en:"The student grades are called gup (kup) and count down to 1st gup; the master grades (dan) that follow count upwards.",s:"Wikipedia"},{tk:"wt",de:"Die World Taekwondo Federation wurde 1973 gegr\xFCndet, im selben Jahr fanden in Seoul die ersten Weltmeisterschaften statt. Seit 2017 hei\xDFt der Verband World Taekwondo (WT).",en:"The World Taekwondo Federation was founded in 1973, and the first World Championships took place in Seoul the same year. Since 2017 the federation has been called World Taekwondo (WT).",s:"taekwondonation.com"},{tk:"wt",de:"Das IOC erkannte die WT 1980 an. Bei den Spielen 1988 in Seoul und 1992 in Barcelona war Taekwondo Demonstrationssport, seit 2000 ist es olympische Medaillendisziplin.",en:"The IOC recognised WT in 1980. Taekwondo was a demonstration sport at the 1988 Seoul and 1992 Barcelona Games and has been an Olympic medal sport since 2000.",s:"Olympedia; taekwondonation.com"},{tk:"wt",de:"Die Deutsche Taekwondo Union (DTU) ist Mitglied der World Taekwondo, der European Taekwondo Union und des DOSB.",en:"The German Taekwondo Union (DTU) is a member of World Taekwondo, the European Taekwondo Union and the DOSB.",s:"Wikipedia"},{tk:"itf",de:"Die International Taekwon-Do Federation wurde am 22. M\xE4rz 1966 in Seoul von General Choi Hong-hi gegr\xFCndet. Ihr Sitz ist seit 1985 Wien.",en:"The International Taekwon-Do Federation was founded on 22 March 1966 in Seoul by General Choi Hong-hi. Its seat has been Vienna since 1985.",s:"Wikipedia"},{tk:"itf",de:"Der ITF-D vertritt die International Taekwon-Do Federation in Deutschland.",en:"The ITF-D represents the International Taekwon-Do Federation in Germany.",s:"Wikipedia"}],TIPS=[{k:1,de:"Low Kick: Mit dem Schienbein treffen, nicht mit dem Fu\xDF \u2013 und die H\xFCfte ganz durchdrehen.",en:"Low kick: hit with the shin, not the foot \u2013 and turn the hip all the way through."},{de:"Nach jeder Kombi bewegen: raus aus der Linie oder zur\xFCck in Deckung \u2013 nie stehen bleiben.",en:"Move after every combo: off the line or back into guard \u2013 never stand still."},{nt:1,de:"Haken: Ellbogen auf Schulterh\xF6he, die Faust dreht mit \u2013 die Kraft kommt aus der Drehung des vorderen Fu\xDFes.",en:"Hook: elbow at shoulder height, the fist turns with it \u2013 power comes from pivoting on the front foot."},{k:1,de:"Atmen nicht vergessen: Bei jedem Schlag und Kick kurz und scharf ausatmen.",en:"Don't forget to breathe: a short, sharp exhale with every punch and kick."},{k:1,de:"Sidekick: Ferse f\xFChrt, Fu\xDFkante zeigt zum Ziel \u2013 und das Knie erst hoch anziehen, dann strecken.",en:"Side kick: heel leads, the edge of the foot points at the target \u2013 chamber the knee high first, then extend."},{de:"Kinn runter, Augen hoch: So trifft dich weniger, und du siehst trotzdem alles.",en:"Chin down, eyes up: you get hit less and still see everything."},{de:"Abstand ist Verteidigung: Bleib knapp au\xDFerhalb der Reichweite und komm nur zum Treffen rein.",en:"Distance is defence: stay just outside range and only step in to hit."},{nt:1,de:"Uppercut: Erst leicht in die Knie, dann aus Beinen und H\xFCfte nach oben \u2013 nicht ausholen.",en:"Uppercut: dip the knees slightly, then drive up from legs and hips \u2013 don't wind up."},{nt:1,de:"Jab: Die Schulter sch\xFCtzt das Kinn, und die Hand kommt auf derselben Linie zur\xFCck, auf der sie rausging.",en:"Jab: your shoulder covers your chin, and the hand returns on the same line it went out."},{nt:1,de:"Cross: Die Kraft kommt aus H\xFCfte und hinterem Fu\xDF \u2013 die Ferse dreht mit nach au\xDFen.",en:"Cross: power comes from the hip and rear foot \u2013 turn the heel out with it."},{nt:1,de:"Haken: Ellbogen auf Fausth\xF6he, Rotation aus dem Rumpf. Nicht ausholen, sonst sieht man ihn kommen.",en:"Hook: elbow level with the fist, rotate from the trunk. Don't wind up, or they'll see it coming."},{k:1,de:"Roundhouse: Standfu\xDF eindrehen, bis die Ferse zum Gegner zeigt \u2013 sonst fehlt die H\xFCfte.",en:"Roundhouse: pivot the standing foot until the heel points at your opponent \u2013 otherwise the hip is missing."},{k:1,de:"Sidekick: Erst das Knie hoch zur Brust ziehen, dann die Ferse auf gerader Linie raussto\xDFen.",en:"Side kick: chamber the knee to your chest first, then drive the heel out in a straight line."},{k:1,de:"Frontkick: Knie anheben, H\xFCfte nach vorn schieben, mit dem Ballen treffen und schnell zur\xFCckziehen.",en:"Front kick: lift the knee, push the hip forward, hit with the ball of the foot and retract fast."},{k:1,de:"Nach jedem Kick sofort die H\xE4nde zur\xFCck ans Kinn \u2013 die meisten Treffer kassiert man beim Absetzen.",en:"After every kick, hands straight back to the chin \u2013 most hits land while you're putting the foot down."},{de:"Bei jedem Schlag kurz ausatmen. Das stabilisiert den Rumpf und verhindert, dass dir in Runde 3 die Luft ausgeht.",en:"Exhale sharply with every strike. It braces your core and keeps you from gassing out in round 3."},{nt:1,de:"Beinarbeit: Niemals die F\xFC\xDFe kreuzen. Der Fu\xDF in Bewegungsrichtung geht immer zuerst.",en:"Footwork: never cross your feet. The foot nearest the direction of travel always moves first."},{k:1,de:"Gedrehter Backkick: Erst dreht der Kopf, der Blick geht \xFCber die Schulter \u2013 dann l\xF6st du den Kick.",en:"Spinning back kick: turn your head first and look over your shoulder \u2013 then release the kick."},{k:1,de:"Fu\xDFfeger klappen \xFCber Timing, nicht \xFCber Kraft: fegen, wenn der Gegner das Gewicht auf den vorderen Fu\xDF verlagert.",en:"Sweeps are about timing, not power: sweep as your opponent shifts weight onto the front foot."},{de:"Kontrolle ist Technik: treffen und sofort zur\xFCckziehen, statt durchzuschlagen.",en:"Control is technique: touch and retract instantly instead of punching through.",d:["lc","kl"]},{de:"Plane deine 6 Kicks fr\xFCh in der Runde ein. Wer am Ende nachz\xE4hlt, verliert den Rhythmus.",en:"Get your 6 kicks in early in the round. Counting at the end breaks your rhythm.",d:["fc"]},{de:"Low Kick: mit dem Schienbein treffen, nicht mit dem Fu\xDF, und mit einer Hand vorher abdecken.",en:"Low kick: land with the shin, not the foot, and set it up behind a hand.",d:["kl","k1"]},{de:"Knie: H\xFCfte nach vorn schieben, Oberk\xF6rper aufrecht, beide H\xE4nde bleiben am Kopf.",en:"Knee: drive the hip forward, stay upright, both hands stay at your head.",d:["k1"]},{b:1,de:"Nach jedem Schlag die Hand auf demselben Weg zur\xFCck ans Kinn \u2013 die meisten Treffer f\xE4ngt man beim Zur\xFCckziehen.",en:"After every punch bring the hand back to your chin along the same path \u2013 most hits land while you pull back."},{b:1,de:"Kopfbewegung braucht einen Grund: Stell dir den Jab des Gegners vor, dann erst abtauchen oder wegpendeln.",en:"Head movement needs a reason: picture the opponent's jab first, then slip or roll away."},{b:1,de:"Der Jab misst die Distanz. Triff mit ihm, bevor du eine Kombination startest, und geh danach seitlich aus der Linie.",en:"The jab measures the distance. Land it before you start a combination, then step off the line."},{b:1,de:"Wer meidet, kontert: Nach dem Abtauchen sofort mit Cross oder K\xF6rperhaken antworten und wieder aus der Linie gehen.",en:"Slip, then counter: after the slip answer straight away with a cross or body hook and leave the line again."},{b:1,de:"Bandagen: erst die Daumenschlaufe, dann das Handgelenk \u2013 fest, aber nicht abschn\xFCrend. Sie st\xFCtzen das Handgelenk am Sandsack.",en:"Hand wraps: thumb loop first, then the wrist \u2013 firm, but not cutting off the blood. They support the wrist on the bag."},{b:1,de:"Sandsack wie Partner: Nach jeder Serie zur\xFCck in die Deckung und raus aus der Linie \u2013 kein Dauerfeuer ohne R\xFCckkehr.",en:"Treat the bag like a partner: after every set back into your guard and off the line \u2013 no non-stop firing without returning."},{b:1,de:"Schultern locker lassen, bis du schl\xE4gst: Verspannte Schultern kosten Tempo und lassen dich in Runde 3 fr\xFCher m\xFCde werden.",en:"Keep your shoulders loose until you punch: tight shoulders cost speed and tire you out sooner in round 3."},{b:1,de:"K\xF6rperhaken zuerst, dann zum Kopf: Der K\xF6rper zieht die Deckung des Gegners nach unten \u2013 das \xF6ffnet den Weg nach oben.",en:"Body hook first, then the head: the body pulls the opponent's guard down and opens the way upstairs."},{b:1,de:"Der Treffer kommt auf den ersten beiden Kn\xF6cheln, das Handgelenk bleibt gerade \u2013 locker bis zum Aufprall, dann fest schlie\xDFen.",en:"Land on the first two knuckles with a straight wrist \u2013 relaxed until impact, then close the fist firmly."},{tk:!0,de:"Kicks beginnen in der H\xFCfte: Erst die H\xFCfte \xF6ffnen, dann das Bein werfen \u2013 so wird der Tritt schneller und schont das Knie.",en:"Kicks start at the hip: open the hip first, then throw the leg \u2013 faster, and easier on the knee."},{tk:!0,de:"Beim Rundkick dreht das Standbein mit: Ferse in Richtung Ziel drehen, sonst bremst die H\xFCfte.",en:"On a round kick the standing foot turns with it: rotate the heel towards the target or the hip gets blocked."},{tk:!0,de:"Bein nach dem Treffer sofort zur\xFCckziehen: Knie einziehen, dann absetzen \u2013 nicht fallen lassen.",en:"Pull the leg back right after impact: knee in first, then set down \u2013 don't let it drop."},{tk:!0,de:"H\xE4nde oben lassen, auch beim Treten. Eine fallende Deckung ist der h\xE4ufigste Fehler bei Kicks.",en:"Keep your hands up while kicking. A dropping guard is the most common mistake on kicks."},{tk:!0,de:"Technik vor H\xF6he: Saubere Mittelh\xF6he schl\xE4gt wacklige Kopfh\xF6he. Die H\xF6he kommt mit der Beweglichkeit von selbst.",en:"Technique before height: a clean mid-level kick beats a wobbly head kick. Height follows flexibility."},{tk:!0,de:"Ausatmen beim Treffer: Das spannt die K\xF6rpermitte an und h\xE4lt dich stabil.",en:"Breathe out on impact: it braces your core and keeps you stable."},{tk:"wt",de:"Kicks starten aus der Bewegung, nicht aus dem Stand: Mit federnden Schritten auf dem Fu\xDFballen bleibst du st\xE4ndig schussbereit.",en:"Kicks start from movement, not from standing still: bouncy steps on the balls of your feet keep you ready to fire."},{tk:"wt",de:"Bei Doppelkicks das Knie zwischen den Tritten nicht absetzen \u2013 das spart Zeit und h\xE4lt die Balance.",en:"On double kicks don't set the knee down between kicks \u2013 it saves time and keeps your balance."},{tk:"wt",de:"Im WT-Kampf z\xE4hlen saubere Treffer auf erlaubten Fl\xE4chen: lieber zielgenau als wild.",en:"In WT sparring clean hits on legal target areas count: be accurate rather than wild."},{tk:"wt",de:"Schneller Seitenwechsel (Wechselschritt) \xF6ffnet neue Winkel: Wer die Beinseite wechselt, kann mit Vorder- und Hinterbein gleich gut treten.",en:"A quick switch of leading leg opens new angles: if you can change sides, you kick equally well with front and back leg."},{tk:"itf",de:"Im ITF-Training z\xE4hlen auch Handtechniken: Faust, Handkante und Fingerspitzen geh\xF6ren zur Kombi wie die Kicks.",en:"In ITF training hand techniques count too: fist, knife-hand and fingertips are part of the combination just like kicks."},{tk:"itf",de:"Sinuswelle: K\xF6rper beim Schritt kurz anheben und beim Treffer senken \u2013 das K\xF6rpergewicht geht so in die Technik.",en:"Sine wave: rise slightly while stepping and sink on impact \u2013 this puts your body weight into the technique."},{tk:"itf",de:"In den Tul z\xE4hlen Rhythmus, Blickrichtung, Standtiefe und Genauigkeit \u2013 lieber langsam und exakt als schnell und schlampig.",en:"In the tul rhythm, facing, stance depth and precision count \u2013 slow and exact beats fast and sloppy."},{tk:"itf",de:"Kontrolle vor Kraft: Im ITF-Sparring z\xE4hlt die kontrolliert platzierte Technik, nicht der h\xE4rteste Schlag.",en:"Control before power: in ITF sparring the well-placed, controlled technique counts, not the hardest blow."}],DEFAULT_PROFILE={lang:"de",sport:"kickboxing",disc:"lc",focus:"bal",level:0,
