00],[150,120]]}});function sdCircleSvg(){let e=`<svg class="sketch" viewBox="0 0 240 156" role="img"><defs><marker id="skHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${SK.BRASS}"/></marker></defs><circle cx="120" cy="78" r="58" fill="none" stroke="#2b2f36" stroke-width="2" stroke-dasharray="5 6"/>`;return[0,72,144,216,288].forEach(n=>{const s=n*Math.PI/180,i=120+Math.cos(s)*58,a=78+Math.sin(s)*58;e+=`<ellipse cx="${i.toFixed(1)}" cy="${a.toFixed(1)}" rx="13" ry="9" transform="rotate(${n+90} ${i.toFixed(1)} ${a.toFixed(1)})" fill="${SD_PAL.near}"/><circle cx="${i.toFixed(1)}" cy="${a.toFixed(1)}" r="6.5" fill="${SD_PAL.far}"/>`}),e+=`<ellipse cx="120" cy="78" rx="15" ry="10" fill="${SK.W}"/><circle cx="120" cy="78" r="7.5" fill="#d9d4cc"/>`,e+=skArrow([136,66],[156,48])+skArrow([108,92],[92,108]),e+"</svg>"}function sdSketchSvg(e){if(e==="4.sd.1"||e==="5.sd.1")return sdCircleSvg();const n=SDSK[e];if(!n)return"";const s=n.props||[];let i=`<svg class="sketch" viewBox="0 0 240 156" role="img"><defs><marker id="skHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${SK.BRASS}"/></marker></defs>${skProp(["floor"])}`;return n.parts.forEach(([a,l,r])=>i+=skFigure(l,a==="a"?SD_PAL:null,r)),i+=s.map(skProp).join(""),i+(n.arrow?skArrow(...n.arrow):"")+"</svg>"}const SDTIPS={"1.sd.0":[["Kinn senken, Schultern hochziehen \u2013 das sch\xFCtzt den Hals.","Schritt schr\xE4g zur\xFCck, einen Arm gestreckt nach oben rei\xDFen.","Kr\xE4ftig zur Seite dieses Arms drehen: Die Schulter dr\xFCckt \xFCber die Arme des Angreifers, der Griff geht auf.","Aus der Drehung sofort kontern (Ellbogen oder hintere Gerade), dann Distanz und Deckung."],["Lower the chin, raise the shoulders \u2013 this protects the throat.","Step back at an angle and throw one arm straight up.","Turn hard to the side of that arm: the shoulder rolls over the attacker's arms and breaks the grip.","Counter straight out of the turn (elbow or rear straight), then distance and guard."]],"1.sd.1":[["Kinn senken, mit beiden H\xE4nden kurz an den Fingern ziehen, um Luft zu bekommen.","Einen Arm gestreckt nach oben rei\xDFen.","Zum Angreifer hin drehen \u2013 der Arm wickelt \xFCber seine Arme und l\xF6st den Griff.","Ellbogen oder Haken zum K\xF6rper, dann Distanz schaffen."],["Lower the chin, pull at the fingers with both hands for air.","Throw one arm straight up.","Turn towards the attacker \u2013 the arm wraps over his arms and breaks the grip.","Elbow or hook to the body, then create distance."]],"1.sd.2":[["Kinn zur Schulter, die Schulter auf der Angreiferseite hochziehen.","Den Arm zum Angreifer hin gestreckt nach oben rei\xDFen.","Zum Angreifer drehen, der Arm dr\xFCckt seine Arme vom Hals weg.","Ellbogen oder Faustschlag zum K\xF6rper, dann weg."],["Chin to the shoulder, raise the shoulder on the attacker's side.","Throw the arm nearest the attacker straight up.","Turn into the attacker; the arm drives his arms off the neck.","Elbow or punch to the body, then get away."]],"1.sd.3":[["Mit beiden H\xE4nden die greifende Hand fest auf den Kopf dr\xFCcken \u2013 das nimmt den Zug.","Mit dem Zug gehen statt dagegen.","Konter mit Tritt oder Knie zum K\xF6rper.","Die Hand am Handgelenk nach unten abknicken, l\xF6sen, Distanz."],["Press the grabbing hand onto your head with both hands \u2013 this takes the pull out.","Go with the pull instead of against it.","Counter with a kick or knee to the body.","Bend the hand down at the wrist, release, distance."]],"2.sd.0":[["Kinn einziehen, Kopf zum Angreifer drehen, damit der Hals frei bleibt.","Mit der nahen Hand in den K\xF6rper oder Unterleib schlagen.","Die freie Hand greift \xFCber seine Schulter ins Gesicht und zieht den Kopf nach hinten.","Kopf herausziehen, aufrichten, Konter und Distanz. Von vorne: am Unterarm ziehen, Schl\xE4ge zum K\xF6rper, Kopf zur Seite herausdrehen."],["Tuck the chin, turn the head towards the attacker to keep the throat free.","Strike the body or groin with the near hand.","Reach over his shoulder to his face with the free hand and pull his head back.","Pull the head out, stand up, counter and distance. From the front: pull at the forearm, strikes to the body, twist the head out sideways."]],"2.sd.1":[["Kinn in die Armbeuge dr\xFCcken, mit beiden H\xE4nden den Unterarm nach unten ziehen.","Gewicht tief, H\xFCfte zur Seite schieben.","Ellbogen nach hinten in den K\xF6rper, Ferse auf den Fu\xDF.","Unter dem Arm zur Ellbogenseite herausdrehen, Distanz."],["Press the chin into the crook of the arm, pull the forearm down with both hands.","Drop your weight, shift the hips to the side.","Elbow back into the body, heel onto the foot.","Turn out under the arm towards the elbow side, distance."]],"2.sd.2":[["Sofort die Ellbogen fest an den K\xF6rper pressen, damit der Griff nicht schlie\xDFt.","Gewicht tief, Kopf nicht nach vorne dr\xFCcken lassen.","Ferse auf den Fu\xDF oder Schritt zur Seite, Ellbogen nach hinten.","Nach unten aus dem Griff gleiten und herausdrehen, Distanz."],["Clamp the elbows to the body at once so the hold can't close.","Drop your weight, don't let the head be pushed forward.","Heel onto the foot or step to the side, elbow back.","Slide down out of the hold and turn out, distance."]],"2.sd.3":[["Hand \xF6ffnen, Ellbogen zum Angreifer bringen.","Gegen den Daumen herausdrehen \u2013 das ist die schw\xE4chste Stelle des Griffs.","Bei Griff mit beiden H\xE4nden: eigene Hand von oben greifen und nach oben herausrei\xDFen.","Sofort Konter oder Distanz."],["Open the hand, bring the elbow towards the attacker.","Twist out against the thumb \u2013 the weakest point of the grip.","Two-handed grip: grab your own hand from above and rip it out upwards.","Counter or distance straight away."]],"3.sd.0":[["H\xFCfte zur\xFCck, Gewicht tief \u2013 nicht ausheben lassen.","Die H\xE4nde sind frei: Handballen unter sein Kinn und den Kopf wegdr\xFCcken.","Knie zum K\xF6rper.","Aus der gelockerten Umklammerung l\xF6sen, Distanz. Von hinten: Gewicht tief, Ellbogen nach hinten, Ferse auf den Fu\xDF, herausdrehen."],["Hips back, weight low \u2013 don't get lifted.","Your hands are free: heel of the hand under his chin, push the head away.","Knee to the body.","Break out of the loosened hug, distance. From behind: weight low, elbow back, heel onto the foot, turn out."]],"3.sd.1":[["Gewicht tief, H\xFCfte zur Seite oder zur\xFCck.","H\xE4nde an seine H\xFCfte bringen und Raum schaffen.","Knie oder Hammerfaust in den Unterleib.","Arme nach au\xDFen sprengen, nach unten herausducken, Distanz. Von hinten genauso, mit Ferse auf den Fu\xDF."],["Weight low, hips to the side or back.","Bring the hands to his hips and make space.","Knee or hammer fist to the groin.","Burst the arms outwards, duck out downwards, distance. Same from behind, plus heel onto the foot."]],"3.sd.2":[["Gewicht tief, Stand verbreitern.","Ellbogen in seinen K\xF6rper.","Mit der freien Hand Kopf oder Kinn wegdr\xFCcken.","Herausdrehen, Distanz."],["Weight low, widen the stance.","Elbow into his body.","Push his head or chin away with the free hand.","Turn out, distance."]],"4.sd.0":[["Nach vorne in die Distanz gehen \u2013 nah an seine Hand, nie an die Stockspitze.","Doppelblock mit beiden Unterarmen gegen seinen Arm, nicht gegen den Stock.","Den Stockarm umklammern und kontrollieren, Knie oder Schl\xE4ge zum K\xF6rper.","Stock wegnehmen oder Distanz. Von innen und au\xDFen genauso, beim Stich seitlich aus der Linie und den Arm nach au\xDFen parieren."],["Move forward into the range \u2013 close to his hand, never to the tip of the stick.","Double block with both forearms against his arm, not the stick.","Wrap and control the stick arm, knee or strikes to the body.","Take the stick or create distance. Same from inside and outside; against a thrust, step off the line and parry the arm outwards."]],"4.sd.1":[["St\xE4ndig bewegen, nie stehen bleiben.","Alle Angreifer im Blick halten, keinem l\xE4nger den R\xFCcken zeigen.","Jeden Angriff kurz und klar l\xF6sen: abwehren, kontern, sofort weiter.","Pr\xFCfer achten auf \xDCbersicht und Kontrolle, nicht auf H\xE4rte."],["Keep moving, never stand still.","Keep all attackers in view, never turn your back for long.","Solve each attack short and clean: defend, counter, move on.","Examiners look for awareness and control, not hardness."]],"5.sd.0":[["H\xE4nde vorne, Distanz halten.","Beim Stich seitlich aus der Linie, mit der Hand am Unterarm parieren.","Messerarm mit beiden H\xE4nden kontrollieren, Klinge vom K\xF6rper weg.","Konter mit Knie oder Tritt, Entwaffnen oder Distanz. Von oben, innen, au\xDFen: Doppelblock am Unterarm, dann Arm kontrollieren."],["Hands up front, keep your distance.","Against a thrust, step off the line and parry the forearm with your hand.","Control the knife arm with both hands, blade away from you.","Counter with knee or kick, disarm or create distance. Overhead, inside, outside: double block on the forearm, then control the arm."]],"5.sd.1":[["St\xE4ndig bewegen, nie stehen bleiben.","Alle Angreifer im Blick halten, keinem l\xE4nger den R\xFCcken zeigen.","Jeden Angriff kurz und klar l\xF6sen: abwehren, kontern, sofort weiter.","Pr\xFCfer achten auf \xDCbersicht und Kontrolle, nicht auf H\xE4rte."],["Keep moving, never stand still.","Keep all attackers in view, never turn your back for long.","Solve each attack short and clean: defend, counter, move on.","Examiners look for awareness and control, not hardness."]],"6.sd.0":[["Kinn runter, mit den H\xE4nden an seinen Unterarmen ziehen, um Luft zu bekommen.","Einen seiner Arme mit deinem Arm klemmen, den Fu\xDF auf derselben Seite neben seinem Fu\xDF aufstellen.","H\xFCfte explosiv hoch (Br\xFCcke) und \xFCber die geklemmte Seite rollen.","Oben ankommen, aufstehen, Distanz."],["Chin down, pull at his forearms with your hands for air.","Trap one of his arms with yours, plant the foot on the same side next to his foot.","Drive the hips up explosively (bridge) and roll over the trapped side.","Come out on top, stand up, distance."]],"6.sd.1":[["Auf der H\xFCfte drehen, die F\xFC\xDFe bleiben zum Angreifer.","Ist er zu nah: Doppelblock mit den Unterarmen \xFCber dem Kopf.","Tritt gegen Knie oder Schienbein seines vorderen Beins.","Technisch aufstehen: eine Hand hinten aufst\xFCtzen, Bein durchziehen, Deckung oben, Distanz."],["Spin on the hip, keep the feet towards the attacker.","If he's too close: double forearm block above the head.","Kick his lead knee or shin.","Technical stand-up: post one hand behind, pull the leg through, guard up, distance."]],"6.sd.2":[["Unterarme sch\xFCtzen den Kopf, F\xFC\xDFe zum Angreifer.","Den tretenden Fu\xDF abfangen und festklammern oder sein Standbein treten.","Ihn mit dem Bein aus dem Gleichgewicht bringen.","Technisch aufstehen, Deckung oben, Distanz."],["Forearms cover the head, feet towards the attacker.","Catch and trap the kicking leg, or kick his standing leg.","Use your legs to take his balance.","Technical stand-up, guard up, distance."]]};function sdInfoHtml(e){const n=SDTIPS[e],s=S.profile.lang==="de"?0:1,i=sdSketchSvg(e);return`${i?`<div class="skwrap">${i}</div><span class="sub">${t("sdLegend")}</span>`:""}<div class="lab">${t("sdSteps")}</div><ol class="cues">${n[s].map(a=>`<li>${esc(a)}</li>`).join("")}</ol><div class="note warn">${t("sdSafe")}</div><span class="sub">${t("sdNote")}</span>`}const THEORY={notwehr:{de:{t:"Notwehr",cards:[["Das Gesetz","\xA7 32 StGB: Wer eine Tat begeht, die durch Notwehr geboten ist, handelt nicht rechtswidrig. Notwehr ist die Verteidigung, die erforderlich ist, um einen gegenw\xE4rtigen rechtswidrigen Angriff von sich oder einem anderen abzuwenden."],["Angriff, gegenw\xE4rtig, rechtswidrig","Ein Angriff ist die Bedrohung deines K\xF6rpers, deiner Freiheit oder deines Eigentums durch einen Menschen. Gegenw\xE4rtig hei\xDFt: Er steht unmittelbar bevor, l\xE4uft gerade oder dauert noch an. Ist er vorbei, ist ein Gegenschlag keine Notwehr mehr, sondern selbst eine Straftat. Rechtswidrig hei\xDFt: Der Angreifer hat kein Recht dazu."],["Erforderlich","Erlaubt ist die Verteidigung, die den Angriff sicher beendet. Gibt es mehrere gleich sichere Mittel, musst du das mildeste w\xE4hlen. Wer Kampfsport kann, hat oft mildere wirksame Mittel wie Befreien oder Wegsto\xDFen, und das wird ber\xFCcksichtigt."],["Nothilfe","Notwehr gilt auch, wenn jemand anderes angegriffen wird: \u201Evon sich oder einem anderen\u201C. Das nennt man Nothilfe."],["Grenzen","Eingeschr\xE4nkt ist Notwehr zum Beispiel bei Angriffen von Kindern oder erkennbar Betrunkenen, bei einem krassen Missverh\xE4ltnis zwischen Angriff und Verteidigung oder wenn du den Angriff selbst provoziert hast. Dann gilt: ausweichen, Abstand, Hilfe holen."],["Notwehrexzess (\xA7 33 StGB)","Wer die Grenzen der Notwehr aus Verwirrung, Furcht oder Schrecken \xFCberschreitet, wird nicht bestraft. Aus Wut oder Rache gilt das nicht."],["In der Praxis","Weggehen, Abstand halten, laut werden und Hilfe holen (110) ist fast immer die beste L\xF6sung. Das ist eine Lernhilfe f\xFCr die Pr\xFCfung, keine Rechtsberatung."]],quiz:[["Nach einem Schlag l\xE4uft der Angreifer weg. Darfst du hinterher und zur\xFCckschlagen?",["Ja, das ist Notwehr","Nein, der Angriff ist nicht mehr gegenw\xE4rtig","Ja, wenn der Schlag wehgetan hat"],1,"Notwehr gibt es nur gegen einen gegenw\xE4rtigen Angriff. Ein Racheschlag ist selbst strafbar."],["Was bedeutet \u201Eerforderlich\u201C?",["Jede Verteidigung ist erlaubt","Das mildeste von mehreren gleich sicheren Mitteln","Nur Abwehr, nie ein Gegenschlag"],1,"Die Verteidigung muss den Angriff sicher beenden, aber unter gleich sicheren Mitteln das mildeste sein."],["Ein Freund wird angegriffen. Darfst du eingreifen?",["Ja, das ist Nothilfe","Nein, Notwehr gilt nur f\xFCr dich selbst","Nur wenn er dich darum bittet"],0,"\xA7 32 StGB: Angriff \u201Evon sich oder einem anderen\u201C."],["Wann bleibt ein \xDCberschreiten der Notwehr straffrei?",["Aus Wut","Aus Furcht oder Schrecken","Wenn der Angreifer st\xE4rker war"],1,"\xA7 33 StGB nennt Verwirrung, Furcht oder Schrecken, nicht Wut oder Rache."],["Wo ist die Notwehr geregelt?",["\xA7 32 StGB","\xA7 823 BGB","Grundgesetz Artikel 2"],0,"Notwehr steht in \xA7 32 des Strafgesetzbuchs, der Notwehrexzess in \xA7 33."]]},en:{t:"Self-defence law (Germany)",cards:[["The law","\xA7 32 of the German Criminal Code: an act required by self-defence is not unlawful. Self-defence is the defence necessary to avert a present unlawful attack on yourself or another person."],["Attack, present, unlawful","An attack is a threat by a person to your body, freedom or property. Present means it's imminent, happening or still ongoing. Once it's over, hitting back is no longer self-defence but an offence itself. Unlawful means the attacker has no right to do it."],["Necessary","You may use the defence that reliably ends the attack. Of several equally safe means you must choose the mildest. Trained fighters often have milder effective options such as releasing or pushing away, and that is taken into account."],["Defending others","Self-defence also covers attacks on someone else: \u201Cyourself or another person\u201D."],["Limits","Self-defence is restricted, for example, against children or obviously drunk people, when attack and defence are grossly out of proportion, or if you provoked the attack. Then: step away, keep distance, get help."],["Excessive self-defence (\xA7 33)","Exceeding the limits out of confusion, fear or shock is not punished. Out of anger or revenge it is."],["In practice","Walking away, keeping distance, shouting and calling for help (110 in Germany) is almost always best. This is a study aid for the grading, not legal advice."]],quiz:[["After a punch the attacker runs off. May you chase him and hit back?",["Yes, that's self-defence","No, the attack is no longer present","Yes, if the punch hurt"],1,"Self-defence only applies to a present attack. A revenge punch is an offence itself."],["What does \u201Cnecessary\u201D mean?",["Any defence is allowed","The mildest of several equally safe means","Only blocking, never a counter"],1,"The defence must reliably end the attack, but be the mildest of equally safe options."],["A friend is attacked. May you step in?",["Yes, defending others is covered","No, it only applies to yourself","Only if he asks you"],0,"\xA7 32: an attack on \u201Cyourself or another person\u201D."],["When does exceeding self-defence go unpunished?",["Out of anger","Out of fear or shock","If the attacker was stronger"],1,"\xA7 33 names confusion, fear or shock, not anger or revenge."],["Where is self-defence regulated in Germany?",["\xA7 32 Criminal Code (StGB)","\xA7 823 Civil Code","Basic Law Article 2"],0,"Self-defence is \xA7 32 StGB, excessive self-defence \xA7 33."]]}},pf:{de:{t:"Regelkunde Point Fighting",cards:[["Prinzip","Kontrollierte, schnelle Techniken auf erlaubte Ziele. Wie beim Fechten z\xE4hlt der erste Treffer: Nach jeder Wertung unterbricht der Hauptkampfrichter den Kampf."],["Punkte","Schlag (auch gesprungen): 1 \xB7 Tritt zum K\xF6rper: 1 \xB7 Fu\xDFfeger: 1 \xB7 Tritt zum Kopf: 2 \xB7 gesprungener Tritt zum K\xF6rper: 2 \xB7 gesprungener Tritt zum Kopf: 3."],["Trefferfl\xE4chen","Kopf vorne und seitlich, Hinterkopf nur bei einem Angriff von vorne. Oberk\xF6rper vorne und seitlich oberhalb des G\xFCrtels. Fu\xDFfeger nur Fu\xDF gegen Fu\xDF bis zur Kn\xF6chelh\xF6he."],["Verboten","Angriffe auf Hals, R\xFCcken, Beine und unterhalb der G\xFCrtellinie, Knie, Ellbogen, Kopfsto\xDF, W\xFCrfe, Klammern, blinde Techniken, der gedrehte Backfist, Angriffe auf einen fallenden oder liegenden Gegner und Weiterk\xE4mpfen nach \u201EStop\u201C."],["Zeit und Kampfende","Landesebene 2 Runden \xE0 2 min (1 min Pause) oder \xE0 1,5 min (30 s Pause), Bundesfinale und international 3 \xD7 2 min. Die Zeit l\xE4uft bei Wertungen weiter. Bei 6 bzw. 10 Punkten Vorsprung endet der Kampf vorzeitig. Jeder Exit gibt einen Minuspunkt, der vierte f\xFChrt zur Disqualifikation."]],quiz:[["Wie viele Punkte gibt ein Tritt zum Kopf?",["1","2","3"],1,"Tritt zum Kopf: 2 Punkte, gesprungen 3."],["Was passiert nach einem Wertungstreffer?",["Es wird weitergek\xE4mpft","Der Hauptkampfrichter unterbricht","Die Runde endet"],1,"Point Fighting ist Stop-and-go: Nach jeder Wertung wird unterbrochen."],["Ist der gedrehte Backfist erlaubt?",["Ja","Nein","Nur zum K\xF6rper"],1,"Der gedrehte Backfist (spinning backfist) ist im Point Fighting verboten."],["Wohin darf ein Fu\xDFfeger gehen?",["Gegen den Fu\xDF bis Kn\xF6chelh\xF6he","Gegen die Wade","Gegen das Knie"],0,"Nur Fu\xDF gegen Fu\xDF bis zur Kn\xF6chelh\xF6he."],["Was gibt ein gesprungener Tritt zum Kopf?",["2 Punkte","3 Punkte","4 Punkte"],1,"Das ist die h\xF6chste Einzelwertung: 3 Punkte."]]},en:{t:"Point fighting rules",cards:[["Principle","Controlled, fast techniques to legal targets. As in fencing the first hit counts: after every score the referee stops the fight."],["Points","Punch (also jumping): 1 \xB7 kick to the body: 1 \xB7 foot sweep: 1 \xB7 kick to the head: 2 \xB7 jumping kick to the body: 2 \xB7 jumping kick to the head: 3."],["Targets","Head front and side, back of the head only when attacked from the front. Torso front and side above the belt. Foot sweeps only foot to foot up to the ankle."],["Forbidden","Attacks to the throat, back, legs and below the belt, knees, elbows, headbutts, throws, clinching, blind techniques, the spinning backfist, attacking a falling or downed opponent and fighting on after \u201Cstop\u201D."],["Time and end","State level 2 rounds of 2 min (1 min break) or 1.5 min (30 s break), national finals and international 3 \xD7 2 min. The clock keeps running during scoring. A lead of 6 or 10 points ends the fight early. Each exit costs a minus point, the fourth means disqualification."]],quiz:[["How many points is a kick to the head?",["1","2","3"],1,"Kick to the head: 2 points, jumping 3."],["What happens after a score?",["The fight goes on","The referee stops the fight","The round ends"],1,"Point fighting is stop-and-go: every score stops the fight."],["Is the spinning backfist allowed?",["Yes","No","Only to the body"],1,"The spinning backfist is forbidden in point fighting."],["Where may a foot sweep go?",["Foot to foot up to the ankle","To the calf","To the knee"],0,"Only foot to foot up to the ankle."],["What does a jumping kick to the head score?",["2 points","3 points","4 points"],1,"The highest single score: 3 points."]]}},lkvk:{de:{t:"Regelkunde Leicht- und Vollkontakt",cards:[["Leichtkontakt: Prinzip","Durchk\xE4mpfen ohne Unterbrechung nach Treffern. Schnelle, kraftvolle Techniken, aber nur leichter Kontakt. Hand- und Fu\xDFtechniken sollen ausgeglichen eingesetzt werden. Leichtkontakt gilt als Vorstufe zum Full Contact."],["Leichtkontakt: Wertung","Drei Seitenrichter werten elektronisch. Punkte wie im Point Fighting: Schlag, Tritt zum K\xF6rper, Fu\xDFfeger 1 \xB7 Tritt zum Kopf und gesprungener Tritt zum K\xF6rper 2 \xB7 gesprungener Tritt zum Kopf 3. Bei 15 Punkten Vorsprung endet der Kampf. Jeder Exit gibt einen Minuspunkt, der vierte f\xFChrt zur Disqualifikation."],["Leichtkontakt: Zeit","Landesebene 2 \xD7 2 min oder 2 \xD7 1,5 min, Bundesfinale und international 3 \xD7 2 min mit 1 min Pause. Kampffl\xE4che bei Meisterschaften 7 \xD7 7 m."],["Vollkontakt: Prinzip","Im Ring, Schl\xE4ge und Tritte mit voller Kraft, ein K. o. ist m\xF6glich. Erlaubt sind Jab, Punch, Haken, Aufw\xE4rtshaken, Tritte auch mit dem Schienbein und Fu\xDFfeger. Treffer nur an Kopf und Oberk\xF6rper oberhalb des G\xFCrtels, keine Tritte gegen die Beine."],["Vollkontakt: Regeln","3 Runden \xE0 2 min, 1 min Pause. Pro Runde mindestens 6 Kicks, ein Kickz\xE4hler z\xE4hlt mit. Wer weniger tritt, bekommt einen Minuspunkt, der 3 Trefferpunkten entspricht. Kopfschutz, 10-oz-Handschuhe, Mund-, Schienbein-, Fu\xDF- und Tiefschutz sind Pflicht."]],quiz:[["Wird im Leichtkontakt nach einem Treffer unterbrochen?",["Ja, wie im Point Fighting","Nein, es wird durchgek\xE4mpft","Nur bei Kopftreffern"],1,"Leichtkontakt ist ein Continuous Fight."],["Ab welchem Vorsprung endet ein Leichtkontakt-Kampf vorzeitig?",["6 Punkte","10 Punkte","15 Punkte"],2,"Sieg durch \xDCberlegenheit bei 15 Punkten Vorsprung."],["Wie viele Kicks pro Runde sind im Vollkontakt mindestens gefordert?",["4","6","8"],1,"Mindestens 6 Kicks, sonst gibt es einen Minuspunkt."],["Darf man im Vollkontakt gegen den Oberschenkel treten?",["Ja","Nein, nur Kopf und Oberk\xF6rper","Nur mit dem Schienbein"],1,"Tritte gegen die Beine gibt es erst im Low Kick und K1. Im Vollkontakt ist am Bein nur der Fu\xDFfeger erlaubt."],["Wie lang ist eine Vollkontakt-Runde?",["1,5 min","2 min","3 min"],1,"3 Runden \xE0 2 min mit 1 min Pause."]]},en:{t:"Light & full contact rules",cards:[["Light contact: principle","Continuous fighting without stops after scores. Fast, powerful techniques but only light contact. Hands and kicks should be balanced. Light contact is the step before full contact."],["Light contact: scoring","Three judges score electronically. Points as in point fighting: punch, body kick, foot sweep 1 \xB7 head kick and jumping body kick 2 \xB7 jumping head kick 3. A 15-point lead ends the fight. Each exit costs a minus point, the fourth means disqualification."],["Light contact: time","State level 2 \xD7 2 min or 2 \xD7 1.5 min, national finals and international 3 \xD7 2 min with 1 min breaks. Area at championships 7 \xD7 7 m."],["Full contact: principle","In the ring, punches and kicks with full power, knockouts are possible. Allowed: jab, punch, hook, uppercut, kicks including with the shin, and foot sweeps. Targets only head and torso above the belt, no kicks to the legs."],["Full contact: rules","3 rounds of 2 min, 1 min break. At least 6 kicks per round, counted by a kick judge. Fewer kicks cost a minus point worth 3 scoring points. Headguard, 10 oz gloves, mouth, shin, foot and groin guard are mandatory."]],quiz:[["Is light contact stopped after a score?",["Yes, like point fighting","No, it's continuous","Only for head shots"],1,"Light contact is a continuous fight."],["What lead ends a light contact bout early?",["6 points","10 points","15 points"],2,"Win by superiority with a 15-point lead."],["How many kicks per round are required in full contact?",["4","6","8"],1,"At least 6 kicks, otherwise a minus point."],["May you kick the thigh in full contact?",["Yes","No, only head and torso","Only with the shin"],1,"Leg kicks come with low kick and K1. In full contact only the foot sweep may go to the leg."],["How long is a full contact round?",["1.5 min","2 min","3 min"],1,"3 rounds of 2 min with 1 min breaks."]]}},formen:{de:{t:"Regelkunde Formen",cards:[["Was sind Formen?","Eine Vorf\xFChrung ohne Gegner: eine selbst gestaltete Abfolge von Techniken, Tritten und Bewegungen, die wie ein Kampf gegen imagin\xE4re Gegner wirkt."],["Musikformen","Vorf\xFChrung zur Musik, unterteilt in Hard Style (kraftvoll, karate\xE4hnlich), Soft Style (flie\xDFend, wushu\xE4hnlich) und Creative Forms mit akrobatischen Elementen. Jede Variante gibt es auch mit Waffen."],["Kreativformen","Bei WAKO Deutschland zus\xE4tzlich: Kreativformen und Kreativformen mit Waffen, ohne Musik und ohne Zeitlimit. Ein Starter darf pro Turnier h\xF6chstens vier Kategorien aus Musik- und Kreativformen belegen."],["Bewertung","Punkte von 7,0 bis 10,0. Kriterien sind Basics (Stellungen, Hand- und Fu\xDFtechniken, Blocks), Gleichgewicht und Fokus, Schwierigkeit (Spr\xFCnge, Drehungen, Kombinationen) und Darbietung. In Waffenkategorien z\xE4hlt die Waffenhandhabung zuerst."]],quiz:[["In welchem Bereich liegen die Wertungen bei Formen?",["0\u201310","5,0\u201310,0","7,0\u201310,0"],2,"Bewertet wird von 7,0 bis 10,0 Punkten."],["Werden Kreativformen mit Musik gezeigt?",["Ja, immer","Nein, ohne Musik","Nur mit Waffen"],1,"Kreativformen laufen ohne Musik, Musikformen mit."],["Welcher Stil ist flie\xDFend und wushu\xE4hnlich?",["Hard Style","Soft Style","Creative"],1,"Soft Style ist flie\xDFend, Hard Style kraftvoll und karate\xE4hnlich."],["Was z\xE4hlt in Waffenkategorien zuerst?",["Die Musik","Die Waffenhandhabung","Die Kleidung"],1,"Die Waffenhandhabung ist dort das erste Kriterium."]]},en:{t:"Forms rules",cards:[["What are forms?","A performance without an opponent: a self-designed sequence of techniques, kicks and movements, like a fight against imaginary opponents."],["Musical forms","Performed to music, divided into hard style (powerful, karate-like), soft style (flowing, wushu-like) and creative forms with acrobatics. Each also exists with weapons."],["Creative forms","WAKO Germany also has creative forms with and without weapons, performed without music and without a time limit. A competitor may enter at most four musical and creative forms categories per tournament."],["Judging","Scores from 7.0 to 10.0. Criteria are basics (stances, hand and foot techniques, blocks), balance and focus, difficulty (jumps, spins, combinations) and presentation. In weapon categories weapon handling comes first."]],quiz:[["What is the scoring range for forms?",["0\u201310","5.0\u201310.0","7.0\u201310.0"],2,"Forms are scored from 7.0 to 10.0."],["Are creative forms performed to music?",["Yes, always","No, without music","Only with weapons"],1,"Creative forms are performed without music, musical forms with."],["Which style is flowing and wushu-like?",["Hard style","Soft style","Creative"],1,"Soft style is flowing, hard style powerful and karate-like."],["What comes first in weapon categories?",["The music","Weapon handling","The outfit"],1,"Weapon handling is the first criterion there."]]}},geschichte:{de:{t:"Geschichte des Kickboxens",cards:[["Wurzeln","In Japan entstand in den 1960er-Jahren das Kickboxen aus Karate und Muay Thai. In den USA wurde Anfang der 1970er Full Contact Karate popul\xE4r: Karateka k\xE4mpften mit Boxhandschuhen und vollem Kontakt. 1974 fand in Los Angeles eine erste Weltmeisterschaft im Full Contact statt."],["Gr\xFCndung der WAKO","Die WAKO (World Association of Kickboxing Organizations) wurde am 26. Februar 1977 in Berlin gegr\xFCndet. Gr\xFCnder war Georg F. Br\xFCckner, die Idee eines weltweiten Verbands teilte er mit Mike Anderson. 1978 folgte die erste Weltmeisterschaft mit 110 K\xE4mpfern aus 18 L\xE4ndern."],["Olympische Anerkennung","2018 erkannte das IOC die WAKO vorl\xE4ufig an, im Juli 2021 vollst\xE4ndig. Heute vertritt die WAKO rund 130 Nationen. Kickboxen geh\xF6rt zu den World Games und den European Games."],["Disziplinen","Tatami-Disziplinen: Point Fighting, Light Contact, Kick Light und Formen. Ring-Disziplinen: Full Contact, Low Kick und K1. In Deutschland ist die WAKO Deutschland (Bundesfachverband f\xFCr Kickboxen) der Dachverband."]],quiz:[["Wann wurde die WAKO gegr\xFCndet?",["1974","1977","1985"],1,"Am 26. Februar 1977."],["In welcher Stadt wurde die WAKO gegr\xFCndet?",["Los Angeles","Tokio","Berlin"],2,"Gr\xFCndungsort war Berlin."],["Wer gilt als Gr\xFCnder der WAKO?",["Georg F. Br\xFCckner","Bruce Lee","Benny Urquidez"],0,"Georg F. Br\xFCckner, gemeinsam mit der Idee von Mike Anderson."],["Seit wann ist die WAKO vom IOC vollst\xE4ndig anerkannt?",["2012","2018","2021"],2,"Vorl\xE4ufig 2018, vollst\xE4ndig im Juli 2021."],["Welche Disziplin ist eine Ring-Disziplin?",["Point Fighting","Light Contact","K1"],2,"K1, Low Kick und Full Contact werden im Ring gek\xE4mpft."]]},en:{t:"History of kickboxing",cards:[["Roots","In Japan, kickboxing grew out of karate and Muay Thai in the 1960s. In the USA full contact karate became popular in the early 1970s: karateka fought with boxing gloves and full contact. A first full contact world championship was held in Los Angeles in 1974."],["WAKO is founded","WAKO (World Association of Kickboxing Organizations) was founded on 26 February 1977 in Berlin. Its founder was Georg F. Br\xFCckner, who shared the vision of a world body with Mike Anderson. The first world championships followed in 1978 with 110 fighters from 18 countries."],["Olympic recognition","The IOC recognised WAKO provisionally in 2018 and fully in July 2021. Today WAKO represents about 130 nations. Kickboxing is part of the World Games and the European Games."],["Disciplines","Tatami: point fighting, light contact, kick light and forms. Ring: full contact, low kick and K1. In Germany the umbrella body is WAKO Deutschland (Bundesfachverband f\xFCr Kickboxen)."]],quiz:[["When was WAKO founded?",["1974","1977","1985"],1,"On 26 February 1977."],["In which city was WAKO founded?",["Los Angeles","Tokyo","Berlin"],2,"It was founded in Berlin."],["Who is considered WAKO's founder?",["Georg F. Br\xFCckner","Bruce Lee","Benny Urquidez"],0,"Georg F. Br\xFCckner, together with Mike Anderson's vision."],["Since when has WAKO had full IOC recognition?",["2012","2018","2021"],2,"Provisional in 2018, full in July 2021."],["Which discipline is fought in the ring?",["Point fighting","Light contact","K1"],2,"K1, low kick and full contact are ring disciplines."]]}},lehre:{de:{t:"Lehrbeispiel Technikvermittlung",cards:[["Aufbau","Ein bew\xE4hrter Ablauf: Ziel nennen, vormachen, kurz erkl\xE4ren, \xFCben lassen, korrigieren, anwenden. Plane 5\u201310 Minuten f\xFCr eine Technik."],["Vormachen und erkl\xE4ren","Erst die ganze Technik in normalem Tempo zeigen, dann langsam und von zwei Seiten. Nur 1\u20132 Kernpunkte nennen, zum Beispiel \u201EH\xFCfte dreht mit\u201C oder \u201EHand sofort zur\xFCck zur Deckung\u201C."],["\xDCben lassen","Vom Leichten zum Schweren: erst in der Luft, dann an der Pratze, dann mit Partner. Bei komplexen Techniken in Teilen \xFCben und dann zusammensetzen."],["Korrigieren","Immer nur einen Fehler auf einmal, den wichtigsten zuerst. Positiv formulieren (\u201EEllbogen h\xF6her\u201C statt \u201Enicht so tief\u201C) und zwischendurch loben."],["Anwenden","Die Technik in eine Kombination oder eine kleine Partneraufgabe einbauen, damit sie im Sparring ankommt. Zum Schluss kurz zusammenfassen."]],quiz:[["Wie viele Kernpunkte nennst du beim Erkl\xE4ren?",["1\u20132","5\u20136","Alle, die es gibt"],0,"Wenige Kernpunkte bleiben h\xE4ngen, zu viele verwirren."],["Wie korrigierst du am besten?",["Alle Fehler auf einmal","Einen Fehler nach dem anderen","Gar nicht, \xDCbung macht den Meister"],1,"Den wichtigsten Fehler zuerst, dann den n\xE4chsten."],["Was kommt nach dem Vormachen?",["Sofort Sparring","Kurz erkl\xE4ren und \xFCben lassen","Die Theorie abfragen"],1,"Vormachen, kurz erkl\xE4ren, dann \xFCben lassen."]]},en:{t:"Teaching a technique",cards:[["Structure","A proven sequence: state the goal, demonstrate, explain briefly, let them practise, correct, apply. Plan 5\u201310 minutes per technique."],["Demonstrate and explain","Show the whole technique at normal speed first, then slowly and from two sides. Give only 1\u20132 key points, for example \u201Cthe hip turns with it\u201D or \u201Chand straight back to guard\u201D."],["Practise","From easy to hard: in the air first, then on pads, then with a partner. Break complex techniques into parts, then put them together."],["Correct","One mistake at a time, the most important first. Phrase it positively (\u201Celbow higher\u201D rather than \u201Cnot so low\u201D) and praise in between."],["Apply","Build the technique into a combination or a small partner task so it reaches sparring. Sum up briefly at the end."]],quiz:[["How many key points do you give when explaining?",["1\u20132","5\u20136","Every one there is"],0,"Few key points stick, too many confuse."],["How do you correct best?",["All mistakes at once","One mistake at a time","Not at all, practice makes perfect"],1,"The most important mistake first, then the next."],["What comes after demonstrating?",["Straight to sparring","Explain briefly and let them practise","Test the theory"],1,"De
