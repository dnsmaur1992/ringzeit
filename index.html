<h3>${esc(l.t)}</h3><p class="sub">${esc(l.sub)}</p>${s(l.secs)}<p class="sub gsrc">${t("src")}: ${esc(l.src)}</p>${(l.links||[]).map(o=>`<a class="vlink" href="${o.u}" target="_blank" rel="noopener">\u25B6 ${esc(o[S.profile.lang==="de"?"de":"en"])}</a>`).join("")}${l.link?`<a class="vlink" href="${WKB_URL}" target="_blank" rel="noopener">\u25B6 ${S.profile.lang==="de"?"DBV-Wettkampfbestimmungen (PDF, Stand 01.09.2026)":"DBV competition rules (PDF, version 01.09.2026)"}</a>`:""}<div class="acts2"><button type="button" class="btn sec" data-sx="close">${t("close")}</button><button type="button" class="btn" data-guide="${r.k}">${n.nextRead}</button></div>`}return e.id==="care"?`<h3>${n.care}</h3>${s(guideSecs("care"))}<div class="acts2"><button type="button" class="btn" data-sx="close">${t("close")}</button></div>`:`<h3>${n.aid}</h3>${s(guideSecs("aid"))}<div class="note warn">${n.aidNote}</div><div class="acts2"><button type="button" class="btn" data-sx="close">${t("close")}</button></div>`}const READS=[{k:"myths",ico:'<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6"/><path d="M12 16.6h.01"/>',de:{t:"Mythen-Check",sub:"Muskelkater, Dehnen, Schwitzen \u2013 was stimmt wirklich?",secs:[["\u201EMuskelkater zeigt, dass das Training gut war.\u201C \u2013 Falsch","Muskelkater kommt vor allem von ungewohnter Belastung, besonders beim Abbremsen von Bewegungen. Wer regelm\xE4\xDFig trainiert, bekommt weniger davon \u2013 und wird trotzdem st\xE4rker. Er ist kein Ma\xDFstab f\xFCr Qualit\xE4t."],["\u201EDehnen vorher sch\xFCtzt vor Verletzungen.\u201C \u2013 Kaum belegt","Langes, ruhiges Dehnen direkt vor dem Training kann die Schnellkraft sogar kurz senken. Besser ist ein dynamisches Aufw\xE4rmen mit Bewegungen aus dem Training. Ruhiges Dehnen passt danach oder in eine eigene Mobility-Einheit."],["\u201ESchwitzen verbrennt Fett.\u201C \u2013 Falsch","Schwei\xDF k\xFChlt den K\xF6rper. Was nach dem Training auf der Waage fehlt, ist Wasser \u2013 nach dem Trinken ist es wieder da."],["\u201EBauchtraining macht einen flachen Bauch.\u201C \u2013 Falsch","Fett l\xE4sst sich nicht gezielt an einer Stelle abbauen. Rumpftraining lohnt sich trotzdem: Ein starker Rumpf \xFCbertr\xE4gt die Kraft aus den Beinen in Schlag und Tritt und h\xE4lt dich stabil."],["\u201EViel hilft viel.\u201C \u2013 Falsch","St\xE4rker wirst du in der Erholung, nicht im Training selbst. Wer ohne Pausen immer mehr macht, wird langsamer, \xF6fter krank und verletzt sich leichter. Deshalb plant Ringzeit Ruhetage und Entlastungswochen ein."],["\u201EHanteln machen langsam.\u201C \u2013 Falsch","Richtig dosiertes Krafttraining macht Schl\xE4ge und Tritte eher schneller, weil du mehr Kraft in kurzer Zeit abrufen kannst. Entscheidend ist, die Technik weiter zu trainieren."]],src:"Trainingslehre und Sportmedizin (allgemeiner Konsens)"},en:{t:"Myth check",sub:"Soreness, stretching, sweating \u2013 what's actually true?",secs:[["\u201CSore muscles mean it was a good workout.\u201D \u2013 False","Soreness mostly comes from unfamiliar loads, especially when muscles brake a movement. If you train regularly you get less of it \u2013 and still get stronger. It is no measure of quality."],["\u201CStretching beforehand prevents injuries.\u201D \u2013 Hardly proven","Long, static stretching right before training can even briefly reduce explosive power. A dynamic warm-up with movements from the session works better. Calm stretching fits afterwards or in a separate mobility session."],["\u201CSweating burns fat.\u201D \u2013 False","Sweat cools the body. What's missing on the scale after training is water \u2013 it's back once you drink."],["\u201CAb workouts give you a flat stomach.\u201D \u2013 False","You can't burn fat from one specific spot. Core training is still worth it: a strong trunk transfers power from the legs into punches and kicks and keeps you stable."],["\u201CMore is always better.\u201D \u2013 False","You get stronger during recovery, not during training itself. Doing more and more without breaks makes you slower, ill more often and more prone to injury. That's why Ringzeit plans rest days and deload weeks."],["\u201CWeights make you slow.\u201D \u2013 False","Well-dosed strength training tends to make punches and kicks faster, because you can produce more force in a short time. What matters is that you keep training technique."]],src:"Training theory and sports medicine (general consensus)"}},{k:"round",ico:'<path d="M3 12h3.5l2-5 3.5 10 2.5-7 1.5 2H21"/>',de:{t:"Was passiert in einer Runde?",sub:"Warum die zweite Minute h\xE4rter ist als die erste",secs:[["Die ersten Sekunden","F\xFCr explosive Aktionen nutzt der Muskel einen kleinen Sofort-Speicher (Kreatinphosphat). Er reicht nur f\xFCr Sekunden Vollgas, f\xFCllt sich in kurzen Pausen aber schnell wieder auf \u2013 deshalb wirken Finten und kurze Bewegungspausen."],["Ab der zweiten Minute","Dann kommt mehr Energie aus dem schnellen Zuckerabbau ohne Sauerstoff. Dabei sammelt sich S\xE4ure im Muskel an: Arme und Beine werden schwer, die Deckung sinkt. Das ist der Moment, in dem gute Kondition K\xE4mpfe entscheidet."],["Laktat ist kein Abfall","Laktat wurde lange als Ursache f\xFCr M\xFCdigkeit und Muskelkater gesehen. Heute wei\xDF man: Herz und Muskeln verwerten es als Brennstoff. M\xFCde machen vor allem die S\xE4ure und der leere Sofort-Speicher."],["Der Puls","In einer harten Runde steigt er bis nahe ans Maximum. Wie fit du bist, zeigt sich in der Pause: Je schneller er in der ersten Minute f\xE4llt, desto besser erholst du dich."],["Warum Grundlagenausdauer z\xE4hlt","Auch wenn eine Runde kurz und intensiv ist: Ein gutes Ausdauer-Fundament beschleunigt die Erholung in der Pause und zwischen den K\xE4mpfen eines Turniertags. Deshalb stehen auch ruhige L\xE4ufe und Intervalle im Plan."]],src:"Sportphysiologie (allgemeiner Konsens)"},en:{t:"What happens in a round?",sub:"Why the second minute is harder than the first",secs:[["The first seconds","For explosive actions the muscle uses a small instant store (creatine phosphate). It only lasts for seconds of all-out effort but refills quickly in short breaks \u2013 that's why feints and short movement pauses work."],["From the second minute","Then more energy comes from fast sugar breakdown without oxygen. Acid builds up in the muscle: arms and legs get heavy, the guard drops. This is where good conditioning decides fights."],["Lactate is not waste","Lactate was long blamed for fatigue and soreness. Today we know heart and muscles use it as fuel. What tires you is mainly the acid and the empty instant store."],["Your pulse","In a hard round it climbs close to your maximum. Fitness shows in the break: the faster it drops in the first minute, the better you recover."],["Why base endurance matters","Even though a round is short and intense, a good endurance base speeds up recovery in the break and between the bouts of a tournament day. That's why easy runs and intervals are in the plan too."]],src:"Exercise physiology (general consensus)"}},{k:"shin",only:"k",ico:'<path d="M10 3c-.6 4-.6 8 0 12l-1.5 5h7l-1.5-5c.6-4 .6-8 0-12"/><path d="M9.6 8h4.8"/>',de:{t:"Warum Schienbeine h\xE4rter werden",sub:"Was beim Abh\xE4rten passiert \u2013 und was Legende ist",secs:[["Knochen passt sich an","Knochen baut sich dort auf, wo er regelm\xE4\xDFig belastet wird (Wolffsches Gesetz). Das geht langsam: Es dauert Wochen bis Monate, nicht Tage."],["Ein Teil ist Gew\xF6hnung","Am Anfang gew\xF6hnen sich vor allem Haut, Gewebe und dein Empfinden an den Kontakt. Deshalb f\xFChlt sich der Sandsack nach ein paar Wochen weniger schlimm an, lange bevor der Knochen sich ver\xE4ndert hat."],["Pausen sind Teil davon","Jede harte Belastung hinterl\xE4sst winzige Sch\xE4den, die in der Pause repariert werden. Wer zu fr\xFCh zu viel will, riskiert Knochenhautreizungen oder Erm\xFCdungsbr\xFCche. Langsam steigern schl\xE4gt jeden Abk\xFCrzungsversuch."],["Legende: B\xE4ume und Flaschen","Gegen B\xE4ume treten oder mit Flaschen auf das Schienbein schlagen macht vor allem Prellungen und reizt die Knochenhaut. Sandsack und Pratzen mit sauberer Technik reichen v\xF6llig."],["Warnzeichen","Ein Schmerz genau an einer Stelle am Knochen, eine Schwellung oder Schmerzen in Ruhe oder nachts: Pause machen und \xE4rztlich abkl\xE4ren lassen."],["Kinder und Jugendliche","Im Wachstum sind Knochen und Wachstumsfugen empfindlicher. Gezieltes Abh\xE4rten geh\xF6rt nicht in diese Phase \u2013 Ringzeit l\xE4sst es bei Kindern deshalb weg."]],src:"Wolffsches Gesetz; Sportmedizin (allgemeiner Konsens)"},en:{t:"Why shins get harder",sub:"What conditioning does \u2013 and what's legend",secs:[["Bone adapts","Bone builds up where it is loaded regularly (Wolff's law). That is slow: it takes weeks to months, not days."],["Part of it is getting used to it","At first it's mainly skin, tissue and your perception that get used to the contact. That's why the bag hurts less after a few weeks, long before the bone has changed."],["Rest is part of it","Every hard load leaves tiny damage that is repaired during rest. Wanting too much too soon risks shin splints or stress fractures. Building up slowly beats any shortcut."],["Legend: trees and bottles","Kicking trees or hitting your shins with bottles mostly causes bruises and irritates the bone lining. Bag and pads with clean technique are all you need."],["Warning signs","Pain at one exact spot on the bone, swelling, or pain at rest or at night: take a break and get it checked by a doctor."],["Children and teenagers","While growing, bones and growth plates are more sensitive. Targeted conditioning doesn't belong in this phase \u2013 that's why Ringzeit leaves it out for children."]],src:"Wolff's law; sports medicine (general consensus)"}},{k:"judge",only:"k",ico:'<path d="M12 4v16"/><path d="M5 8h14"/><path d="M5 8l-3 6h6z"/><path d="M19 8l-3 6h6z"/><path d="M8 20h8"/>',de:{t:"Wie Punktrichter werten",sub:"Warum ein sauberer Jab mehr z\xE4hlt als ein wilder Schwinger",secs:[["Point Fighting","Nach jedem Treffer wird unterbrochen. Die Seitenrichter zeigen an, ob und f\xFCr wen es einen Punkt gibt: Schlag, Tritt zum K\xF6rper und Fu\xDFfeger 1, Tritt zum Kopf und gesprungener Tritt zum K\xF6rper 2, gesprungener Tritt zum Kopf 3."],["Light Contact und Kick Light","Es wird durchgek\xE4mpft. Drei Seitenrichter z\xE4hlen die Treffer laufend elektronisch mit, nach denselben Punktwerten wie im Point Fighting."],["Im Ring: die f\xFCnf Kriterien","Mindestens drei Punktrichter werten. Ein Treffer z\xE4hlt nur, wenn alles stimmt: saubere Technik, Kraft, Wachsamkeit (Deckung, Blick), Timing und Distanz und sportliche Haltung. Geblockte, gestreifte oder geschobene Techniken z\xE4hlen nicht."],["Extrapunkte und Abz\xFCge","Ein Niederschlag gibt im Ring einen zus\xE4tzlichen Punkt. Ein Minuspunkt wiegt drei Trefferpunkte auf. Im Full Contact z\xE4hlt ein Kickz\xE4hler mit: Wer weniger als 6 Kicks pro Runde schafft, bekommt einen Minuspunkt. Auf der Tatami kostet jedes Verlassen der Fl\xE4che einen Punkt."],["Was das f\xFCrs Training hei\xDFt","Klare, saubere Techniken mit Kontakt sind mehr wert als viele halbe. Nach dem Treffer sofort zur\xFCck in die Deckung \u2013 Wachsamkeit wird mitbewertet. Und: Kombinationen gezielt beenden, statt sich festzuschlagen."]],src:"WAKO-Regelwerke (Ringsport allgemein, Tatami, Point Fighting, Light Contact)"},en:{t:"How judges score",sub:"Why a clean jab counts for more than a wild swing",secs:[["Point fighting","After every hit the bout is stopped. The judges signal whether and for whom a point is awarded: punch, kick to the body and foot sweep 1, kick to the head and jumping kick to the body 2, jumping kick to the head 3."],["Light contact and kick light","The fight is continuous. Three judges count hits live on electronic devices, using the same point values as in point fighting."],["In the ring: the five criteria","At least three judges score. A hit only counts if everything is right: clean technique, power, awareness (guard, focus), timing and distance, and sporting attitude. Blocked, brushed or pushing techniques don't score."],["Extra points and deductions","In the ring a knockdown gives an extra point. A minus point outweighs three scoring points. In full contact a kick counter keeps track: fewer than 6 kicks in a round means a minus point. On the tatami, every exit costs a point."],["What that means for training","Clear, clean techniques with contact are worth more than many half ones. After a hit, get your guard back at once \u2013 awareness is scored too. And finish combinations deliberately instead of getting stuck brawling."]],src:"WAKO rules (ring sports general, tatami, point fighting, light contact)"}},{k:"disc",only:"k",ico:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',de:{t:"Die Disziplinen im Vergleich",sub:"Von Point Fighting bis K1 \u2013 welcher Typ passt wohin?",secs:[["Point Fighting \xB7 Tatami","Stop-and-go wie beim Fechten: kontrollierte, blitzschnelle Treffer, nach jedem wird unterbrochen. Gek\xE4mpft wird mit offenen Handschuhen. F\xFCr Schnelle und Taktiker."],["Light Contact \xB7 Tatami","Durchk\xE4mpfen mit leichtem, kontrolliertem Kontakt und 10-oz-Handschuhen. Schl\xE4ge und Tritte zu Kopf und K\xF6rper, keine Tritte gegen die Beine. F\xFCr alle, die flie\xDFende Schlagabtausche m\xF6gen."],["Kick Light \xB7 Tatami","Wie Light Contact, zus\xE4tzlich mit Low Kicks gegen den Oberschenkel. Ein guter Schritt Richtung K1, ohne volle H\xE4rte."],["Full Contact \xB7 Ring","Volle Kraft, ein K. o. ist m\xF6glich. Treffer nur oberhalb des G\xFCrtels, keine Tritte gegen die Beine, mindestens 6 Kicks pro Runde. Gek\xE4mpft wird in langen Hosen."],["Low Kick \xB7 Ring","Wie Full Contact, dazu Tritte gegen Oberschenkel innen, au\xDFen und hinten. Keine Knie. Gek\xE4mpft wird in Shorts."],["K1 Style \xB7 Ring","Low Kicks, Knie zu Beinen, K\xF6rper und Kopf, ein kurzer Clinch f\xFCr einen einzelnen Kniesto\xDF, auch der gedrehte Backfist ist erlaubt. Ellbogen sind verboten. Die h\xE4rteste WAKO-Disziplin."],["Musical Forms","Choreografierte Formen zur Musik, mit oder ohne Waffe. Bewertet werden Technik, Schwierigkeit und Ausdruck \u2013 ganz ohne Gegner."],["In Ringzeit","Ringzeit plant f\xFCr Light Contact, Kick Light, Full Contact und K1 Style. Die Ring-Disziplinen sind \u2013 wie bei der WAKO \u2013 erst ab 15 Jahren und mit bestandenem Fitnesstest freigeschaltet."]],src:"WAKO-Regelwerke (Tatami allgemein, Ringsport allgemein, Low Kick, K1 Style)"},en:{t:"The disciplines compared",sub:"From point fighting to K1 \u2013 which type fits where?",secs:[["Point fighting \xB7 tatami","Stop-and-go like fencing: controlled, lightning-fast hits, the bout stops after each one. Fought with open-hand gloves. For the quick and the tacticians."],["Light contact \xB7 tatami","Continuous fighting with light, controlled contact and 10 oz gloves. Punches and kicks to head and body, no kicks to the legs. For everyone who likes flowing exchanges."],["Kick light \xB7 tatami","Like light contact, plus low kicks to the thigh. A good step towards K1 without full power."],["Full contact \xB7 ring","Full power, a KO is possible. Hits only above the belt, no kicks to the legs, at least 6 kicks per round. Fought in long trousers."],["Low kick \xB7 ring","Like full contact, plus kicks to the inside, outside and back of the thigh. No knees. Fought in shorts."],["K1 style \xB7 ring","Low kicks, knees to legs, body and head, a short clinch for a single knee, and the spinning backfist is allowed. Elbows are banned. The hardest WAKO discipline."],["Musical forms","Choreographed forms to music, with or without a weapon. Technique, difficulty and expression are judged \u2013 no opponent at all."],["In Ringzeit","Ringzeit plans for light contact, kick light, full contact and K1 style. As at WAKO, the ring disciplines unlock only from age 15 and after passing the fitness test."]],src:"WAKO rules (tatami general, ring sports general, low kick, K1 style)"}},{k:"day",only:"k",ico:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17"/><path d="M8 3v4M16 3v4"/><path d="M8 14.5h3"/>',de:{t:"Der Turniertag von innen",sub:"Vom Wiegen bis zur Siegerehrung \u2013 was beim ersten Mal keiner wei\xDF",secs:[["Vorher","Lies die Ausschreibung genau: Zeiten, Ort und Ablauf des Wiegens, erlaubte Ausr\xFCstung. F\xFCr WAKO-Turniere brauchst du einen Sportpass mit g\xFCltiger \xE4rztlicher Untersuchung \u2013 sie gilt jeweils ein Jahr. Die Packliste in Ringzeit hilft beim Einpacken."],["Das Wiegen","Es gibt keine Toleranz: Du musst auf oder unter dem Limit deiner Klasse liegen. Gewogen wird ohne Kleidung, je nach Turnier am Vortag oder am Morgen. Bei WAKO-Meisterschaften im Ringsport wird zus\xE4tzlich jeden Morgen gewogen. Wer dr\xFCber liegt, hat meist nur einen kurzen zweiten Versuch."],["Arzt und Kontrolle","Ein Arzt erkl\xE4rt dich vor dem Wettkampf f\xFCr kampff\xE4hig. Direkt vor dem Kampf pr\xFCfen die Kampfrichter Bandagen, Handschuhe und Schutzausr\xFCstung \u2013 sie muss WAKO-zugelassen sein, und der Mundschutz muss richtig sitzen."],["Warten geh\xF6rt dazu","Turniertage sind lang, Zeitpl\xE4ne verschieben sich fast immer. Nimm Trinkflasche, leicht verdauliche Snacks und warme Kleidung mit. W\xE4rm dich etwa 15\u201320 Minuten vor deinem Aufruf auf und bleib bei Verz\xF6gerungen locker in Bewegung."],["Zwischen den K\xE4mpfen","Trinken, etwas Leichtes essen, warm halten. Kurz vor dem n\xE4chsten Kampf wieder aktivieren: ein paar Runden Schattenboxen, Puls hochbringen."],["Danach","Siegerehrungen sind oft erst am Ende des Tages. Trag dein Ergebnis in Ringzeit ein, mit dem, was gut lief und was du verbessern willst \u2013 das macht den n\xE4chsten Trainingsblock gezielter."]],src:"WAKO-Regelwerke (Ringsport allgemein, Tatami allgemein, Ringsport Grundlagen WAKO Deutschland); im Zweifel gilt die Ausschreibung"},en:{t:"Tournament day from the inside",sub:"From weigh-in to medal ceremony \u2013 what nobody tells you the first time",secs:[["Before","Read the invitation carefully: times, place and procedure of the weigh-in, permitted equipment. For WAKO tournaments you need a sports pass with a valid medical exam \u2013 it is valid for one year. The packing list in Ringzeit helps you pack."],["The weigh-in","There is no tolerance: you must be on or below your class limit. Weighing is done undressed, the day before or in the morning depending on the event. At WAKO championships in ring sports there is also a weigh-in every morning. If you're over, you usually only get one short second attempt."],["Doctor and checks","A doctor declares you fit to fight before the competition. Right before the bout the officials check hand wraps, gloves and protective gear \u2013 it must be WAKO-approved, and the mouthguard must fit properly."],["Waiting is part of it","Tournament days are long and schedules almost always shift. Bring a water bottle, easily digestible snacks and warm clothes. Warm up about 15\u201320 minutes before your call and keep moving lightly if things are delayed."],["Between bouts","Drink, eat something light, stay warm. Shortly before the next bout, activate again: a few rounds of shadow boxing, bring your pulse up."],["Afterwards","Medal ceremonies are often at the end of the day. Log your result in Ringzeit with what went well and what you want to improve \u2013 it makes the next training block more targeted."]],src:"WAKO rules (ring sports general, tatami general, WAKO Germany ring sports basics); the invitation always prevails"}},{k:"mistakes",ico:'<path d="M12 3.5 21 19H3z"/><path d="M12 9.5v4.5"/><path d="M12 16.8h.01"/>',de:{t:"Die h\xE4ufigsten Anf\xE4ngerfehler",sub:"F\xFCnf Dinge, die fast jeder am Anfang macht",secs:[["1. Die H\xE4nde fallen","Nach dem Schlag oder Kick bleibt die Hand unten. Der R\xFCckweg in die Deckung geh\xF6rt zur Technik \u2013 genau dann kommt der Konter."],["2. Stehenbleiben nach der Kombi","Wer nach dem letzten Treffer auf der Stelle steht, ist das n\xE4chste Ziel. Danach immer bewegen: raus aus der Linie oder zur\xFCck in Deckung."],["3. Luft anhalten","Wer bei Schl\xE4gen die Luft anh\xE4lt, ist nach einer Minute platt. Bei jedem Treffer kurz und scharf ausatmen \u2013 das gibt Spannung und h\xE4lt dich frisch."],["4. Alles mit voller Kraft","Verkrampfte Schultern machen langsam und m\xFCde. Locker bleiben und erst im Treffpunkt fest werden \u2013 Schnelligkeit kommt aus Lockerheit."],["5. Aufw\xE4rmen und Pausen auslassen","Kalt ins Sparring oder ohne Ruhetage durchtrainieren f\xFChrt zu Zerrungen und Leistungsknick. Aufw\xE4rmen und Erholung sind Teil des Trainings."],["Bonus: nur die Lieblingstechnik","Wer immer dasselbe macht, wird berechenbar. Gute K\xE4mpfer variieren H\xF6he, Rhythmus und Seite."]],src:"Trainerpraxis (allgemeiner Konsens)"},en:{t:"The most common beginner mistakes",sub:"Five things almost everyone does at first",secs:[["1. Dropping the hands","After the punch or kick the hand stays down. Returning to guard is part of the technique \u2013 that's exactly when the counter comes."],["2. Standing still after the combo","Whoever stands still after the last hit is the next target. Always move afterwards: off the line or back into guard."],["3. Holding your breath","Holding your breath while punching leaves you exhausted after a minute. Breathe out short and sharp with every strike \u2013 it gives tension and keeps you fresh."],["4. Everything at full power","Tense shoulders make you slow and tired. Stay loose and only tighten on impact \u2013 speed comes from being relaxed."],["5. Skipping warm-up and rest","Sparring cold or training without rest days leads to strains and a performance dip. Warm-up and recovery are part of training."],["Bonus: only your favourite technique","Doing the same thing every time makes you predictable. Good fighters vary height, rhythm and side."]],src:"Coaching practice (general consensus)"}},{k:"mind",ico:'<path d="M12 20c-4.5 0-8-3.4-8-7.6C4 7.9 7.6 4 12 4s8 3.9 8 8.4c0 4.2-3.5 7.6-8 7.6z"/><path d="M8.5 12.5c1 1.4 2.2 2 3.5 2s2.5-.6 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01"/>',de:{t:"Kopf und Nerven",sub:"Lampenfieber, Routinen und warum Profis atmen \xFCben",secs:[["Lampenfieber ist normal","Herzklopfen, flaues Gef\xFChl, st\xE4ndig aufs Klo: Das ist Adrenalin. Es macht dich wach und schnell \u2013 dein K\xF6rper bereitet sich auf Leistung vor. Auch erfahrene K\xE4mpfer haben es."],["Routinen geben Halt","Immer der gleiche Ablauf vor dem Kampf \u2013 Bandagieren, Aufw\xE4rmen, vielleicht dieselbe Musik \u2013 signalisiert dem Kopf: alles bekannt. Probier deine Routine schon im Training aus."],["Atmen beruhigt","L\xE4nger aus- als einatmen beruhigt den Puls, zum Beispiel 4 Sekunden ein, 6 Sekunden aus, ein paar Minuten lang. Das funktioniert auch in der Rundenpause."],["Auf die Aufgabe schauen","Nimm dir ein, zwei konkrete Punkte vor, etwa \u201Enach jeder Kombi raus aus der Linie\u201C. Wer nur ans Ergebnis denkt, verkrampft."],["Nach dem Kampf","Egal wie es ausging: Notier dir, was gut lief und was du verbessern willst. Ringzeit fragt nach dem Turnier danach \u2013 so wird jeder Kampf zur Trainingseinheit."]],src:"Sportpsychologie (allgemeiner Konsens)"},en:{t:"Mind and nerves",sub:"Stage fright, routines and why pros practise breathing",secs:[["Nerves are normal","Pounding heart, queasy stomach, constant toilet trips: that's adrenaline. It makes you alert and fast \u2013 your body is getting ready to perform. Experienced fighters feel it too."],["Routines give you footing","The same sequence before every bout \u2013 wrapping, warm-up, maybe the same music \u2013 tells your mind: all familiar. Try your routine out in training."],["Breathing calms you","Breathing out longer than in calms your pulse, for example 4 seconds in, 6 seconds out for a few minutes. It also works in the break between rounds."],["Focus on the task","Set yourself one or two concrete points, like \u201Cmove off the line after every combo\u201D. Thinking only about the result makes you tense."],["After the bout","Whatever the result: note what went well and what you want to improve. Ringzeit asks about it after the tournament \u2013 so every bout becomes a training session."]],src:"Sport psychology (general consensus)"}},{k:"sleep",ico:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',de:{t:"Schlaf und Erholung",sub:"Warum der Fortschritt in der Pause passiert",secs:[["Training ist der Reiz, Erholung der Fortschritt","Im Training belastest du den K\xF6rper, st\xE4rker wird er danach: Er repariert und baut ein bisschen mehr auf als vorher. Ohne Erholung bleibt nur die Erm\xFCdung."],["Wie viel Schlaf?","Empfohlen werden f\xFCr Erwachsene mindestens 7 Stunden, f\xFCr Jugendliche 8\u201310 Stunden. Im Tiefschlaf sch\xFCttet der K\xF6rper besonders viel Wachstumshormon aus."],["Was zu wenig Schlaf kostet","Reaktion, Koordination und Kraft lassen nach, das Verletzungsrisiko steigt, und du wirst leichter krank. Eine kurze Nacht vor dem Training ist kein Drama \u2013 viele hintereinander schon."],["Besser schlafen","Feste Zeiten, dunkles und k\xFChles Zimmer, das Handy vor dem Einschlafen weglegen. Nach sp\xE4tem Training hilft ein ruhiger \xDCbergang: duschen, etwas essen, runterfahren."],["Warnzeichen f\xFCr zu viel","Dauerhaft erh\xF6hter Ruhepuls, schlechter Schlaf, keine Lust mehr, sinkende Leistung trotz Training: Das sind Zeichen, k\xFCrzerzutreten. Ringzeit fragt deshalb nach Tagesform und Anstrengung."]],src:"Schlafmedizin (AASM-Empfehlungen); Trainingslehre"},en:{t:"Sleep and recovery",sub:"Why progress happens during rest",secs:[["Training is the stimulus, recovery the progress","Training stresses the body; it gets stronger afterwards by repairing and building up a little more than before. Without recovery, only fatigue remains."],["How much sleep?","Recommendations are at least 7 hours for adults and 8\u201310 hours for teenagers. During deep sleep the body releases a lot of growth hormone."],["What too little sleep costs","Reaction, coordination and strength drop, injury risk rises and you get ill more easily. One short night before training is no drama \u2013 many in a row are."],["Sleeping better","Fixed times, a dark and cool room, put the phone away before sleep. After late training, a calm transition helps: shower, eat something, wind down."],["Signs of too much","A resting pulse that stays raised, poor sleep, no motivation, performance dropping despite training: signs to ease off. That's why Ringzeit asks about your daily form and effort."]],src:"Sleep medicine (AASM recommendations); training theory"}},{k:"gloves",only:"k",ico:'<path d="M7 20h9v-3c2.2-.9 3.5-2.9 3.5-5.3V9.5A5.5 5.5 0 0 0 14 4h-3.5A5.5 5.5 0 0 0 5 9.5v3.2c0 1.7.7 3.2 2 4.1z"/><path d="M7 16.8h9"/>',de:{t:"Handschuhe erkl\xE4rt",sub:"Was 10, 12 oder 16 Unzen bedeuten",secs:[["Was die Zahl hei\xDFt","Handschuhe werden in Unzen (oz) angegeben: 1 oz sind 28,35 g, ein 10-oz-Handschuh wiegt also rund 283 g. Mehr Gewicht hei\xDFt vor allem mehr Polster."],["Im Wettkampf","Bei der WAKO gilt: Light Contact, Kick Light und alle Ring-Disziplinen mit geschlossenen 10-oz-Handschuhen, Point Fighting mit offenen Handschuhen. Sie m\xFCssen WAKO-zugelassen sein \u2013 im Zweifel steht es in der Ausschreibung."],["Im Sparring","Hier sind schwerere Handschuhe \xFCblich, oft 12\u201316 oz je nach K\xF6rpergewicht. Das Mehr an Polster sch\xFCtzt vor allem deinen Partner. Was in deinem Verein gilt, sagt dir dein Trainer."],["Am Sandsack","Viele nutzen daf\xFCr eigene Handschuhe. Das Polster wird am Sack schneller hart und platt \u2013 im Sparring sch\xFCtzt so ein Handschuh dann schlechter."],["Wann neue f\xE4llig sind","Wenn du die Kn\xF6chel durchs Polster sp\xFCrst, N\xE4hte aufgehen oder das Polster eingedr\xFCckt bleibt. Gute Pflege verl\xE4ngert das Leben deutlich \u2013 siehe Materialpflege."],["Bandagen nicht vergessen","Handschuhe sch\xFCtzen den Gegner und die Kn\xF6chel, Bandagen stabilisieren Mittelhand und Handgelenk. Beides geh\xF6rt zusammen \u2013 im Wettkampf ist beides Pflicht."]],src:"WAKO-Regelwerke (Ringsport allgemein, Tatami allgemein); 1 oz = 28,35 g"},en:{t:"Gloves explained",sub:"What 10, 12 or 16 ounces mean",secs:[["What the number means","Gloves are measured in ounces (oz): 1 oz is 28.35 g, so a 10 oz glove weighs about 283 g. More weight mainly means more padding."],["In competition","At WAKO: light contact, kick light and all ring disciplines use closed 10 oz gloves, point fighting uses open-hand gloves. They must be WAKO-approved \u2013 when in doubt, check the invitation."],["In sparring","Heavier gloves are common here, often 12\u201316 oz depending on body weight. The extra padding mainly protects your partner. Your coach will tell you what applies in your club."],["On the bag","Many use separate gloves for it. The padding gets hard and flat faster on the bag \u2013 such a glove then protects less in sparring."],["When it's time for new ones","When you feel your knuckles through the padding, seams open or the padding stays dented. Good care extends their life a lot \u2013 see equipment care."],["Don't forget hand wraps","Gloves protect the opponent and your knuckles, wraps stabilise hand and wrist. Both belong together \u2013 in competition both are mandatory."]],src:"WAKO rules (ring sports general, tatami general); 1 oz = 28.35 g"}}],GUIDE_ICO={wrap:'<circle cx="8" cy="12" r="4.5"/><circle cx="8" cy="12" r="1.6"/><path d="M8 7.5h10.5v9H8"/><path d="M13 7.5v9"/>',care:'<path d="M8 20h8v-3.2c2.4-.9 3.5-2.9 3.5-5.3V9a5 5 0 0 0-5-5H11a5 5 0 0 0-5 5v3.5c0 1.8.8 3.3 2 4.3z"/><path d="M8 16.8h8"/><path d="M10 11h3.5a2 2 0 0 0 2-2"/>',aid:'<rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M12 8.5v7M8.5 12h7"/>'};function guidePanelHtml(){const e=t("guide"),n=a=>`<button type="button" class="grow" data-guide="${a}"><span class="gico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${GUIDE_ICO[a]}</svg></span><b>${e[a]}</b><span class="chev">\u203A</span></button>`,s=S.profile.lang==="de"?"de":"en",i=a=>`<button type="button" class="grow" data-guide="${a.k}"><span class="gico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${a.ico}</svg></span><span class="gtx"><b>${esc(a[s].t)}</b><small>${esc(a[s].sub)}</small></span><span class="chev">\u203A</span></button>`;return`<div class="panel"><div class="field"><span class="lab">${e.title}</span><span class="sub">${isBoxMain()?e.hintBox:isTkdMain()?e.hintTkd:e.hint}</span></div><span class="glab">${e.practical}</span><div class="glist">${isTkdMain()?"":n("wrap")}${n("care")}${n("aid")}</div><span class="glab">${e.reads}</span><div class="glist">${readsFor().map(i).join("")}</div></div>`}const isBoxMain=()=>mainSport()==="boxing",BOX_ICO={bag:'<path d="M12 3v3"/><rect x="7" y="6" width="10" height="14" rx="3"/><path d="M7 11h10"/>',hist:'<path d="M4 6h7a3 3 0 0 1 3 3v10a2 2 0 0 0-2-2H4z"/><path d="M20 6h-3a3 3 0 0 0-3 3"/>',rules:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/>',gear:'<path d="M7 20h9v-3c2.2-.9 3.5-2.9 3.5-5.3V9.5A5.5 5.5 0 0 0 14 4h-3.5A5.5 5.5 0 0 0 5 9.5v3.2c0 1.7.7 3.2 2 4.1z"/><path d="M7 16.8h9"/>'},BOX_READS=[{k:"bgear",ico:BOX_ICO.gear,de:{t:"Boxen: Handschuhe & Bandagen",sub:"Was du f\xFCrs Training brauchst \u2013 und worauf du achtest",secs:[["Bandagen zuerst","Bandagen st\xFCtzen Handgelenk und Mittelhandknochen und saugen Schwei\xDF auf. Wickle sie bei jedem Training neu und lass sie nach dem Waschen aufgerollt trocknen. Die Schritt-f\xFCr-Schritt-Anleitung findest du unter \u201EBandagieren\u201C."],["Handschuhgewicht","Handschuhe werden in Unzen (oz) angegeben, 1 oz sind 28,35 g. F\xFCrs Sandsack- und Partnertraining nehmen viele Vereine eher schwerere, gut gepolsterte Handschuhe. Welches Gewicht im Wettkampf vorgeschrieben ist, steht in den DBV-Bestimmungen oder der Ausschreibung \u2013 frag zus\xE4tzlich deinen Trainer."],["Passform","Die Faust soll im Handschuh fest, aber nicht eingeklemmt sitzen. Der Daumen liegt am Handschuh an, das Klett schlie\xDFt das Handgelenk sicher."],["Pflege","Nach dem Training l\xFCften, innen mit Textilerfrischer einspr\xFChen und offen trocknen lassen \u2013 nicht auf der Heizung. Mehr dazu unter \u201EMaterialpflege\u201C."]],src:"Allgemeine Trainingspraxis; Wettkampfgewichte: DBV-Wettkampfbestimmungen (nicht kopiert, nur verlinkt). Trainerpr\xFCfung empfohlen."},en:{t:"Boxing: gloves & hand wraps",sub:"What you need for training \u2013 and what to look for",secs:[["Wraps first","Wraps support the wrist and the knuckle bones and soak up sweat. Wrap fresh every session and let them dry rolled up after washing. Step by step: see \u201CHand wraps\u201D."],["Glove weight","Gloves are rated in ounces (oz); 1 oz is 28.35 g. For bag and partner work many clubs prefer heavier, well-padded gloves. The weight required in competition is set in the DBV rules or the invitation \u2013 also ask your coach."],["Fit","Your fist should sit snugly in the glove without being squeezed. The thumb rests against the glove and the strap secures the wrist."],["Care","Air them after training, spray the inside with a textile freshener and dry them open \u2013 not on a radiator. More under \u201CEquipment care\u201D."]],src:"General training practice; competition weights: DBV competition rules (linked, not copied). Coach review recommended."}},{k:"bag",ico:BOX_ICO.bag,de:{t:"Sandsacktraining",sub:"Den Sack wie einen Partner behandeln",secs:[["Distanz","Stell dich so, dass du den Sack mit gestrecktem Arm gerade ber\xFChrst. Der Jab misst die Entfernung \u2013 danach kommt der Rest."],["Als Gegner denken","Stell dir vor, der Sack greift an: Nach jeder Kombination aus der Linie gehen, eine Kopfbewegung machen oder die Deckung schlie\xDFen, bevor du neu startest."],["Treffen, nicht schieben","Triff mit den ersten beiden Kn\xF6cheln, die Faust dreht erst kurz vor dem Ziel ein, die Hand geht sofort zur\xFCck in die Deckung."],["Locker bleiben","Schultern locker, Atem raus bei jedem Schlag. Ein verkrampfter Arm ist langsam und erm\xFCdet schnell."],["Handgelenk sch\xFCtzen","Bandagen immer, Handschuhe passend, und bei Schmerzen im Handgelenk die Runde beenden."]],src:"Allgemeine Trainingspraxis. Trainerpr\xFCfung empfohlen."},en:{t:"Heavy-bag work",sub:"Treat the bag like a partner",secs:[["Distance","Stand so that your outstretched arm just touches the bag. The jab measures the distance \u2013 the rest follows."],["Think of an opponent","Imagine the bag attacks: after each combination leave the line, move your head or close your guard before starting again."],["Hit, don\u2019t push","Land with the first two knuckles, turn the fist in just before the target and bring the hand straight back to guard."],["Stay loose","Loose shoulders, breathe out on every punch. A tense arm is slow and tires fast."],["Protect the wrist","Always wrap, wear fitting gloves and end the round if the wrist hurts."]],src:"General training practice. Coach review recommended."}},{k:"bhist",ico:BOX_ICO.hist,de:{t:"Amateurboxen \u2013 kurze Geschichte",sub:"Von den antiken Spielen bis zu den heutigen Regeln",secs:[["Antike","Boxen stand bereits bei den antiken Olympischen Spielen auf dem Programm; die Olympedia nennt 688 v. Chr. als fr\xFChes Datum."],["Moderne Spiele","Bei den modernen Olympischen Spielen ist Boxen seit 1904 (St. Louis) dabei. 1912 in Stockholm fehlte es, seit Antwerpen 1920 geh\xF6rt es immer zum Programm."],["Frauen","Olympisches Frauenboxen gibt es seit London 2012."],["Regelentwicklung","Seit 2009 boxen M\xE4nner im olympischen Turnier 3 \xD7 3 Minuten statt zuvor 4 \xD7 2 Minuten. 1974 fand die erste Amateur-Weltmeisterschaft statt."],["Heute in Deutschland","Der Deutsche Boxsport-Verband (DBV) regelt den Amateurbereich. Die aktuellen Wettkampfbestimmungen findest du \xFCber den Regel-Link."]],src:"Olympedia (olympedia.org), Wikipedia \u201EBoxing at the Summer Olympics\u201C, DBV (boxverband.de)"},en:{t:"Amateur boxing \u2013 a short history",sub:"From the ancient games to today\u2019s rules",secs:[["Antiquity","Boxing was already part of the ancient Olympic Games; Olympedia gives 688 BCE as an early date."],["Modern Games","Boxing has been in the modern Olympics since 1904 (St. Louis). It was missing in Stockholm 1912 and has been on the programme every time since Antwerp 1920."],["Women","Olympic women\u2019s boxing has existed since London 2012."],["Rule changes","Since 2009 men box 3 \xD7 3 minutes in the Olympic tournament instead of 4 \xD7 2. The first amateur World Championships took place in 1974."],["Today in Germany","The German Boxing Federation (DBV) governs the amateur side. Find the current competition rules via the rules link."]],src:"Olympedia (olympedia.org), Wikipedia \u201CBoxing at the Summer Olympics\u201D, DBV (boxverband.de)"}},{k:"brules",ico:BOX_ICO.rules,de:{t:"Boxen: Regeln & Links",sub:"Offizielle Quelle statt Abschrift",secs:[["Offizielles Regelwerk","Die DBV-Wettkampfbestimmungen (WKB, Stand 01.09.2026, g\xFCltig ab 01.11.2026) sind die Grundlage. Ringzeit kopiert sie nicht, sondern verlinkt sie \u2013 im Zweifel gilt immer das Original."],["Altersklassen","Nach Kalenderjahr: U13 (10\u201312), U15 (13\u201314), U17 (15\u201316), U19 (17\u201318), Erwachsene ab 19 bis zum Jahr des 40. Geburtstags."],["Runden","Es sind immer 3 Runden mit 1 Minute Pause. Die Rundenl\xE4nge h\xE4ngt von der Klasse ab (U13 60 s, U15 90 s, U17 120 s, U19 und Erwachsene 180 s)."],["Nach einem K.o.","Nach einem K.o. gilt in Ringzeit eine Sperre von 30 Tagen im Plan. Bei Verdacht auf Gehirnersch\xFCtterung gehst du zum Arzt."],["Ab 40","Das Training mit 3 \xD7 2 Minuten ist hier ein Trainingsformat und kein offizielles DBV-Format."]],src:"DBV-Wettkampfbestimmungen (WKB) Stand 01.09.2026 \u2013 boxverband.de",link:!0},en:{t:"Boxing: rules & links",sub:"Official source instead of a copy",secs:[["Official rule book","The DBV competition rules (WKB, version 01.09.2026, in force from 01.11.2026) are the basis. Ringzeit does not copy them but links them \u2013 the original always prevails."],["Age classes","By calendar year: U13 (10\u201312), U15 (13\u201314), U17 (15\u201316), U19 (17\u201318), adults from 19 until the year of the 40th birthday."],["Rounds","Always 3 rounds with a 1-minute break. Round length depends on the class (U13 60 s, U15 90 s, U17 120 s, U19 and adults 180 s)."],["After a KO","After a KO Ringzeit plans a 30-day break. See a doctor if you suspect a concussion."],["Over 40","Training with 3 \xD7 2 minutes is a training format here and not an official DBV format."]],src:"DBV competition rules (WKB) version 01.09.2026 \u2013 boxverband.de",link:!0}}],readsFor=()=>isTkdMain()?[...tkdReads(),...READS.filter(e=>!e.only&&e.k!=="mistakes").map(tkdShared)]:isBoxMain()?[...BOX_READS,...READS.filter(e=>!e.only)]:READS.filter(e=>e.only!=="b"),BOX_CARE_SKIP=2;function guideSecs(e){const n=t("guide");return isTkdMain()?e==="care"?n.careSecs.filter((s,i)=>i>1).map(([s,i])=>[s,i.replace(/^Wie Handschuhe: (.)/,(a,l)=>l.toUpperCase()).replace(/^Like gloves: (.)/,(a,l)=>l.toUpperCase()).replace("Ein W\xE4schenetz f\xFCr die Bandagen und ein Beutel f\xFCr nasse Sachen halten Ordnung.","Ein Beutel f\xFCr nasse Sachen h\xE4lt Ordnung.").replace("A laundry bag for the wraps and a pouch for wet things keep it tidy.","A pouch for wet things keeps it tidy.")]):n.aidSecs.filter((s,i)=>i!==1).map(([s,i])=>[s,i.replace(/die WAKO-Sperre nach K\.o\. gilt\./,"danach ist eine Pause n\xF6tig.").replace(/the WAKO suspension after a KO applies\./,"a break is needed afterwards.")]):isBoxMain()?e==="care"?n.careSecs.filter((s,i)=>i!==BOX_CARE_SKIP):n.aidSecs.map(([s,i])=>s===n.aidSecs[3][0]?[s,i.replace(/die WAKO-Sperre nach K\.o\. gilt\./,"die K.o.-Sperre gilt.").replace(/the WAKO suspension after a KO applies\./,"the KO suspension applies.")]:[s,i]):e==="care"?n.careSecs:n.aidSecs}const isTkdMain=()=>mainSport()==="taekwondo",TKD_ICO={belt:'<path d="M3 10h18v4H3z"/><path d="M11 14l-2 6M13 14l2 6"/>',grade:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h4"/>',terms:'<path d="M4 5h16v10H9l-4 4v-4H4z"/><path d="M8 9h8M8 12h5"/>',hist:'<path d="M4 6h7a3 3 0 0 1 3 3v10a2 2 0 0 0-2-2H4z"/><path d="M20 6h-3a3 3 0 0 0-3 3"/>'};function tkdReads(){const e=tkdStyle(),n=e==="itf",s=n?ITFT.TECH:TKDT.TECH,i=(p,u)=>TKDT.gradeText(p,u),a=["k9","k8","k7","k6","k5","k4","k3","k2","k1","d1"],l=p=>a.map(u=>`${i(u,p)} ${TKDT.WAIT[e][u]}`).join(" \xB7 "),r=p=>n?Object.entries(TKDT.ITF_TUL).map(([u,b])=>`${i(u,p)}: ${b}`).join(" \xB7 "):Object.entries(TKDT.WT_FORM).filter(([u])=>u!=="p1").map(([u,b])=>`${i(u,p)}: ${b[1]}`).join(" \xB7 "),o=p=>Object.values(s).filter(u=>u[2]&&!/\(Kopf\)|→/.test(u[0]+u[2])).map(u=>`${p==="de"?u[0]:u[1]} \u2013 ${u[2]}`).join("; "),d=[{u:"https://www.dtu.de/downloads/regelwerke-co",de:"DTU-Regelwerke (Pr\xFCfungsordnung, Wettkampfordnung)",en:"DTU rule books (grading and competition regulations)"}],c=[{u:"https://www.itf-d.de/api/public/res/file-manager/downloads/rules/67b44df9564df.pdf",de:"ITF-D Pr\xFCfungsordnung (PDF)",en:"ITF-D grading regulations (PDF)"},{u:"https://www.itf-d.de/api/public/res/file-manager/downloads/rules/63a9cc9056659.pdf",de:"ITF-D Wettkampfordnung (PDF)",en:"ITF-D competition rules (PDF)"}];return[{k:"tbelt",ico:TKD_ICO.belt,de:{t:"G\xFCrtel binden & Dobok",sub:"So sitzt der G\xFCrtel \u2013 und so bleibt der Anzug in Form",secs:[["G\xFCrtel binden","G\xFCrtelmitte auf den Bauchnabel legen, einmal um den K\xF6rper f\xFChren, hinten kreuzen und vorn wieder zusammenf\xFChren. Ein Ende unter beiden Lagen durchziehen und mit einem Flachknoten schlie\xDFen. Beide Enden sollen am Ende gleich lang sein."],["Respekt vor dem G\xFCrtel","In vielen Schulen wird der G\xFCrtel mit Respekt behandelt und nicht achtlos auf den Boden geworfen. Frag deinen Trainer nach den Gepflogenheiten im Verein."],["Dobok richtig tragen","Die Jacke schlie\xDFen und mit dem G\xFCrtel auf H\xFCfth\xF6he halten; die Hose darf nicht \xFCber den Boden schleifen. Ein Dobok sitzt locker genug f\xFCr hohe Tritte, aber nicht so weit, dass du dich darin verf\xE4ngst."],["Pflege","Nach dem Training l\xFCften und nach Pflegeetikett waschen, Farbg\xFCrtel getrennt von hellen Teilen. Nicht hei\xDF trocknen \u2013 die Baumwolle l\xE4uft sonst ein."],["Schutzausr\xFCstung",n?"Welche Schutzausr\xFCstung bei ITF-D-Turnieren vorgeschrieben ist, steht in der Wettkampfordnung des ITF-D und in der Ausschreibung. Die Packliste im Turnierbereich ist daran angelehnt.":"Welche Schutzausr\xFCstung bei WT-Turnieren vorgeschrieben ist, regeln die Wettkampfregeln der WT und die DTU-Wettkampfordnung (Rumpfschutz, Kopfschutz, Tiefschutz, Mundschutz, Schienbein- und Unterarmschutz). Die Packliste im Turnierbereich ist daran angelehnt."]],src:"Allgemeine Trainingspraxis; Ausr\xFCstung: "+(n?"ITF-D Wettkampfordnung":"DTU Wettkampfordnung Zweikampf")+". Trainerpr\xFCfung empfohlen.",links:n?c:d},en:{t:"Tying the belt & the dobok",sub:"How the belt sits \u2013 and how to look after the uniform",secs:[["Tying the belt","Put the middle of the belt on your navel, take it once around the body, cross it behind and bring it to the front again. Pull one end under both layers and close it with a square knot. Both ends should end up the same length."],["Respect for the belt","In many schools the belt is treated with respect and not thrown on the floor. Ask your coach what is customary in your club."],["Wearing the dobok","Close the jacket and keep it at hip height with the belt; the trousers must not drag on the floor. A dobok should be loose enough for high kicks but not so wide that you catch yourself in it."],["Care","Air it after training and wash by the care label, coloured belts apart from light items. Don't tumble-dry hot \u2013 cotton shrinks."],["Protective gear",n?"Which protective gear is required at ITF-D tournaments is set in the ITF-D competition rules and the invitation. The packing list in the tournament area follows it.":"Which protective gear is required at WT tournaments is set by the WT competition rules and the DTU competition regulations (trunk, head, groin and mouth guard, shin and forearm guards). The packing list in the tournament area follows it."]],src:"General training practice; equipment: "+(n?"ITF-D competition rules":"DTU competition regulations (two-person sparring)")+". Coach review recommended.",links:n?c:d}},{k:"tgrade",ico:TKD_ICO.grade,de:{t:"Grade & Pr\xFCfung",sub:n?"Kup, Dan und Tul beim ITF-D":"Kup, Poom/Dan und Taegeuk bei der DTU",secs:[["Wie die Grade laufen",n?"Die Sch\xFClergrade (Kup) z\xE4hlen vom 9. bis zum 1. Kup abw\xE4rts, danach folgt der 1. Dan. Jeder Grad hat eine eigene G\xFCrtelfarbe.":"Die Sch\xFClergrade (Kup) z\xE4hlen vom 9. bis zum 1. Kup abw\xE4rts. Danach folgt der Poom (f\xFCr Kinder und Jugendliche) oder der Dan. Jeder Grad hat eine eigene G\xFCrtelfarbe."],["Mindestwartezeiten","Vor der Pr\xFCfung zum jeweiligen Grad gilt eine Mindestzeit seit der letzten Pr\xFCfung (in Monaten): "+l("de")+"."],[n?"Tul (Formen)":"Formen (Taegeuk)",r("de")+(n?".":". Die Pr\xFCfungsordnung nummeriert die Formen nur; die hier gezeigte Reihenfolge ist die \xFCbliche Kukkiwon-Folge.")],["Was gepr\xFCft wird","Die Pr\xFCfungsteile je Grad findest du unter Tests \u2192 G\xFCrtelpr\xFCfung zum Abhaken. Ringzeit plant daraus keine Pr\xFCfungsinhalte neu \u2013 der Pr\xFCfer und deine Schule legen den genauen Ablauf fest."]],src:n?"ITF-D Pr\xFCfungsordnung (PO) \xA7 2, 3, 7, 8":"DTU Pr\xFCfungsordnung (PO) Nr. 10.1; Kukkiwon-Formenfolge",links:n?c:d},en:{t:"Grades & examination",sub:n?"Kup, dan and tul at the ITF-D":"Kup, poom/dan and taegeuk at the DTU",secs:[["How the grades run",n?"The student grades (kup) count down from 9th to 1st kup, followed by 1st dan. Each grade has its own belt colour.":"The student grades (kup) count down from 9th to 1st kup. After that comes poom (for children and youth) or dan. Each grade has its own belt colour."],["Minimum waiting times","Before the exam for each grade a minimum time since the last exam applies (in months): "+l("en")+"."],[n?"Tul (patterns)":"Forms (taegeuk)",r("en")+(n?".":". The grading regulations only number the forms; the order shown here is the usual Kukkiwon sequence.")],["What is examined","You find the exam parts per grade under Tests \u2192 Belt exam to tick off. Ringzeit does not plan exam content for you \u2013 the examiner and your school set the exact course."]],src:n?"ITF-D grading regulations (PO) \xA7\xA7 2, 3, 7, 8":"DTU grading regulations (PO) no. 10.1; Kukkiwon forms sequence",links:n?c:d}},{k:"tterms",ico:TKD_ICO.terms,de:{t:"Begriffe",sub:n?"Die Namen der Techniken im ITF-Taekwon-Do":"Die Namen der Techniken im WT-Taekwondo",secs:[["Wortbausteine","Chagi hei\xDFt Tritt, Jirugi Sto\xDF oder Schlag mit der Faust, Makgi Block. Der Dojang ist die Trainingshalle, der Dobok der Anzug, Ti der G\xFCrtel."],["Die Techniken in Ringzeit",o("de")+"."],["Schreibweisen",n?"Hier gilt die Schreibweise der ITF-D-Pr\xFCfungsordnung. Was die Ordnung nicht benennt, steht nur auf Deutsch oder Englisch \u2013 Ringzeit erfindet keine Namen.":"Hier gilt die Umschrift der Kukkiwon-Fachbegriffe. In den Einstellungen w\xE4hlst du, ob koreanische Namen oder App-Namen angezeigt werden; Ansagen sind immer in der App-Sprache."]],src:n?"ITF-D Pr\xFCfungsordnung (PO), ITF Tournament Rules":"Kukkiwon Taekwondo Technical Terminology (2012)"},en:{t:"Terms",sub:n?"The names of the techniques in ITF Taekwon-Do":"The names of the techniques in WT Taekwondo",secs:[["Word parts","Chagi means kick, jirugi a punch or strike with the fist, makgi a block. The dojang is the training hall, the dobok the uniform, ti the belt."],["Techniques in Ringzeit",o("en")+"."],["Spelling",n?"The spelling of the ITF-D grading regulations applies here. What the regulations do not name is given in German or English only \u2013 Ringzeit does not invent names.":"The romanisation of the Kukkiwon terminology applies here. In the settings you choose between Korean names and app names; announcements are always in the app language."]],src:n?"ITF-D grading regulations (PO), ITF Tournament Rules":"Kukkiwon Taekwondo Technical Terminology (2012)"}},{k:"thist",ico:TKD_ICO.hist,de:{t:"Geschichte & Verb\xE4nde",sub:"Zwei Linien, ein Name \u2013 kurz und neutral",secs:[["Der Name","Taekwondo setzt sich aus tae (Fu\xDF), kwon (Faust) und do (Weg) zusammen; der Name wurde in den 1950er-Jahren festgelegt."],["ITF-Linie","Die International Taekwon-Do Federation wurde am 22. M\xE4rz 1966 in Seoul von General Choi Hong-hi gegr\xFCndet, ihr Sitz ist seit 1985 Wien. Der ITF-D vertritt sie in Deutschland."],["WT-Linie","Die World Taekwondo Federation wurde 1973 gegr\xFCndet, im selben Jahr fanden die ersten Weltmeisterschaften in Seoul statt; seit 2017 hei\xDFt sie World Taekwondo (WT). Das IOC erkannte sie 1980 an, seit 2000 ist Taekwondo olympische Medaillendisziplin. Die Deutsche Taekwondo Union (DTU) geh\xF6rt der WT an."],["Welche Linie ist richtig?","Beide sind gewachsene Wege des Taekwondo mit eigenen Regeln. Ringzeit plant nach dem Stil, den du im Profil w\xE4hlst \u2013 und du kannst ihn pro Einheit wechseln."]],src:"Wikipedia (Taekwondo; ITF; DTU); taekwondonation.com; Olympedia"},en:{t:"History & federations",sub:"Two lines, one name \u2013 short and neutral",secs:[["The name","Taekwondo combines tae (foot), kwon (fist) and do (way); the name was settled in the 1950s."],["The ITF line","The International Taekwon-Do Federation was founded on 22 March 1966 in Seoul by General Choi Hong-hi; its seat has been Vienna since 1985. The ITF-D represents it in Germany."],["The WT line","The World Taekwondo Federation was founded in 1973, and the first World Championships took place in Seoul the same year; since 2017 it has been called World Taekwondo (WT). The IOC recognised it in 1980, and taekwondo has been an Olympic medal sport since 2000. The German Taekwondo Union (DTU) belongs to WT."],["Which line is right?","Both are grown paths of taekwondo with their own rules. Ringzeit plans by the style you choose in your profile \u2013 and you can switch it per session."]],src:"Wikipedia (Taekwondo; ITF; DTU); taekwondonation.com; Olympedia"}}]}function tkdShared(e){const n=i=>i.replace("Bandagieren, Aufw\xE4rmen","G\xFCrtel binden, Aufw\xE4rmen").replace("wrapping, warm-up","tying your belt, warm-up"),s=i=>({...i,secs:i.secs.map(([a,l])=>[n(a),n(l)])});return{...e,de:s(e.de),en:s(e.en)}}const RX_PAT={calm:[["in",4],["out",6]],box:[["in",4],["hold",4],["out",4],["hold",4]],sleep:[["in",4],["hold",7],["out",8]]},RX_BMIN=[2,4,6,10],RX_MLEN=[10,15,20,30],RX_GUIDE=3,RX_MED={de:{scan:[["Sch\xF6n, dass du da bist. Such dir eine bequeme Position, im Sitzen oder im Liegen.",1],["Wenn es sich gut anf\xFChlt, schlie\xDF die Augen. Du musst jetzt nichts leisten. Diese Zeit geh\xF6rt dir.",2],["Atme einmal tief ein \u2026 und lass die Luft ganz langsam wieder hinaus.",2],["Sp\xFCr, wie dein K\xF6rper getragen wird. Der Boden h\xE4lt dich. Du darfst schwer werden.",2],["Nimm die Ger\xE4usche um dich herum wahr. Sie d\xFCrfen da sein. Sie ziehen einfach vorbei.",2,15],["Lenk deine Aufmerksamkeit jetzt zu deinen F\xFC\xDFen. Sp\xFCr die Zehen, die Sohlen, die Fersen. Lass sie ganz locker werden.",3],["Wandere weiter zu deinen Unterschenkeln und Knien. Alles, was angespannt ist, darf jetzt weich werden.",3],["Deine Oberschenkel. Sie tragen dich jeden Tag, durch jedes Training. Schenk ihnen einen Moment Ruhe.",3],["Sp\xFCr dein Becken und deinen unteren R\xFCcken. Mit jedem Ausatmen sinkst du ein kleines St\xFCck tiefer.",3],["Dein Bauch hebt und senkt sich ganz von allein. Du musst nichts tun. Der Atem atmet dich.",3],["Sp\xFCr deinen Brustkorb. Dein Herz schl\xE4gt ruhig und gleichm\xE4\xDFig. Es ist immer f\xFCr dich da.",3,20],["Deine Schultern d\xFCrfen jetzt sinken. Lass los, was du heute getragen hast.",3],["Sp\xFCr deine Arme, die Ellbogen, die Unterarme, bis in die H\xE4nde und Fingerspitzen. Schwer und warm.",3],["Dein Nacken wird lang und weich. Dein Kiefer darf sich l\xF6sen, die Zunge liegt locker.",3],["Deine Stirn wird glatt. Rund um die Augen wird alles ganz ruhig.",3],["Sp\xFCr jetzt deinen ganzen K\xF6rper auf einmal, von den Zehen bis zum Scheitel. Ruhig, warm und ganz.",4,20],["Bleib einfach hier, beim Atem. Wenn Gedanken kommen, ist das in Ordnung. Nimm sie wahr und kehr freundlich zum Atem zur\xFCck.",6,30],["Sag dir innerlich: Ich bin ruhig. Ich bin bei mir. Ich bin genug.",4,15],["Du hast dir gerade etwas Gutes getan. Diese Ruhe findest du jederzeit wieder, mit ein paar tiefen Atemz\xFCgen.",2],["Komm jetzt langsam zur\xFCck. Beweg sanft deine Finger und Zehen. Atme einmal tief ein.",1.5],["Und wenn du so weit bist, \xF6ffne die Augen. Nimm diese Ruhe mit.",.3]],strong:[["Willkommen. Setz dich aufrecht und bequem hin. Deine F\xFC\xDFe stehen fest auf dem Boden.",1],["Schlie\xDF die Augen und atme tief ein. Beim Ausatmen l\xE4sst du den Tag hinter dir.",2],["Sp\xFCr deine F\xFC\xDFe auf dem Boden. Du stehst fest. Du bist geerdet.",2],["Atme ruhig weiter. Mit jedem Einatmen kommt neue Kraft. Mit jedem Ausatmen geht, was dich schwer macht.",3],["Denk an einen Moment, in dem du stolz auf dich warst. Im Training, im Wettkampf oder im Alltag. Sieh ihn vor dir.",4,15],["Sp\xFCr, wie sich das angef\xFChlt hat. Diese St\xE4rke ist ein Teil von dir. Sie ist immer da.",3],["Sag dir innerlich: Ich bin stark.",3],["Ich vertraue meinem K\xF6rper und meinem Training.",3],["Ich gebe mein Bestes. Und mein Bestes ist genug.",3],["R\xFCckschl\xE4ge geh\xF6ren dazu. Sie machen mich nicht kleiner. Ich lerne und wachse daran.",3,20],["Ich bleibe ruhig, auch wenn es hart wird. Mein Atem ist mein Anker.",3],["Stell dir vor, wie du in dein n\xE4chstes Training gehst. Konzentriert, wach und mit Freude. Du bist bereit.",4,20],["Bleib einen Moment bei deinem Atem. Ruhig ein, ruhig aus. Sp\xFCr die Kraft, die in dieser Ruhe liegt.",6,30],["Du musst niemandem etwas beweisen. Du gehst deinen Weg, Schritt f\xFCr Schritt.",3,15],["Ich bin stark. Ich bin ruhig. Ich bin bereit.",3],["Atme noch einmal tief ein \u2026 und lass los.",2],["Komm langsam zur\xFCck, beweg Finger und Zehen. \xD6ffne die Augen, wenn du so weit bist. Du kannst stolz auf dich sein.",.3]],sleep:[["Leg dich bequem hin und deck dich zu. Der Tag ist vorbei. Jetzt ist Zeit zum Ausruhen.",1],["Schlie\xDF die Augen. Atme langsam ein \u2026 und noch langsamer wieder aus.",2],["Alles, was heute war, darf jetzt ruhen. Du hast genug getan.",2],["Sp\xFCr, wie das Bett dich tr\xE4gt. Du musst dich nicht mehr festhalten.",2],["Deine F\xFC\xDFe werden schwer und warm.",3],["Deine Beine werden schwer und warm. Sie sinken tiefer in das Bett.",3],["Dein Bauch wird weich. Der Atem flie\xDFt ganz von allein.",3],["Dein R\xFCcken darf loslassen, St\xFCck f\xFCr St\xFCck.",3,15],["Deine Schultern sinken. Deine Arme werden schwer, bis in die Fingerspitzen.",3],["Dein Gesicht entspannt sich. Die Stirn, die Augen, der Mund.",3],["Stell dir einen Ort vor, an dem du dich ganz sicher f\xFChlst. Es ist warm, es ist still, nichts wird von dir erwartet.",5,20],["Wenn Gedanken kommen, lass sie vorbeiziehen wie Wolken. Du musst ihnen nicht folgen.",4,15],["Z\xE4hl deine Atemz\xFCge r\xFCckw\xE4rts, von zehn bis eins. Und wenn du dich verz\xE4hlst, fang einfach von vorn an.",6,30],["Du bist sicher. Du bist ruhig. Du darfst jetzt schlafen.",3],["Ich lasse dich jetzt in der Stille. Schlaf gut.",6]]},en:{scan:[["Good to have you here. Find a comfortable position, sitting or lying down.",1],["If it feels right, close your eyes. There is nothing you need to achieve now. This time is yours.",2],["Take one deep breath in \u2026 and let the air flow out very slowly.",2],["Feel how your body is carried. The ground holds you. You can let yourself get heavy.",2],["Notice the sounds around you. They can be there. They simply pass by.",2,15],["Now bring your attention to your feet. Feel your toes, your soles, your heels. Let them soften completely.",3],["Move on to your lower legs and knees. Whatever is tense can become soft now.",3],["Your thighs. They carry you every day, through every training. Give them a moment of rest.",3],["Feel your hips and your lower back. With every breath out you sink a little deeper.",3],["Your belly rises and falls all by itself. You don't need to do anything. The breath breathes you.",3],["Feel your chest. Your heart beats calmly and steadily. It is always there for you.",3,20],["Let your shoulders drop now. Let go of what you carried today.",3],["Feel your arms, your elbows, your forearms, all the way into your hands and fingertips. Heavy and warm.",3],["Your neck grows long and soft. Your jaw can loosen, your tongue rests easy.",3],["Your forehead becomes smooth. Everything around your eyes grows quiet.",3],["Now feel your whole body at once, from your toes to the top of your head. Calm, warm and whole.",4,20],["Simply stay here, with your breath. If thoughts come, that's fine. Notice them and kindly return to your breath.",6,30],["Say to yourself: I am calm. I am here. I am enough.",4,15],["You just did something good for yourself. You can find this calm again anytime, with a few deep breaths.",2],["Now slowly come back. Gently move your fingers and toes. Take one deep breath in.",1.5],["And when you're ready, open your eyes. Take this calm with you.",.3]],strong:[["Welcome. Sit upright and comfortably. Your feet rest firmly on the floor.",1],["Close your eyes and breathe in deeply. As you breathe out, leave the day behind you.",2],["Feel your feet on the floor. You stand firm. You are grounded.",2],["Keep breathing calmly. Every breath in brings new strength. Every breath out lets go of what weighs you down.",3],["Think of a moment when you were proud of yourself. In training, in a fight or in everyday life. See it in front of you.",4,15],["Feel how that felt. This strength is part of you. It is always there.",3],["Say to yourself: I am strong.",3],["I trust my body and my training.",3],["I give my best. And my best is enough.",3],["Setbacks are part of it. They don't make me smaller. I learn and grow from them.",3,20],["I stay calm, even when it gets hard. My breath is my anchor.",3],["Picture yourself walking into your next training. Focused, awake and with joy. You are ready.",4,20],["Stay with your breath for a moment. Calm in, calm out. Feel the strength that lies in this calm.",6,30],["You don't have to prove anything to anyone. You walk your own path, step by step.",3,15],["I am strong. I am calm. I am ready.",3],["Take one more deep breath in \u2026 and let go.",2],["Slowly come back, move your fingers and toes. Open your eyes when you're ready. You can be proud of yourself.",.3]],sleep:[["Lie down comfortably and pull up your blanket. The day is over. Now it's time to rest.",1],["Close your eyes. Breathe in slowly \u2026 and out even more slowly.",2],["Everything that happened today can rest now. You have done enough.",2],["Feel how the bed carries you. You don't need to hold on any more.",2],["Your feet become heavy and warm.",3],["Your legs become heavy and warm. They sink deeper into the bed.",3],["Your belly softens. The breath flows all by itself.",3],["Your back can let go, bit by bit.",3,15],["Your shoulders drop. Your arms become heavy, all the way to your fingertips.",3],["Your face relaxes. Your forehead, your eyes, your mouth.",3],["Imagine a place where you feel completely safe. It is warm, it is quiet, nothing is expected of you.",5,20],["If thoughts come, let them drift by like clouds. You don't have to follow them.",4,15],["Count your breaths backwards, from ten to one. And if you lose count, simply start again.",6,30],["You are safe. You are calm. You may sleep now.",3],["I'll leave you in the quiet now. Sleep well.",6]]}},RXT={de:{title:"Entspannen",intro:"Runterfahren, durchatmen, Kraft sammeln. Am besten mit Kopfh\xF6rern, an einem ruhigen Ort.",breath:"Atem\xFCbung",med:"Meditation",pats:{calm:"Runterfahren",box:"Box-Atmung",sleep:"Einschlafen"},patInfo:{calm:"4 Sekunden ein, 6 Sekunden aus. Das l\xE4ngere Ausatmen beruhigt.",box:"4 ein \xB7 4 halten \xB7 4 aus \xB7 4 halten. Sammelt dich, z. B. vor einem Kampf oder einer Pr\xFCfung.",sleep:"4 ein \xB7 7 halten \xB7 8 aus. Sehr ruhig, gut zum Einschlafen."},kinds:{scan:"Body-Scan",strong:"St\xE4rken",sleep:"Einschlafen"},kindInfo:{scan:"Aufmerksamkeit Schritt f\xFCr Schritt durch den K\xF6rper. L\xE4sst Spannung los.",strong:"Atem, Haltung und st\xE4rkende S\xE4tze. F\xFCr Selbstvertrauen und einen klaren Kopf.",sleep:"Schwer und warm werden, Gedanken ziehen lassen. Endet leise, ohne Zur\xFCckholen."},dur:"Dauer",voice:"Stimme",tone:"Leiser Ton beim Wechsel",start:"Starten",again:"Noch einmal",close:"Schlie\xDFen",stop:"Beenden",eyes:"Augen zu \u2013 ich f\xFChre dich.",tap:"Antippen f\xFCr mehr Licht",noVoice:"Dieses Ger\xE4t hat keine Sprachausgabe. Die \xDCbung l\xE4uft mit Kreis und Ton.",mute:"Stummschalter auf Ton stellen, sonst bleibt die Stimme still.",safe:"Bei Schwindel einfach normal weiteratmen. Bei Atemnot oder Herzrasen bitte \xE4rztlich abkl\xE4ren. Lange Haltephasen nicht in der Schwangerschaft oder bei Herzproblemen ohne R\xFCcksprache.",done:"Sch\xF6n gemacht.",doneSub:"Sp\xFCr kurz nach, wie es dir jetzt geht.",evening:"Sp\xE4ter Abend \u2013 zum Einschlafen vorausgew\xE4hlt.",ph:{in:"Einatmen",hold:"Halten",out:"Ausatmen"},sIntro:{calm:"Mach es dir bequem. Wir atmen vier Sekunden ein und sechs Sekunden aus. Ich begleite dich durch die ersten Atemz\xFCge.",box:"Setz dich aufrecht hin. Wir atmen im Quadrat: vier ein, vier halten, vier aus, vier halten. Ich z\xE4hle die ersten Runden mit dir.",sleep:"Leg dich bequem hin. Vier ein, sieben halten, acht aus. Ich begleite dich durch die ersten Atemz\xFCge."},sHand:"Gut so. Halte diesen Rhythmus jetzt selbst. Ich bin da und begleite dich leise.",sEnc:["Du machst das gut.","Mit jedem Ausatmen darf etwas mehr Spannung gehen.","Du musst gerade nichts leisten. Nur atmen.","Bleib freundlich mit dir. Jeder Atemzug z\xE4hlt.","Sp\xFCr, wie ruhig du werden kannst."],sLast:"Noch drei Atemz\xFCge.",sEnd:{calm:"Lass den Atem jetzt wieder frei flie\xDFen. Sch\xF6n, dass du dir diese Zeit genommen hast. Du hast heute etwas Gutes f\xFCr dich getan.",box:"Lass den Atem wieder frei flie\xDFen. Du bist ruhig, klar und bereit.",sleep:"Lass den Atem jetzt einfach geschehen. Du darfst loslassen. Schlaf gut."},card:e=>`Ruhetag \u2013 ${e} Minuten runterfahren?`,cardDeload:e=>`Entlastungswoche \u2013 ${e} Minuten bewusst durchatmen?`,cardBtn:"Atmen",cardMore:"Mehr",lifeRow:"Atem\xFCbungen und Meditationen zum Runterfahren und Kraft sammeln"},en:{title:"Relax",intro:"Wind down, breathe, gather strength. Best with headphones, somewhere quiet.",breath:"Breathing",med:"Meditation",pats:{calm:"Wind down",box:"Box breathing",sleep:"Fall asleep"},patInfo:{calm:"4 seconds in, 6 seconds out. The longer exhale calms you.",box:"4 in \xB7 4 hold \xB7 4 out \xB7 4 hold. Centres you, e.g. before a fight or a grading.",sleep:"4 in \xB7 7 hold \xB7 8 out. Very calm, good for falling asleep."},kinds:{scan:"Body scan",strong:"Strengthen",sleep:"Fall asleep"},kindInfo:{scan:"Attention moves step by step through the body. Lets tension go.",strong:"Breath, posture and strengthening words. For self-confidence and a clear head.",sleep:"Grow heavy and warm, let thoughts drift. Ends softly without bringing you back."},dur:"Length",voice:"Voice",tone:"Soft tone on each change",start:"Start",again:"Again",close:"Close",stop:"Stop",eyes:"Eyes closed \u2013 I'll guide you.",tap:"Tap for more light",noVoice:"This device has no speech output. The exercise runs with circle and tone.",mute:"Set the side switch to sound, or the voice stays silent.",safe:"If you feel dizzy, simply breathe normally. With shortness of breath or a racing heart, please see a doctor. Long breath holds only after medical advice during pregnancy or with heart problems.",done:"Well done.",doneSub:"Notice for a moment how you feel now.",evening:"Late evening \u2013 fall asleep preselected.",ph:{in:"Breathe in",hold:"Hold",out:"Breathe out"},sIntro:{calm:"Make yourself comfortable. We breathe in for four seconds and out for six. I'll guide you through the first breaths.",box:"Sit upright. We breathe in a square: four in, four hold, four out, four hold. I'll count the first rounds with you.",sleep:"Lie down comfortably. Four in, seven hold, eight out. I'll guide you through the first breaths."},sHand:"Good. Now keep this rhythm on your own. I'm here and stay with you quietly.",sEnc:["You're doing well.","With every breath out, a little more tension can go.","There is nothing to achieve right now. Just breathe.","Be kind to yourself. Every breath counts.","Feel how calm you can become."],sLast:"Three more breaths.",sEnd:{calm:"Now let your breath flow freely again. Good that you took this time. You did something good for yourself today.",box:"Let your breath flow freely again. You are calm, clear and ready.",sleep:"Now simply let the breath happen. You may let go. Sleep well."},card:e=>`Rest day \u2013 ${e} minutes to wind down?`,cardDeload:e=>`Deload week \u2013 ${e} minutes of mindful breathing?`,cardBtn:"Breathe",cardMore:"More",lifeRow:"Breathing and meditations to wind down and gather strength"}},rxT=()=>RXT[S.profile.lang]||RXT.de,rxEvening=(e=new Date)=>e.getHours()>=20||e.getHours()<4;function rxPrefs(){const e=S.profile.relax&&typeof S.profile.relax=="object"?S.profile.rel
